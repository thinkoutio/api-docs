  /cash-flow-views/{id}:
    get:
      tags:
        - Rapoarte
      operationId: renderCashFlowView
      summary: Calculează un raport de cash flow
      description: |-
        Calculează un raport salvat și îi întoarce cifrele ca rânduri plate.

        Opțiunile salvate ale raportului sunt valorile implicite. Trimiterea parametrilor `period`, `from`, `to`, `interval` sau `currency` le suprascrie doar pentru cererea curentă; nimic nu se salvează. Un raport poate stoca o fereastră relativă, de exemplu următoarele șase luni, care este rezolvată aici și raportată în `period`.

        **Cifrele reale și cele previzionate nu sunt niciodată amestecate.** Fiecare rând conține cifre `actual` și, când raportul include previziuni, cifre `forecast` separate. Ecranul din ThinkOut arată suma lor, deci adunându-le obții exact ce vezi acolo.

        Modul de numărare diferă de `/transactions/summary`, în mod deliberat. O sinteză elimină complet transferurile și tranzacțiile excluse. Un raport de cash flow le raportează ca linii proprii de sold, alături de soldul inițial și cel final, așa cum funcționează situația de cash flow a produsului. Cele două vor da deci răspunsuri diferite la ceea ce pare aceeași întrebare, iar fiecare spune ce reguli a folosit.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/interval'
        - $ref: '#/components/parameters/currency'
      responses:
        '200':
          description: Raportul calculat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowViewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/rapoarte/calculeaza-un-raport-de-cash-flow
  /categories:
    get:
      tags:
        - Categorii
      operationId: listCategories
      summary: Listează categoriile
      description: |-
        Întoarce arborele de categorii aplatizat, în ordinea în care îl afișează ThinkOut: încasările mai întâi, apoi plățile, iar în fiecare direcție fiecare categorie de nivel superior urmată imediat de copiii ei. Categoriile de pe același nivel urmează `position`. Citită de sus în jos, pagina redă așadar ecranul de categorii al produsului. `direction` restrânge la unul dintre cele două panouri.

        Reconstruiește ierarhia cu `parent_id` și resortează după `position` în cadrul fiecărui `parent_id` dacă ai nevoie din nou de ordine după ce ai stocat rândurile.

        Arborele are exact două niveluri. O categorie cu `parent_id` nu are niciodată copii proprii, iar ambele niveluri pot apărea pe o tranzacție. `direction` și `activity` ale unui copil coincid întotdeauna cu ale rădăcinii lui.
      parameters:
        - $ref: '#/components/parameters/direction'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: O pagină de categorii.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/List'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/categorii/listeaza-categoriile
  /categories/{id}:
    get:
      tags:
        - Categorii
      operationId: getCategory
      summary: Citește o categorie
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Categoria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        href: /ro/api-reference/categorii/citeste-o-categorie
  /counterparties:
    get:
      tags:
        - Parteneri
      operationId: listCounterparties
      summary: Listează partenerii
      description: Întoarce partenerii ordonați după `name`, apoi după `id`.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: O pagină de parteneri.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/List'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Counterparty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/parteneri/listeaza-partenerii
  /counterparties/{id}:
    get:
      tags:
        - Parteneri
      operationId: getCounterparty
      summary: Citește un partener
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Partenerul.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counterparty'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        href: /ro/api-reference/parteneri/citeste-un-partener
  /labels:
    get:
      tags:
        - Etichete
      operationId: listLabels
      summary: Listează etichetele
      description: Întoarce etichetele ordonate după `name`, apoi după `id`. Nu există filtre. Fiecare etichetă își poartă tipul, așa că un apelant care vrea etichetele grupate pe tipuri grupează pagina pe care o are deja.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: O pagină de etichete.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/List'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Label'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/etichete/listeaza-etichetele
  /labels/{id}:
    get:
      tags:
        - Etichete
      operationId: getLabel
      summary: Citește o etichetă
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Eticheta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        href: /ro/api-reference/etichete/citeste-o-eticheta
  /forecasts:
    get:
      tags:
        - Previziuni
      operationId: listForecasts
      summary: Listează previziunile
      description: Întoarce previziunile cu dată, ordonate după `date` descrescător, apoi după `id`. Previziunile fără dată nu sunt incluse în versiunea 1.
      parameters:
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/category_id'
        - $ref: '#/components/parameters/label_id'
        - $ref: '#/components/parameters/counterparty_id'
        - $ref: '#/components/parameters/direction'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ForecastStatus'
        - $ref: '#/components/parameters/forecast_expand'
