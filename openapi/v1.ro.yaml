                          $ref: '#/components/schemas/Forecast'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/previziuni/listeaza-previziunile
  /forecasts/{id}:
    get:
      tags:
        - Previziuni
      operationId: getForecast
      summary: Citește o previziune
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/forecast_expand'
      responses:
        '200':
          description: Previziunea.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forecast'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        href: /ro/api-reference/previziuni/citeste-o-previziune
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: O cheie API creată în setările ThinkOut. O cheie citește un singur spațiu de lucru.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    from:
      name: from
      in: query
      description: Cea mai veche `date` inclusă, inclusiv. Ignorat când este trimis `period`.
      schema:
        type: string
        format: date
    to:
      name: to
      in: query
      description: Cea mai recentă `date` inclusă, inclusiv. Ignorat când este trimis `period`.
      schema:
        type: string
        format: date
    direction:
      name: direction
      in: query
      schema:
        $ref: '#/components/schemas/Direction'
    bank_id:
      name: bank_id
      in: query
      description: Doar rândurile de pe conturile alimentate de aceste conexiuni bancare. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    account_id:
      name: account_id
      in: query
      description: Doar rândurile de pe aceste conturi. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    category_id:
      name: category_id
      in: query
      description: Doar rândurile din aceste categorii. Separate prin virgulă pentru mai multe. La tranzacții, se potrivește și cu o tranzacție împărțită ale cărei bucăți se află în una dintre ele, chiar dacă rândul în sine nu are categorie.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    label_id:
      name: label_id
      in: query
      description: Doar rândurile care poartă cel puțin una dintre aceste etichete. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    counterparty_id:
      name: counterparty_id
      in: query
      description: Doar rândurile atribuite acestor parteneri. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    transaction_expand:
      name: expand
      in: query
      description: |-
        Relații de întors ca obiecte complete în loc de identificatori. Separate prin virgulă.

        Fără el, fiecare relație este un identificator. Numind una aici, identificatorul este înlocuit cu obiectul către care arată. Extinderea merge un singur nivel; un nume nesuportat este respins.

        Aici se acceptă: `account`, `category`, `counterparty`, `labels`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - account
            - category
            - counterparty
            - labels
      example: category,counterparty
    account_expand:
      name: expand
      in: query
      description: |-
        Relații de întors ca obiecte complete în loc de identificatori. Separate prin virgulă.

        Fără el, fiecare relație este un identificator. Numind una aici, identificatorul este înlocuit cu obiectul către care arată. Extinderea merge un singur nivel; un nume nesuportat este respins.

        Aici se acceptă: `bank`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - bank
      example: bank
    forecast_expand:
      name: expand
      in: query
      description: |-
        Relații de întors ca obiecte complete în loc de identificatori. Separate prin virgulă.

        Fără el, fiecare relație este un identificator. Numind una aici, identificatorul este înlocuit cu obiectul către care arată. Extinderea merge un singur nivel; un nume nesuportat este respins.

        Aici se acceptă: `category`, `counterparty`, `labels`, `linked_transactions`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - category
            - counterparty
            - labels
            - linked_transactions
      example: category,linked_transactions
    as_of:
      name: as_of
      in: query
      description: Calculează soldurile la sfârșitul acestei zile. Implicit ziua curentă în UTC. O dată din viitor este respinsă, pentru că un sold este întotdeauna istoric.
      schema:
        type: string
        format: date
    period:
      name: period
      in: query
      description: O fereastră de timp cu nume, rezolvată pe server și raportată înapoi în răspuns. Folosește-o în locul lui `from` și `to` ca să nu calculezi tu datele. Când sunt trimise ambele, `period` are prioritate.
      schema:
        $ref: '#/components/schemas/PeriodMacro'
    interval:
      name: interval
      in: query
      description: Intervalul de timp în care sunt grupate rândurile.
      schema:
        $ref: '#/components/schemas/Interval'
    currency:
      name: currency
      in: query
      description: Moneda în care sunt raportate totalurile. Implicit moneda spațiului de lucru. Obiectul `conversion` din răspuns spune dacă s-a făcut conversie și pe ce bază.
      schema:
        $ref: '#/components/schemas/Currency'
    limit:
      name: limit
      in: query
      description: Dimensiunea paginii.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    cursor:
      name: cursor
      in: query
      description: Token opac din `next_cursor` al paginii anterioare.
      schema:
        type: string
  responses:
    BadRequest:
      description: Un parametru este invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request
              code: invalid_parameter
              message: Parameter 'from' must be a date in YYYY-MM-DD format.
              param: from
              request_id: "0HNF8K3QJL2VM:00000001"
    Unauthorized:
      description: Cheia API lipsește, este necunoscută sau revocată.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: authentication
              code: unauthorized
              message: Invalid API key.
              param: null
              request_id: "0HNF8K3QJL2VM:00000001"
    NotFound:
      description: Nu există niciun obiect cu acest id în spațiul de lucru al cheii.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: not_found
              code: resource_not_found
              message: No transaction with id 8f1c0a4e-2b1d-4c8e-9f3a-7d6e5c4b3a21.
              param: id
              request_id: "0HNF8K3QJL2VM:00000001"
    RequestTooLarge:
      description: Cererea este validă, dar ar calcula mai mult decât are voie un raport. Mesajul numește atât ce s-a cerut, cât și plafonul, ca cererea să poată fi restrânsă fără ghicit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request
              code: too_many_groups
              message: Grouping by counterparty over this period produces 4,182 groups. The maximum is 1,000. Narrow the period or the filters.
              param: group_by
              request_id: "0HNF8K3QJL2VM:00000001"
    RateLimited:
      description: Prea multe cereri. Așteaptă numărul de secunde din `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Secunde de așteptat înainte de a reîncerca.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: rate_limit
              code: rate_limited
              message: Rate limit exceeded. Retry after 12 seconds.
              param: null
              request_id: "0HNF8K3QJL2VM:00000001"
  schemas:
    Money:
      type: string
      description: 'Sumă zecimală ca șir de caractere. Cu semn la tranzacții, previziuni și cifre din rapoarte, unde negativ înseamnă ieșire. Semnul este cel care contează: `direction` este derivat din el, iar cele două nu pot fi niciodată în contradicție.'
      pattern: ^-?[0-9]+(\.[0-9]+)?$
      example: '-1250.00'
    Currency:
      type: string
      description: Cod de monedă alfabetic ISO 4217.
      pattern: ^[A-Z]{3}$
      example: RON
    Direction:
      type: string
      description: Dacă banii intră sau ies. Pe o tranzacție sau pe o previziune urmează semnul lui `amount` și nu îl poate contrazice niciodată. Există ca răspunsurile să poată fi grupate și citite fără să inspectezi semnele.
      enum:
        - inflow
        - outflow
    Activity:
      type: string
      description: Secțiunea din situația fluxurilor de numerar căreia îi aparține categoria.
      enum:
        - operating
        - investing
        - financing
    TransactionStatus:
      type: string
      description: Tranzacțiile `pending` vin de la bancă și nu sunt încă înregistrate. Suma unei tranzacții în așteptare se poate schimba când se înregistrează, iar `updated_at` se modifică atunci, deci actualizează după `id` în loc să tratezi un rând în așteptare ca final.
      enum:
        - booked
        - pending
    TransactionSource:
      type: string
      description: Cum a intrat tranzacția în ThinkOut.
      enum:
        - manual
        - import
        - bank
    AccountSource:
      type: string
      description: Conturile `delegated` sunt conturi bancare pe care alt spațiu de lucru le-a delegat către acesta.
      enum:
        - manual
        - bank
        - delegated
    ForecastStatus:
      type: string
      description: '`planned` este în viitor, fără tranzacții asociate. `overdue` este în trecut, fără niciuna. `partial` are unele tranzacții asociate. `realised` este completă.'
      enum:
        - planned
        - overdue
        - partial
        - realised
    RecurrenceInterval:
      type: string
      enum:
        - day
        - week
        - month
        - year
    Interval:
      type: string
      description: O perioadă de grupare pentru rândurile de raport. Aceleași perioade pe care le oferă ecranul de cash flow din ThinkOut.
      enum:
        - day
        - week
        - month
      default: month
    PeriodMacro:
      type: string
      description: O fereastră de timp cu nume, rezolvată pe server. Datele la care s-a rezolvat sunt întotdeauna raportate înapoi, ca cel care apelează să verifice că a cerut fereastra la care se gândea.
      enum:
        - this_month
        - last_month
        - this_quarter
        - last_quarter
        - this_year
        - last_year
        - month_to_date
        - quarter_to_date
        - year_to_date
        - last_30_days
        - last_90_days
        - last_12_months
    GroupDimension:
      type: string
      description: O dimensiune după care se grupează rândurile raportului, pe lângă intervalul de timp.
      enum:
        - category
        - counterparty
        - label
        - account
        - activity
        - direction
    ForecastGroupDimension:
      type: string
      description: La fel ca `GroupDimension`, plus statusul previziunii. Previziunile nu au cont.
      enum:
        - category
        - counterparty
        - label
        - activity
        - direction
        - status
    List:
      type: object
      required:
        - object
        - data
        - has_more
        - next_cursor
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items: {}
        has_more:
          type: boolean
          description: Dacă mai există o pagină.
        next_cursor:
          type:
            - string
            - 'null'
          description: Trimite-l ca `cursor` pentru pagina următoare. `null` pe ultima pagină.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - code
            - message
            - param
            - request_id
          properties:
            type:
              type: string
              enum:
                - invalid_request
                - authentication
                - not_found
                - rate_limit
                - server
            code:
              type: string
              description: Motiv stabil, citibil de o mașină. Ramifică pe acesta, nu pe `message`. Codurile specifice rapoartelor sunt `too_many_groups`, `period_too_long`, `as_of_in_future` și `invalid_expand`.
            message:
              type: string
              description: Explicație pentru oameni, în engleză. Formularea se poate schimba.
            param:
              type:
                - string
                - 'null'
              description: Parametrul de query sau de cale vinovat, când există unul.
            request_id:
              type: string
              description: Menționează-l când contactezi suportul.
    ResolvedPeriod:
      type: object
      description: Fereastra efectiv calculată, după rezolvarea oricărei macrocomenzi sau a datelor relative salvate.
      required:
        - from
        - to
        - macro
        - interval
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        macro:
          oneOf:
            - $ref: '#/components/schemas/PeriodMacro'
            - type: 'null'
          description: Macrocomanda care a produs aceste date, sau `null` când au fost trimise direct.
        interval:
          $ref: '#/components/schemas/Interval'
    Conversion:
      type: object
      description: Ce s-a făcut pentru ca sumele să fie comparabile.
      required:
        - applied
        - currency
        - basis
      properties:
        applied:
          type: boolean
          description: '`false` când toate sumele erau deja în `currency`.'
        currency:
          $ref: '#/components/schemas/Currency'
        basis:
          type: string
          description: '`transaction_date` convertește fiecare mișcare la cursul din propria ei dată, ceea ce folosesc totalurile peste mișcări. `balance_date` convertește un sold întreg la un singur curs, ceea ce folosesc soldurile, pentru că un cont ține o singură monedă.'
          enum:
            - transaction_date
            - balance_date
            - none
    ReportGroup:
      type: object
      description: După ce este grupat un rând de raport. `null` la rândurile grupate doar pe interval.
      required:
        - dimension
