    SkipReason:
      type: string
      description: |
        Why an item was left as it is.

        `not_found`: no such item in the workspace. `unchanged`: it already holds the value.
        `direction_mismatch`: a category or forecast for money in was given for money out, or
        the other way round. `split`: the transaction is split into parts, which are changed in
        ThinkOut. `already_transfer`: the transaction is already part of a transfer. `not_transfer`:
        it is not part of a transfer. `same_direction`: both sides of a pair are money in, or both
        money out. `same_account`: both sides of a pair are in one account. `excluded`: the
        transaction is excluded from cash flow; include it first. `pending`: the transaction is
        still pending at the bank. `suggestion_closed`: the suggestion was already accepted or
        dismissed. `already_linked`: the transaction is already matched to that forecast.
        `not_linked`: it is not matched to that forecast. `already_realised`: the forecast is
        already closed. `not_realised`: the forecast is open. `has_links`: transactions are
        still matched to the forecast; unmatch them instead of reopening. `not_on_budgets`: the
        category is not shown on budgets. `already_set`: a rule would replace a category or
        counterparty that is already set.
      enum:
        - not_found
        - unchanged
        - direction_mismatch
        - split
        - already_transfer
        - not_transfer
        - same_direction
        - same_account
        - excluded
        - pending
        - suggestion_closed
        - already_linked
        - not_linked
        - already_realised
        - not_realised
        - has_links
        - not_on_budgets
        - already_set

    SkippedItem:
      type: object
