        Rândurile grupate doar pe perioadă poartă ce arată ecranul de cash flow pentru perioada aceea: fluxurile, plus soldul de început, transferurile, mișcările excluse și soldul de final al conturilor din perimetru. Rândurile grupate după o a doua dimensiune poartă doar fluxurile, pentru că un sold per partener sau per categorie nu înseamnă nimic. `totals` acoperă întregul interval, ca apelantul să nu adune niciodată rânduri.

