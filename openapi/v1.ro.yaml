                            month: null
                            reason: already_linked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '422':
          $ref: '#/components/responses/WriteInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
