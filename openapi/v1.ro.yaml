                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: '#/components/schemas/ForecastLinkChange'
                      skipped:
                        type: array
                        items:
                          $ref: '#/components/schemas/SkippedItem'
                        example:
                          - item_kind: link_suggestion
                            id: 4d5e6f70-8192-4a3b-8c4d-5e6f708192a3
                            month: null
                            reason: suggestion_closed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '422':
          $ref: '#/components/responses/WriteInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/previziuni/accepta-sugestiile-de-asociere-cu-previziuni
  /budgets/values:
    post:
      tags:
        - Bugete
      operationId: setBudgetValues
      summary: Setează valori de buget
      description: |-
        Setează bugetul unei categorii pentru o lună, sau pentru fiecare lună de la `month` până la `repeat_until`, la fel ca introducerea valorii pe ecranul de bugete. Sumele sunt în moneda spațiului de lucru.

        Suprascrie o valoare setată manual. ThinkOut nu păstrează altă copie a valorii vechi, așa că fiecare modificare o întoarce ca `before`.

        O categorie cu subcategorii primește un buget pentru întreaga ei ramură (`kind` este `hierarchy`). Doar categoriile afișate pe bugete primesc o valoare; celelalte sunt omise cu motivul `not_on_budgets`. O lună care are deja suma este omisă cu motivul `unchanged`.

        Până la 100 de luni pe apel, numărând fiecare lună acoperită de o repetare. Lunile trebuie să fie la cel mult zece ani de luna curentă. Nu alege ce categorii apar pe bugete, nu șterge un interval de valori și nu copiază un scenariu în bugete.
      parameters:
        - $ref: '#/components/parameters/dry_run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - values
              properties:
                values:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - category_id
                      - month
                      - amount
                    properties:
                      category_id:
                        type: string
                        format: uuid
                      month:
                        type: string
                        pattern: ^[0-9]{4}-[0-9]{2}$
                        description: Luna de setat, de exemplu `2026-03`.
                      amount:
                        type: number
                        description: Suma, cu semn, cum o arată `GET /budgets/summary`. Pozitivă pentru o categorie de încasări, negativă pentru o categorie de plăți.
                      repeat_until:
                        type:
                          - string
                          - 'null'
                        pattern: ^[0-9]{4}-[0-9]{2}$
                        description: Ultima lună pentru care se setează aceeași sumă, de exemplu `2026-12`. Nu poate fi înainte de `month`.
            example:
              values:
                - category_id: 2a3b4c5d-6e7f-4809-8a1b-2c3d4e5f6a7b
                  month: 2026-01
                  amount: -4000
                  repeat_until: 2026-12
      responses:
        '200':
          description: Ce s-a modificat sau, la o simulare cu `dry_run`, ce s-ar modifica.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WriteResult'
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: '#/components/schemas/BudgetValueChange'
                      skipped:
                        type: array
                        items:
                          $ref: '#/components/schemas/SkippedItem'
                        example:
                          - item_kind: budget
                            id: 2a3b4c5d-6e7f-4809-8a1b-2c3d4e5f6a7b
                            month: 2026-02
                            reason: unchanged
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '422':
          $ref: '#/components/responses/WriteInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/bugete/seteaza-valori-de-buget
  /budgets/values/clear:
    post:
      tags:
        - Bugete
      operationId: clearBudgetValues
      summary: Șterge valori de buget
      description: |-
        Șterge bugetul setat manual pentru o categorie și o lună, la fel ca eliminarea valorii pe ecranul de bugete. Ecranul arată apoi suma bugetelor subcategoriilor, sau zero. Fiecare modificare întoarce valoarea ștearsă ca `before`.

        Până la 100 de perechi categorie-lună pe apel, la cel mult zece ani de luna curentă. O lună fără valoare setată manual este omisă cu motivul `unchanged`.
      parameters:
        - $ref: '#/components/parameters/dry_run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - values
              properties:
                values:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - category_id
                      - month
                    properties:
                      category_id:
                        type: string
                        format: uuid
                      month:
                        type: string
                        pattern: ^[0-9]{4}-[0-9]{2}$
                        description: Luna de șters, de exemplu `2026-03`.
      responses:
        '200':
          description: Ce s-a modificat sau, la o simulare cu `dry_run`, ce s-ar modifica.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WriteResult'
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: '#/components/schemas/BudgetValueChange'
                      skipped:
                        type: array
                        items:
                          $ref: '#/components/schemas/SkippedItem'
                        example:
                          - item_kind: budget
                            id: 2a3b4c5d-6e7f-4809-8a1b-2c3d4e5f6a7b
                            month: 2026-03
                            reason: unchanged
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '422':
          $ref: '#/components/responses/WriteInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/bugete/sterge-valori-de-buget
  /transaction-rules:
    post:
      tags:
        - Reguli de categorisire
      operationId: createTransactionRule
      summary: Creează o regulă
      description: |-
        Creează o regulă de categorisire: o condiție pe tranzacții și ce se setează pe cele care se potrivesc. ThinkOut o aplică fiecărei tranzacții noi pe care o importă. Crearea unei reguli nu modifică tranzacțiile trecute; pentru ele folosește `POST /transaction-rules/{id}/apply`.

        O regulă setează doar ce setează celelalte endpointuri de scriere, din elemente care există în spațiul de lucru. `recent_matches` din modificare arată ce tranzacții din ultimele 90 de zile se potrivesc condiției, așa că rulează mai întâi o simulare cu `dry_run` ca să verifici condiția.

        API-ul nu listează regulile; instrumentul MCP `list_transaction_rules` le listează, în aceeași formă pe care o primește acest endpoint.
      parameters:
        - $ref: '#/components/parameters/dry_run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleInput'
            example:
              condition:
                operation: and
                conditions:
                  - property: description
                    criteria: contains
                    value: ORANGE ROMANIA
                  - property: direction
                    criteria: equals
                    value: outflow
              effect:
                category_id: 2a3b4c5d-6e7f-4809-8a1b-2c3d4e5f6a7b
                counterparty_id: 8b9c0d1e-2f3a-4b5c-8d6e-7f8a9b0c1d2e
                label_ids: []
                exclude: false
                mark_transfer: false
              comment: Phone and internet.
      responses:
        '200':
          description: Regula nouă sau, la o simulare cu `dry_run`, regula așa cum ar fi creată.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WriteResult'
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: '#/components/schemas/RuleChange'
                      skipped:
                        type: array
                        items:
                          $ref: '#/components/schemas/SkippedItem'
                        example: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/WriteInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/reguli-de-categorisire/creeaza-o-regula
  /transaction-rules/{id}:
    put:
      tags:
        - Reguli de categorisire
      operationId: editTransactionRule
      summary: Modifică o regulă
      description: 'Înlocuiește condiția, efectul și comentariul unei reguli existente. Trimite definiția completă: tot ce lipsește este eliminat. O regulă creată automat de ThinkOut devine o regulă scrisă de utilizator. O definiție identică cu cea curentă este omisă cu motivul `unchanged`. Modificarea nu atinge tranzacțiile trecute.'
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/dry_run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleInput'
      responses:
        '200':
          description: Regula înainte și după sau, la o simulare cu `dry_run`, cum ar fi.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WriteResult'
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: '#/components/schemas/RuleChange'
                      skipped:
                        type: array
                        items:
                          $ref: '#/components/schemas/SkippedItem'
                        example:
                          - item_kind: rule
                            id: 8f9a0b1c-2d3e-4f40-8a5b-6c7d8e9f0a1b
                            month: null
                            reason: unchanged
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/WriteInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/reguli-de-categorisire/modifica-o-regula
    delete:
      tags:
        - Reguli de categorisire
      operationId: deleteTransactionRule
      summary: Șterge o regulă
      description: |-
        Șterge o regulă, așa că ThinkOut nu o mai aplică tranzacțiilor noi. Ce a făcut deja pe tranzacțiile trecute rămâne. Evidența tranzacțiilor pe care le-a atins se șterge odată cu ea.

        Modificarea întoarce regula întreagă ca `before`.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/dry_run'
      responses:
        '200':
          description: Regula ștearsă sau, la o simulare cu `dry_run`, regula care ar fi ștearsă.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WriteResult'
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: '#/components/schemas/RuleChange'
                      skipped:
                        type: array
                        items:
                          $ref: '#/components/schemas/SkippedItem'
                        example: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/WriteInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/reguli-de-categorisire/sterge-o-regula
  /transaction-rules/{id}/apply:
    post:
      tags:
        - Reguli de categorisire
      operationId: applyTransactionRule
      summary: Aplică o regulă tranzacțiilor trecute
      description: |-
        Aplică o regulă existentă tranzacțiilor trecute dintr-un interval de date care se potrivesc condiției ei. Se modifică cel mult 100 de tranzacții pe apel, de la cea mai nouă. `not_applied` numără tranzacțiile rămase pentru apelul următor, așa că apelează din nou până ajunge la `0`.

        Fără `overwrite` completează doar ce lipsește: o tranzacție necategorisită primește categoria, una fără partener primește partenerul, iar etichetele se adaugă. O categorie sau un partener deja setat se păstrează și apare în `kept`. Cu `overwrite` le înlocuiește și pe acestea, inclusiv valorile setate manual.

        Tranzacțiile excluse, transferurile și tranzacțiile împărțite în bucăți sunt omise.

        Ca atunci când un utilizator aplică regula în ThinkOut, fiecare tranzacție modificată arată regula printre regulile aplicate, iar numărul de utilizări al regulii crește cu unu pentru fiecare tranzacție. Numărul de utilizări decide ce regulă câștigă când mai multe se potrivesc la o sincronizare bancară.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/dry_run'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                  description: Prima zi verificată. Implicit acum douăsprezece luni, cea mai veche dată permisă.
                to:
                  type: string
                  format: date
                  description: Ultima zi verificată, inclusiv. Implicit azi.
                overwrite:
                  type: boolean
                  default: false
                  description: '`true` înlocuiește și o categorie sau un partener deja setat, inclusiv unul setat manual.'
      responses:
        '200':
          description: Ce s-a modificat sau, la o simulare cu `dry_run`, ce s-ar modifica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleApplyResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/WriteInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/reguli-de-categorisire/aplica-o-regula-tranzactiilor-trecute
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: O cheie API creată în setările ThinkOut. O cheie are acces la un singur spațiu de lucru. O cheie creată cu acces de citire și modificare poate apela și endpointurile de scriere.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    from:
      name: from
      in: query
      description: Cea mai veche `date` inclusă, inclusiv.
      schema:
        type: string
        format: date
    to:
      name: to
      in: query
      description: Cea mai recentă `date` inclusă, inclusiv.
      schema:
        type: string
        format: date
    direction:
      name: direction
      in: query
      schema:
        $ref: '#/components/schemas/Direction'
    activity:
      name: activity
      in: query
      description: Doar rândurile a căror categorie se află în aceste secțiuni ale situației fluxurilor de numerar. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Activity'
    bank_id:
      name: bank_id
      in: query
      description: Doar rândurile de pe conturile alimentate de aceste conexiuni bancare. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    account_id:
      name: account_id
      in: query
      description: Doar rândurile de pe aceste conturi. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    category_id:
      name: category_id
      in: query
      description: Doar rândurile din aceste categorii. Separate prin virgulă pentru mai multe. Pe `/transactions` se potrivește și cu o tranzacție împărțită ale cărei bucăți sunt în una dintre ele. Subcategoriile sunt incluse doar pe sinteze.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    label_id:
      name: label_id
      in: query
      description: Doar rândurile care poartă cel puțin una dintre aceste etichete. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    counterparty_id:
      name: counterparty_id
      in: query
      description: Doar rândurile atribuite acestor parteneri. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    transaction_expand:
      name: expand
      in: query
      description: Relații de întors ca obiecte în loc de identificatori. Separate prin virgulă. Extinderea merge un singur nivel; un nume necunoscut este respins cu `invalid_expand`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - account
            - category
            - counterparty
            - labels
      example: category,counterparty
    account_expand:
      name: expand
      in: query
      description: Relații de întors ca obiecte în loc de identificatori. Separate prin virgulă. Extinderea merge un singur nivel; un nume necunoscut este respins cu `invalid_expand`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - bank
      example: bank
    forecast_expand:
      name: expand
      in: query
      description: Relații de întors ca obiecte în loc de identificatori. Separate prin virgulă. Extinderea merge un singur nivel; un nume necunoscut este respins cu `invalid_expand`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - category
            - counterparty
            - labels
            - recurrence
            - linked_transactions
      example: category,linked_transactions
    as_of:
      name: as_of
      in: query
      description: 'Calculează soldurile la sfârșitul acestei zile. Implicit azi: ziua UTC pe `/accounts/{id}`, ziua locală a spațiului de lucru pe `/balances`. O dată din viitor este respinsă cu `as_of_in_future`.'
      schema:
        type: string
        format: date
    period:
      name: period
      in: query
      description: O fereastră cu nume, rezolvată față de ziua locală a spațiului de lucru și întoarsă în răspuns. Are prioritate față de `from` și `to`.
      schema:
        $ref: '#/components/schemas/PeriodMacro'
    interval:
      name: interval
      in: query
      description: Intervalul de timp în care sunt grupate rândurile.
      schema:
        $ref: '#/components/schemas/Interval'
    planning_interval:
      name: interval
      in: query
      description: Intervalul în care sunt grupate rândurile. `month` pentru fiecare lună calendaristică, `total` pentru întreaga fereastră ca un singur interval.
      schema:
        $ref: '#/components/schemas/PlanningInterval'
    window_from:
      name: from
      in: query
      description: Prima zi a ferestrei, inclusiv. Trimite-o împreună cu `to`. Omite `period`, `from` și `to` pentru fereastra implicită.
      schema:
        type: string
        format: date
    window_to:
      name: to
      in: query
      description: Ultima zi a ferestrei, inclusiv. Trimite-o împreună cu `from`. Omite `period`, `from` și `to` pentru fereastra implicită.
      schema:
        type: string
        format: date
    planning_category_id:
      name: category_id
      in: query
      description: Doar aceste categorii și categoriile imbricate sub ele. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    currency:
      name: currency
      in: query
      description: Moneda în care se raportează. Implicit moneda spațiului de lucru. Un cod necunoscut este respins.
      schema:
        $ref: '#/components/schemas/Currency'
    limit:
      name: limit
      in: query
      description: Dimensiunea paginii. În afara intervalului este respinsă cu `limit_out_of_range`.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    cursor:
      name: cursor
      in: query
      description: Token opac din `next_cursor` al paginii anterioare. Păstrează ceilalți parametri neschimbați între pagini.
      schema:
        type: string
    dry_run:
      name: dry_run
      in: query
      description: '`true` face o simulare: întoarce același rezultat pe care l-ar întoarce scrierea și nu modifică nimic. `applied` este `false`.'
      schema:
        type: boolean
        default: false
  responses:
    BadRequest:
      description: Un parametru este invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request
              code: invalid_parameter
              message: direction must be 'inflow' or 'outflow'
              param: direction
              request_id: 0HNF8K3QJL2VM:00000001
    Unauthorized:
      description: Cheia API lipsește, este malformată, necunoscută sau revocată.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: authentication
              code: unauthorized
              message: Missing, malformed, unknown or revoked API key
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
    Forbidden:
      description: Cheia este validă, dar planul ThinkOut al companiei nu include API-ul.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: authentication
              code: forbidden
              message: The API is not included in this company's ThinkOut plan. Contact support@thinkout.io to enable it.
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
    NotFound:
      description: Nu există niciun obiect cu acest id în spațiul de lucru al cheii.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: not_found
              code: resource_not_found
              message: Transaction not found
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
    RequestTooLarge:
      description: Raportul ar depăși 1000 de rânduri. `period_too_long` apare doar din fereastră și interval, `too_many_groups` după grupare. Restrânge fereastra, folosește un interval mai mare sau adaugă filtre.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request
              code: too_many_groups
              message: Grouping by counterparty over this period produces 1240 groups. The maximum is 1000. Narrow the period or the filters.
              param: group_by
              request_id: 0HNF8K3QJL2VM:00000001
    RateLimited:
      description: Peste 120 de cereri în minutul curent pentru această cheie. Așteaptă secundele din `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Secunde până se resetează fereastra de un minut.
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Cereri permise pe minut.
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Cereri rămase în minutul curent.
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Secunde până se resetează fereastra de un minut.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: rate_limit
              code: rate_limited
              message: Too many requests
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
    WriteForbidden:
      description: Cheia poate doar să citească (`key_read_only`), sau planul ThinkOut al companiei nu include API-ul (`forbidden`). Accesul unei chei se alege la creare; pentru scriere, revocă cheia și creează una cu acces de citire și modificare.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            key_read_only:
              summary: Read-only key
              value:
                error:
                  type: permission
                  code: key_read_only
                  message: This API key can only read. A Manager can create a key with read and change access in ThinkOut.
                  param: null
                  request_id: 0HNF8K3QJL2VM:00000001
            forbidden:
              summary: API not in the plan
              value:
                error:
                  type: authentication
                  code: forbidden
                  message: The API is not included in this company's ThinkOut plan. Contact support@thinkout.io to enable it.
                  param: null
                  request_id: 0HNF8K3QJL2VM:00000001
    WriteInvalid:
      description: 'Cererea nu poate fi executată așa cum a fost trimisă: niciun element sau mai mult de 100, o valoare în format greșit sau o regulă care nu trece verificările. `message` spune care.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request
              code: invalid_parameter
              message: 140 items were given; at most 100 can be changed in one call.
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
  schemas:
    Money:
      type: string
      description: Sumă zecimală ca șir de caractere, cu două decimale. Negativ înseamnă ieșire la tranzacții, previziuni și cifre din rapoarte.
      pattern: ^-?[0-9]+\.[0-9]{2}$
      example: '-1250.00'
    Currency:
      type: string
      description: Cod de monedă alfabetic ISO 4217.
      pattern: ^[A-Z]{3}$
      example: RON
    Direction:
      type: string
      description: Dacă banii intră sau ies. Pe o tranzacție sau o previziune urmează semnul lui `amount`.
      enum:
        - inflow
        - outflow
    Activity:
      type: string
      description: Secțiunea din situația fluxurilor de numerar căreia îi aparține categoria.
      enum:
        - operating
        - investing
        - financing
    TransactionStatus:
      type: string
      description: Tranzacțiile `pending` vin de la bancă și nu sunt încă înregistrate. Suma lor se poate schimba la înregistrare, deci actualizează după `id`.
      enum:
        - booked
        - pending
    TransactionSource:
      type: string
      description: Cum a intrat tranzacția în ThinkOut.
      enum:
        - manual
        - import
        - bank
    AccountSource:
      type: string
      description: Conturile `delegated` sunt conturi bancare pe care alt spațiu de lucru le-a delegat către acesta.
      enum:
        - manual
        - bank
        - delegated
    ForecastStatus:
      type: string
      description: '`realised` este completă. `partial` are tranzacții asociate. `overdue` are data înainte de azi și niciuna. `planned` are data azi sau mai târziu și niciuna.'
      enum:
        - planned
        - overdue
        - partial
        - realised
    RecurrenceInterval:
      type: string
      enum:
        - day
        - week
        - month
        - year
    Interval:
      type: string
      description: Intervalul de timp pentru rândurile unui raport.
      enum:
        - day
        - week
        - month
      default: month
    PlanningInterval:
      type: string
      description: Intervalul de timp pentru rândurile de buget și de scenariu, care sunt lunare. `total` raportează întreaga fereastră ca un singur interval, ca coloana Total de pe ecranul de bugete.
      enum:
        - month
        - total
      default: month
    ScenarioType:
      type: string
      description: '`dynamic` este cash flow-ul, realizat și încă așteptat, cu modificările scenariului peste el, și se mișcă odată cu datele. `snapshot` este o copie a cash flow-ului făcută la crearea scenariului, apoi modificată. `blank` conține doar sumele introduse în el, pornind de la soldul lui inițial.'
      enum:
        - dynamic
        - snapshot
        - blank
    PeriodMacro:
      type: string
      description: O fereastră cu nume, rezolvată pe server. `last_30_days` și `last_90_days` se termină azi și includ ziua de azi; `last_12_months` începe în ziua de după azi minus douăsprezece luni. `next_month`, `next_quarter` și `next_year` acoperă întreaga lună, întregul trimestru sau întregul an calendaristic următor.
      enum:
        - this_month
        - last_month
        - this_quarter
        - last_quarter
        - this_year
        - last_year
        - month_to_date
        - quarter_to_date
        - year_to_date
        - last_30_days
        - last_90_days
        - last_12_months
        - next_month
        - next_quarter
        - next_year
    GroupDimension:
      type: string
      description: O dimensiune după care se grupează rândurile raportului, pe lângă intervalul de timp.
      enum:
        - category
        - counterparty
        - label
        - account
        - activity
        - direction
    ForecastGroupDimension:
      type: string
      description: La fel ca `GroupDimension`, plus statusul previziunii. Previziunile nu au cont.
      enum:
        - category
        - counterparty
        - label
        - activity
        - direction
        - status
    CashFlowGroupDimension:
      type: string
      description: O dimensiune după care se grupează rândurile de cash flow, pe lângă intervalul de timp. Nu există `account`, pentru că previziunile nu au cont.
      enum:
        - category
        - counterparty
        - label
        - activity
        - direction
    List:
      type: object
      required:
        - object
        - data
        - has_more
        - next_cursor
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items: {}
        has_more:
          type: boolean
          description: Dacă mai există o pagină.
        next_cursor:
          type:
            - string
            - 'null'
          description: Trimite-l ca `cursor` pentru pagina următoare. `null` pe ultima pagină.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - code
            - message
            - param
            - request_id
          properties:
            type:
              type: string
              enum:
                - invalid_request
                - authentication
                - permission
                - not_found
                - rate_limit
                - server
            code:
              type: string
              description: Motiv stabil, citibil de o mașină. Ramifică pe acesta, nu pe `message`. Unul dintre `invalid_parameter`, `invalid_cursor`, `limit_out_of_range`, `invalid_expand`, `as_of_in_future`, `unauthorized`, `forbidden`, `key_read_only`, `resource_not_found`, `too_many_groups`, `period_too_long`, `rate_limited`, `internal_error`.
            message:
              type: string
              description: Explicație pentru oameni, în engleză. Formularea se poate schimba.
            param:
              type:
                - string
                - 'null'
              description: Parametrul de query sau de cale vinovat, când există unul.
            request_id:
              type: string
              description: Menționează-l când contactezi suportul.
    ResolvedPeriod:
      type: object
      description: Fereastra efectiv calculată.
      required:
        - from
        - to
        - macro
        - interval
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        macro:
          oneOf:
            - $ref: '#/components/schemas/PeriodMacro'
            - type: 'null'
          description: Macrocomanda care a produs aceste date, sau `null` când au fost trimise direct.
        interval:
          $ref: '#/components/schemas/Interval'
    ResolvedPlanningPeriod:
      type: object
      description: Fereastra efectiv calculată, extinsă la luni întregi.
      required:
        - from
        - to
        - macro
        - interval
      properties:
        from:
          type: string
          format: date
          description: Prima zi a primei luni.
        to:
          type: string
          format: date
          description: Ultima zi a ultimei luni.
        macro:
          oneOf:
            - $ref: '#/components/schemas/PeriodMacro'
            - type: 'null'
          description: Macrocomanda care a produs fereastra, sau `null` când datele au fost trimise direct sau s-a aplicat fereastra implicită a endpoint-ului.
        interval:
          $ref: '#/components/schemas/PlanningInterval'
    Conversion:
      type: object
      description: Ce s-a făcut pentru ca sumele să fie comparabile.
      required:
        - applied
        - currency
        - basis
      properties:
        applied:
          type: boolean
          description: '`false` când toate sumele erau deja în `currency`.'
        currency:
          $ref: '#/components/schemas/Currency'
        basis:
          type: string
          description: '`transaction_date` convertește fiecare mișcare la cursul din data ei. `balance_date` convertește un sold întreg la un singur curs. `own_date` convertește fiecare buget la cursul din prima zi a lunii lui, iar fiecare tranzacție și previziune la cursul din data ei. `none` când nu s-a convertit nimic.'
          enum:
            - transaction_date
            - balance_date
            - own_date
            - none
    ReportGroup:
      type: object
      description: După ce este grupat un rând de raport. `null` la rândurile grupate doar pe interval.
      required:
        - dimension
        - id
        - label
      properties:
        dimension:
          type: string
          example: category
        id:
          type:
            - string
            - 'null'
          format: uuid
          description: Identificatorul obiectului grupat, al activității pentru `activity`. `null` pentru `direction` și `status`, și pentru rândurile `none` și `other`.
        label:
          type: string
          description: 'Numele grupului. Grupurile care nu sunt obiecte sunt coduri cu litere mici pe fiecare sinteză: `inflow` sau `outflow`, un cod de activitate precum `operating`, o stare de previziune precum `planned`, și `none` sau `other`.'
          example: Telecom
    SummaryTotals:
      type: object
      description: Întreaga fereastră însumată, după aceleași excluderi ca rândurile.
      required:
        - currency
        - inflow
        - outflow
        - net
        - count
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        inflow:
          $ref: '#/components/schemas/Money'
        outflow:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        count:
          type: integer
    SummaryRow:
      type: object
      required:
        - period_start
        - period_end
        - group
        - currency
        - inflow
        - outflow
        - net
        - count
        - starting_balance
        - transfers
        - excluded
        - final_balance
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        group:
          oneOf:
            - $ref: '#/components/schemas/ReportGroup'
            - type: 'null'
        currency:
          $ref: '#/components/schemas/Currency'
        inflow:
          $ref: '#/components/schemas/Money'
        outflow:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        count:
          type: integer
          description: Tranzacțiile din spatele acestui rând, după excluderile raportului.
        starting_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul conturilor din perimetru la începutul intervalului. `null` când este trimis `group_by` sau `direction`.
        transfers:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul transferurilor între conturile proprii ale spațiului de lucru în interval. Nu face parte din fluxuri. `null` când este trimis `group_by` sau `direction`.
        excluded:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul mișcărilor excluse de utilizator din cash flow în interval. Nu face parte din fluxuri. `null` când este trimis `group_by` sau `direction`.
        final_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul la sfârșitul intervalului. Soldul de început plus `net`, `transfers`, `excluded` și soldurile inițiale ale conturilor deschise în interval. `null` când este trimis `group_by` sau `direction`.
    Summary:
      type: object
      required:
        - object
        - period
        - conversion
        - group_by
        - has_data
        - totals
        - data
      properties:
        object:
          type: string
          const: summary
        period:
          $ref: '#/components/schemas/ResolvedPeriod'
        conversion:
          $ref: '#/components/schemas/Conversion'
        group_by:
          oneOf:
            - $ref: '#/components/schemas/GroupDimension'
            - type: 'null'
        has_data:
          type: boolean
          description: '`false` când nicio tranzacție nu s-a potrivit, spre deosebire de totalurile care au ieșit zero.'
        totals:
          $ref: '#/components/schemas/SummaryTotals'
        data:
          type: array
          items:
            $ref: '#/components/schemas/SummaryRow'
    ForecastSummaryRow:
      type: object
      required:
        - period_start
        - period_end
        - group
        - currency
        - amount
        - remaining_amount
        - count
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        group:
          oneOf:
            - $ref: '#/components/schemas/ReportGroup'
            - type: 'null'
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          $ref: '#/components/schemas/Money'
          description: Total planificat.
        remaining_amount:
          $ref: '#/components/schemas/Money'
          description: Total neacoperit încă de tranzacții.
        count:
          type: integer
    ForecastSummaryTotals:
      type: object
      description: Întreaga fereastră însumată, peste aceleași previziuni ca rândurile.
      required:
        - currency
        - amount
        - remaining_amount
        - count
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          $ref: '#/components/schemas/Money'
          description: Total planificat.
        remaining_amount:
          $ref: '#/components/schemas/Money'
          description: Total neacoperit încă de tranzacții.
        count:
          type: integer
    ForecastSummary:
      type: object
      required:
        - object
        - period
        - conversion
        - group_by
        - has_data
        - totals
        - data
      properties:
        object:
          type: string
          const: forecast_summary
        period:
          $ref: '#/components/schemas/ResolvedPeriod'
        conversion:
          $ref: '#/components/schemas/Conversion'
        group_by:
          oneOf:
            - $ref: '#/components/schemas/ForecastGroupDimension'
            - type: 'null'
        has_data:
          type: boolean
          description: '`false` când nicio previziune nu s-a potrivit.'
        totals:
          $ref: '#/components/schemas/ForecastSummaryTotals'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ForecastSummaryRow'
    CashFlowSummaryRow:
      type: object
      required:
        - period_start
        - period_end
        - group
        - currency
        - actual_inflow
        - actual_outflow
        - actual_count
        - forecast_inflow
        - forecast_outflow
        - forecast_count
        - inflow
        - outflow
        - net
        - starting_balance
        - opened_accounts
        - transfers
        - excluded
        - final_balance
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        group:
          oneOf:
            - $ref: '#/components/schemas/ReportGroup'
            - type: 'null'
        currency:
          $ref: '#/components/schemas/Currency'
        actual_inflow:
          $ref: '#/components/schemas/Money'
          description: Încasările din tranzacții în interval, după excluderile raportului.
        actual_outflow:
          $ref: '#/components/schemas/Money'
          description: Plățile din tranzacții în interval, după excluderile raportului. Negativ.
        actual_count:
          type: integer
          description: Tranzacțiile din spatele acestui rând, după excluderile raportului.
        forecast_inflow:
          $ref: '#/components/schemas/Money'
          description: Suma rămasă a previziunilor de încasare nerealizate, datate în interval.
        forecast_outflow:
          $ref: '#/components/schemas/Money'
          description: Suma rămasă a previziunilor de plată nerealizate, datate în interval. Negativ.
        forecast_count:
          type: integer
          description: Previziunile din spatele acestui rând.
        inflow:
          $ref: '#/components/schemas/Money'
          description: '`actual_inflow` plus `forecast_inflow`. Ce arată ecranul de cash flow.'
        outflow:
          $ref: '#/components/schemas/Money'
          description: '`actual_outflow` plus `forecast_outflow`. Ce arată ecranul de cash flow.'
        net:
          $ref: '#/components/schemas/Money'
          description: '`inflow` plus `outflow`. Ce arată ecranul de cash flow.'
        starting_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul conturilor spațiului de lucru la începutul intervalului, proiectat când intervalul începe după azi. `null` când este trimis `group_by` sau `direction`.
        opened_accounts:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldurile inițiale ale conturilor deschise în interval. Nu fac parte din fluxuri. `null` când este trimis `group_by` sau `direction`.
        transfers:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul transferurilor între conturile proprii ale spațiului de lucru în interval. Nu face parte din fluxuri. `null` când este trimis `group_by` sau `direction`.
        excluded:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul mișcărilor excluse de utilizator din cash flow în interval. Nu face parte din fluxuri. `null` când este trimis `group_by` sau `direction`.
        final_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul la sfârșitul intervalului, proiectat când intervalul se termină după azi. Soldul de început plus `net`, `opened_accounts`, `transfers` și `excluded`. `null` când este trimis `group_by` sau `direction`.
    CashFlowSummaryTotals:
      type: object
      description: Întreaga fereastră însumată, peste aceleași tranzacții și previziuni ca rândurile.
      required:
        - currency
        - actual_inflow
        - actual_outflow
        - actual_count
        - forecast_inflow
        - forecast_outflow
        - forecast_count
        - inflow
        - outflow
        - net
        - overdue_inflow
        - overdue_outflow
        - starting_balance
        - opened_accounts
        - transfers
        - excluded
        - final_balance
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        actual_inflow:
          $ref: '#/components/schemas/Money'
        actual_outflow:
          $ref: '#/components/schemas/Money'
        actual_count:
          type: integer
        forecast_inflow:
          $ref: '#/components/schemas/Money'
        forecast_outflow:
          $ref: '#/components/schemas/Money'
        forecast_count:
          type: integer
        inflow:
          $ref: '#/components/schemas/Money'
        outflow:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        overdue_inflow:
          $ref: '#/components/schemas/Money'
          description: Suma rămasă a previziunilor de încasări restante și nerealizate care se potrivesc filtrelor și pe care niciun rând nu le-a numărat. Toate, când `include_overdue` este dezactivat; cele datate în afara ferestrei, când este activat.
        overdue_outflow:
          $ref: '#/components/schemas/Money'
          description: La fel pentru previziunile de plăți, negativă.
        starting_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: '`starting_balance` al primului interval. `null` când este trimis `group_by` sau `direction`.'
        opened_accounts:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Cifrele intervalelor însumate pe toată fereastra. `null` când este trimis `group_by` sau `direction`.
        transfers:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Cifrele intervalelor însumate pe toată fereastra. `null` când este trimis `group_by` sau `direction`.
        excluded:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Cifrele intervalelor însumate pe toată fereastra. `null` când este trimis `group_by` sau `direction`.
        final_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: '`final_balance` al ultimului interval. `null` când este trimis `group_by` sau `direction`.'
    CashFlowSummary:
      type: object
      required:
        - object
        - period
        - conversion
        - group_by
        - bank_ids
        - account_ids
        - forecast_scope
        - include_overdue
        - has_data
        - totals
        - data
      properties:
        object:
          type: string
          const: cash_flow_summary
        period:
          $ref: '#/components/schemas/ResolvedPeriod'
        conversion:
          $ref: '#/components/schemas/Conversion'
        group_by:
          oneOf:
            - $ref: '#/components/schemas/CashFlowGroupDimension'
            - type: 'null'
        bank_ids:
          type: array
          description: Filtrul `bank_id` întors în răspuns, gol când nu a fost trimis.
          items:
            type: string
            format: uuid
        account_ids:
          type: array
          description: Filtrul `account_id` întors în răspuns, gol când nu a fost trimis.
          items:
            type: string
            format: uuid
        forecast_scope:
          type: string
          const: workspace
          description: 'Ce acoperă partea previzionată și totalurile restante. Mereu întregul spațiu de lucru: o previziune nu are cont, așa că `bank_ids` și `account_ids` restrâng doar partea realizată și soldurile.'
        include_overdue:
          type: boolean
          description: Dacă previziunile restante au fost numărate în rânduri, așa cum s-a cerut.
        has_data:
          type: boolean
          description: '`false` când nicio tranzacție și nicio previziune nu s-au potrivit.'
        totals:
          $ref: '#/components/schemas/CashFlowSummaryTotals'
        data:
          type: array
          items:
            $ref: '#/components/schemas/CashFlowSummaryRow'
    PlanningCategory:
      type: object
      description: Categoria pe care o reprezintă un rând de buget sau de scenariu. Rândurile sunt imbricate ca pe ecran, deci rândul unei categorii părinte acoperă întreaga ei ramură. Un rând al cărui `id` este egal cu `parent_id` reprezintă banii înregistrați direct pe categoria părinte, pe care ecranul de bugete îi arată ca „Altele din" părinte.
      required:
        - dimension
        - id
        - label
        - parent_id
      properties:
        dimension:
          type: string
          const: category
        id:
          type: string
          format: uuid
        label:
          type: string
          example: Marketing
        parent_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Id-ul categoriei sub care este imbricat rândul. `null` pentru o categorie de pe primul nivel.
    BudgetFigures:
      type: object
      description: Coloana Total din tabul Planificare pentru o direcție. Plățile sunt negative.
      required:
        - currency
        - budgeted
        - actual
        - forecast
        - realised
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        budgeted:
          $ref: '#/components/schemas/Money'
          description: Bugetul.
        actual:
          $ref: '#/components/schemas/Money'
          description: Tranzacțiile. Coloana Real din tabul Execuție.
        forecast:
          $ref: '#/components/schemas/Money'
          description: Suma rămasă a previziunilor nerealizate. Coloana Previzionat din tabul Execuție.
        realised:
          $ref: '#/components/schemas/Money'
          description: '`actual` plus `forecast`. Cifra pe care tabul Planificare o compară cu bugetul.'
    BudgetsSummaryRow:
      type: object
      description: O direcție a unui interval, sau o categorie a unui interval cu `group_by=category`. Plățile sunt negative.
      required:
        - period_start
        - period_end
        - direction
        - group
        - currency
        - budgeted
        - actual
        - forecast
        - realised
        - on_budget
        - note
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        direction:
          $ref: '#/components/schemas/Direction'
        group:
          oneOf:
            - $ref: '#/components/schemas/PlanningCategory'
            - type: 'null'
          description: Categoria, cu `group_by=category`. `null` pe un rând care reprezintă o direcție întreagă.
        currency:
          $ref: '#/components/schemas/Currency'
        budgeted:
          $ref: '#/components/schemas/Money'
          description: Bugetul.
        actual:
          $ref: '#/components/schemas/Money'
          description: Tranzacțiile datate în interval. Coloana Real din tabul Execuție.
        forecast:
          $ref: '#/components/schemas/Money'
          description: Suma rămasă a previziunilor nerealizate datate în interval. Coloana Previzionat din tabul Execuție.
        realised:
          $ref: '#/components/schemas/Money'
          description: '`actual` plus `forecast`. Cifra pe care tabul Planificare o compară cu bugetul.'
        on_budget:
          type:
            - boolean
            - 'null'
          description: Pictograma de bifă sau de avertizare din tabul Planificare. `true` când `realised` a atins un buget de încasări sau a rămas în limitele unui buget de plăți. `null` pentru o lună care nu a început, pentru o celulă fără buget și cu `interval=total`.
        note:
          type:
            - string
            - 'null'
          description: Nota scrisă pe buget. Completată doar pe rândurile de categorie cu `interval=month`.
    BudgetsBalance:
      type: object
      description: O lună din rândul de sold final al tabului Planificare.
      required:
        - period_start
        - period_end
        - currency
        - final_balance
        - budgeted_final_balance
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        currency:
          $ref: '#/components/schemas/Currency'
        final_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul cash flow-ului la sfârșitul lunii, proiectat pentru luna în curs. `null` pentru o lună care nu a început.
        budgeted_final_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul la sfârșitul lunii dacă bugetele se respectă, dus mai departe din luna curentă cu rezultatele nete bugetate. `null` pentru o lună încheiată.
    BudgetsSummaryTotals:
      type: object
      description: Coloana Total din tabul Planificare pentru fiecare direcție, pe întreaga fereastră și pe aceleași categorii ca rândurile.
      required:
        - inflow
        - outflow
      properties:
        inflow:
          oneOf:
            - $ref: '#/components/schemas/BudgetFigures'
            - type: 'null'
          description: '`null` când `direction` sau `category_id` lasă încasările deoparte.'
        outflow:
          oneOf:
            - $ref: '#/components/schemas/BudgetFigures'
            - type: 'null'
          description: '`null` când `direction` sau `category_id` lasă plățile deoparte.'
    BudgetsSummary:
      type: object
      required:
        - object
        - period
        - conversion
        - group_by
        - has_data
        - totals
        - data
        - balances
      properties:
        object:
          type: string
          const: budgets_summary
        period:
          $ref: '#/components/schemas/ResolvedPlanningPeriod'
        conversion:
          $ref: '#/components/schemas/Conversion'
        group_by:
          type:
            - string
            - 'null'
          enum:
            - category
            - null
        has_data:
          type: boolean
          description: '`false` când în fereastră nu este nimic bugetat, mișcat sau așteptat, spre deosebire de cifrele care dau zero.'
        totals:
          $ref: '#/components/schemas/BudgetsSummaryTotals'
        data:
          type: array
          items:
            $ref: '#/components/schemas/BudgetsSummaryRow'
        balances:
          type: array
          description: Rândul de sold final din tabul Planificare, câte o intrare pe lună. Gol cu `interval=total`, `group_by`, `category_id` sau `direction`.
          items:
            $ref: '#/components/schemas/BudgetsBalance'
    Scenario:
      type: object
      required:
        - object
        - id
        - name
        - type
        - from
        - to
        - initial_balance
        - currency
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: scenario
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Pessimistic
        type:
          $ref: '#/components/schemas/ScenarioType'
        from:
          type: string
          format: date
          description: Prima zi a primei luni a scenariului.
        to:
          type: string
          format: date
          description: Ultima zi a ultimei luni a scenariului.
        initial_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul de la care pornește un scenariu `snapshot` sau `blank`. `null` pentru un scenariu `dynamic`, care pornește de la soldul cash flow-ului.
        currency:
          $ref: '#/components/schemas/Currency'
          description: Moneda spațiului de lucru. Toate sumele scenariului sunt în ea.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Egal cu `created_at` până la prima modificare a scenariului.
      example:
        object: scenario
        id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
        name: Pessimistic
        type: dynamic
        from: '2026-11-01'
        to: '2027-10-31'
        initial_balance: null
        currency: RON
        created_at: '2026-10-02T08:15:00Z'
        updated_at: '2026-11-10T14:40:00Z'
    ScenarioReference:
      type: object
      description: Scenariul raportat.
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Pessimistic
        type:
          $ref: '#/components/schemas/ScenarioType'
    ScenarioPeriod:
      type: object
      description: Un interval din tabul unui scenariu, sau întreaga lui fereastră în `totals`. Plățile sunt negative.
      required:
        - period_start
        - period_end
        - currency
        - inflow
        - outflow
        - net
        - starting_balance
        - opened_accounts
        - transfers
        - excluded
        - final_balance
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        currency:
          $ref: '#/components/schemas/Currency'
        inflow:
          $ref: '#/components/schemas/Money'
        outflow:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
          description: '`inflow` plus `outflow`.'
        starting_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul scenariului la începutul intervalului. `null` pe un scenariu `blank` și cu `category_id`.
        opened_accounts:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldurile inițiale ale conturilor deschise în interval. Afișate alături de soldul final, fără să facă parte din el. `null` acolo unde tabul nu are această linie și cu `category_id`.
        transfers:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul transferurilor între conturile proprii ale spațiului de lucru în interval. Afișat alături de soldul final, fără să facă parte din el. `null` acolo unde tabul nu are această linie și cu `category_id`.
        excluded:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul mișcărilor excluse din cash flow în interval. Afișat alături de soldul final, fără să facă parte din el. `null` acolo unde tabul nu are această linie și cu `category_id`.
        final_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul scenariului la sfârșitul intervalului, cum îl arată tabul lui, adică soldul de la începutul intervalului plus `net`. `null` cu `category_id`.
    ScenarioCategoryRow:
      type: object
      description: O categorie a unui interval din tabul unui scenariu.
      required:
        - period_start
        - period_end
        - direction
        - group
        - currency
        - amount
        - edited
        - note
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        direction:
          $ref: '#/components/schemas/Direction'
        group:
          $ref: '#/components/schemas/PlanningCategory'
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          $ref: '#/components/schemas/Money'
          description: Suma scenariului pentru categorie în interval. Negativă pentru plăți.
        edited:
          type: boolean
          description: '`true` acolo unde scenariul stabilește el însuși suma în interval, `false` acolo unde un scenariu `dynamic` o ia din cash flow.'
        note:
          type:
            - string
            - 'null'
          description: Nota scrisă pe celulă. Completată doar cu `interval=month`.
    ScenarioSummary:
      type: object
      required:
        - object
        - scenario
        - period
        - currency
        - group_by
        - has_data
        - totals
        - data
      properties:
        object:
          type: string
          const: scenario_summary
        scenario:
          $ref: '#/components/schemas/ScenarioReference'
        period:
          $ref: '#/components/schemas/ResolvedPlanningPeriod'
        currency:
          $ref: '#/components/schemas/Currency'
          description: Moneda spațiului de lucru. Sumele scenariilor nu se convertesc niciodată.
        group_by:
          type:
            - string
            - 'null'
          enum:
            - category
            - null
        has_data:
          type: boolean
          description: '`false` când `totals.inflow`, `totals.outflow` și `totals.final_balance` sunt toate zero sau lipsesc.'
        totals:
          $ref: '#/components/schemas/ScenarioPeriod'
        data:
          type: array
          description: Câte un `ScenarioPeriod` pe interval fără `group_by`. Câte un `ScenarioCategoryRow` pe categorie pe interval cu `group_by=category`.
          items:
            oneOf:
              - $ref: '#/components/schemas/ScenarioPeriod'
              - $ref: '#/components/schemas/ScenarioCategoryRow'
    ScenarioFinalBalance:
      type: object
      required:
        - id
        - name
        - final_balance
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Pessimistic
        final_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul scenariului la sfârșitul intervalului, cum îl arată tabul lui. `null` într-un interval din afara lunilor scenariului.
    ScenariosSummaryRow:
      type: object
      description: Un interval din tabul Toate.
      required:
        - period_start
        - period_end
        - currency
        - cash_flow_final_balance
        - scenarios
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        currency:
          $ref: '#/components/schemas/Currency'
        cash_flow_final_balance:
          $ref: '#/components/schemas/Money'
          description: Soldul cash flow-ului la sfârșitul intervalului, proiectat când intervalul se termină după azi.
        scenarios:
          type: array
          description: Fiecare scenariu din spațiul de lucru, cu soldul lui la sfârșitul intervalului.
          items:
            $ref: '#/components/schemas/ScenarioFinalBalance'
    ScenariosSummary:
      type: object
      required:
        - object
        - period
        - currency
        - data
      properties:
        object:
          type: string
          const: scenarios_summary
        period:
          $ref: '#/components/schemas/ResolvedPlanningPeriod'
        currency:
          $ref: '#/components/schemas/Currency'
          description: Moneda spațiului de lucru. Sumele scenariilor nu se convertesc niciodată.
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScenariosSummaryRow'
    AccountBalance:
      type: object
      required:
        - account_id
        - name
        - native_currency
        - native_balance
        - balance
      properties:
        account_id:
          type: string
          format: uuid
        name:
          type: string
          example: ING Curent
        native_currency:
          $ref: '#/components/schemas/Currency'
        native_balance:
          $ref: '#/components/schemas/Money'
          description: Soldul în moneda proprie a contului, neconvertit.
        balance:
          $ref: '#/components/schemas/Money'
          description: Același sold în moneda cerută.
    Balances:
      type: object
      required:
        - object
        - as_of
        - conversion
        - total
        - accounts
      properties:
        object:
          type: string
          const: balances
        as_of:
          type: string
          format: date
          description: Ziua a cărei poziție la sfârșit de zi este raportată.
        conversion:
          $ref: '#/components/schemas/Conversion'
        total:
          $ref: '#/components/schemas/Money'
          description: Toate conturile adunate, în moneda cerută.
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountBalance'
    BankDetails:
      type: object
      description: Câmpuri brute primite de la bancă.
      required:
        - payer
        - payer_details
        - payee
        - payee_details
        - reference
        - additional
      properties:
        payer:
          type:
            - string
            - 'null'
        payer_details:
          type:
            - string
            - 'null'
          description: Identificatorii contului plătitorului, așa cum sunt furnizați de bancă.
        payee:
          type:
            - string
            - 'null'
        payee_details:
          type:
            - string
            - 'null'
        reference:
          type:
            - string
            - 'null'
          description: Referința plății sau linia de informații.
        additional:
          type:
            - string
            - 'null'
    ExpandableCategory:
      description: Identificatorul unei categorii, sau categoria completă când este numită în `expand`.
      oneOf:
        - type: string
          format: uuid
        - $ref: '#/components/schemas/Category'
    ExpandableCounterparty:
      description: Identificatorul unui partener, partenerul complet când este numit în `expand`, sau `null` când nu există atribuire.
      oneOf:
        - type: string
          format: uuid
        - $ref: '#/components/schemas/Counterparty'
        - type: 'null'
    ExpandableRecurrence:
      description: Identificatorul planului recurent din care a fost generată previziunea, planul complet când este trecut în `expand`, sau `null` pentru o previziune unică.
      oneOf:
        - type: string
          format: uuid
        - $ref: '#/components/schemas/Recurrence'
        - type: 'null'
    ExpandableAccount:
      description: Identificatorul unui cont, sau contul complet când este numit în `expand`.
      oneOf:
        - type: string
          format: uuid
        - $ref: '#/components/schemas/Account'
    ExpandableLabels:
      description: Identificatori de etichete, sau etichetele complete când `labels` este numit în `expand`.
      type: array
      items:
        oneOf:
          - type: string
            format: uuid
          - $ref: '#/components/schemas/Label'
    Transaction:
      type: object
      required:
        - object
        - id
        - date
        - amount
        - currency
        - direction
        - status
        - source
        - description
        - comment
        - account
        - category
        - counterparty
        - labels
        - bank_details
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: transaction
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: Data înregistrării. Nu există componentă de timp.
          example: '2026-09-03'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        direction:
          $ref: '#/components/schemas/Direction'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        source:
          $ref: '#/components/schemas/TransactionSource'
        description:
          type:
            - string
            - 'null'
          example: ORANGE ROMANIA SA
        comment:
          type:
            - string
            - 'null'
          description: Text liber adăugat de utilizatori în ThinkOut.
        account:
          $ref: '#/components/schemas/ExpandableAccount'
        category:
          oneOf:
            - $ref: '#/components/schemas/ExpandableCategory'
            - type: 'null'
          description: '`null` pentru o tranzacție împărțită, a cărei categorisire stă pe bucățile ei.'
        counterparty:
          $ref: '#/components/schemas/ExpandableCounterparty'
        labels:
          $ref: '#/components/schemas/ExpandableLabels'
        bank_details:
          oneOf:
            - $ref: '#/components/schemas/BankDetails'
            - type: 'null'
          description: '`null` dacă `source` nu este `bank`.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        object: transaction
        id: 8f1c0a4e-2b1d-4c8e-9f3a-7d6e5c4b3a21
        date: '2026-09-03'
        amount: '-1250.00'
        currency: RON
        direction: outflow
        status: booked
        source: bank
        description: ORANGE ROMANIA SA
        comment: null
        account: c2d7e8f9-1a2b-4c3d-8e9f-0a1b2c3d4e5f
        category: 3b4c5d6e-7f80-4a1b-9c2d-3e4f5a6b7c8d
        counterparty: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        labels:
          - 1f2e3d4c-5b6a-4978-8877-665544332211
        bank_details:
          payer: THINKOUT SRL
          payer_details: RO49INGB0000999900000001
          payee: ORANGE ROMANIA SA
          payee_details: RO12BTRL0000000000000002
          reference: Factura 2026-08 nr 1234567
          additional: null
        created_at: '2026-09-03T08:12:44Z'
        updated_at: '2026-09-03T08:12:44Z'
    BankStatus:
      type: string
      description: '`connected` funcționează. `loading` este o sincronizare în curs. `requires_action` cere ca o persoană să se autentifice sau să reaprobe conexiunea în ThinkOut. `error` este orice altă eroare. Doar `connected` înseamnă că datele din spate sunt la zi.'
      enum:
        - connected
        - loading
        - requires_action
        - error
    Bank:
      type: object
      description: O autorizare cu o singură bancă. Mai multe conturi pot folosi aceeași conexiune, iar un spațiu de lucru poate avea mai multe conexiuni la aceeași bancă.
      required:
        - object
        - id
        - name
        - country_code
        - status
        - last_sync_at
        - consent_expires_at
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: bank
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Numele băncii, așa cum îl raportează furnizorul.
          example: ING Bank
        country_code:
          type:
            - string
            - 'null'
          description: Țara băncii, cod ISO 3166-1 alpha-2.
          pattern: ^[A-Z]{2}$
          example: RO
        status:
          $ref: '#/components/schemas/BankStatus'
        last_sync_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Când a întors furnizorul date cu succes ultima oară, sau `null`. O conexiune `connected` cu un `last_sync_at` vechi este cazul care merită o alertă.
        consent_expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Când trebuie reînnoit consimțământul bancar, dacă furnizorul îl raportează.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        object: bank
        id: 5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f
        name: ING Bank
        country_code: RO
        status: connected
        last_sync_at: '2026-09-03T06:00:00Z'
        consent_expires_at: '2026-11-30T00:00:00Z'
        created_at: '2024-01-01T10:00:00Z'
        updated_at: '2026-09-03T06:00:00Z'
    ExpandableBank:
      description: Identificatorul unei conexiuni bancare, conexiunea completă când este numită în `expand`, sau `null` pentru un cont manual. Pe un cont `delegated` conexiunea aparține altui spațiu de lucru, așa că identificatorul este întors, dar nu este nici extins, nici citibil.
      oneOf:
        - type: string
          format: uuid
        - $ref: '#/components/schemas/Bank'
        - type: 'null'
    Account:
      type: object
      required:
        - object
        - id
        - name
        - currency
        - group
        - source
        - balance
        - balance_as_of
        - opening_balance
        - opening_date
        - bank
        - external_account_id
        - original_name
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: account
        id:
          type: string
          format: uuid
        name:
          type: string
          example: ING Curent
        currency:
          $ref: '#/components/schemas/Currency'
        group:
          type:
