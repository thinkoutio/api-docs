        Categoria trebuie să existe în spațiul de lucru și să corespundă direcției fiecărei tranzacții. O tranzacție de cealaltă direcție este omisă cu motivul `direction_mismatch`, iar o tranzacție împărțită în bucăți cu motivul `split`.
