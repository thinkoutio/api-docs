        "422":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /balances:
    get:
      tags: [Reports]
      operationId: getBalances
      summary: Get balances
      description: |
        Every account's balance and their total at the end of `as_of`, accounts ordered by
        `name`.

        A balance is the opening balance plus the account's transactions up to that day, so
        `as_of` cannot be in the future. Each balance converts whole at the rate for `as_of`,
        unlike a summary, which converts each movement at its own date.
      parameters:
        - $ref: "#/components/parameters/as_of"
        - $ref: "#/components/parameters/currency"
      responses:
        "200":
          description: Balances per account and in total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balances"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /transactions/category:
    post:
      tags: [Transactions]
      operationId: changeTransactionCategory
      summary: Change the category of transactions
      description: |
        Sets one category on up to 100 existing transactions. It replaces the category they
        have, including one set by hand, and changes nothing else about them. It does not create
        or reinforce an automatic rule.

        The category must exist in the workspace and match each transaction's direction. A
        transaction of the other direction is skipped with `direction_mismatch`, and a transaction
        split into parts with `split`.
      parameters:
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_ids, category_id]
              properties:
                transaction_ids:
                  $ref: "#/components/schemas/WriteTransactionIds"
                category_id:
                  type: string
                  format: uuid
            example:
              transaction_ids:
                - 9b2f6c1e-4d3a-4e8b-9f10-2a3b4c5d6e7f
              category_id: 2a3b4c5d-6e7f-4809-8a1b-2c3d4e5f6a7b
      responses:
        "200":
          description: What changed, or with `dry_run`, what would change.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WriteResult"
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: "#/components/schemas/CategoryChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example:
                          - item_kind: transaction
                            id: 3c90c3cc-0d44-4b50-8888-8dd25736052a
                            month: null
                            reason: split
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"

