          enum: [transaction, forecast, budget, rule, transfer_suggestion, link_suggestion]
        id:
          type: string
          format: uuid
          description: The item the reason is about, as the request named it.
        month:
          type: [string, "null"]
          pattern: "^\\d{4}-\\d{2}$"
          description: For a budget, the month, such as `2026-03`. `null` otherwise.
        reason:
