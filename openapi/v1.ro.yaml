  /budgets/summary:
    get:
      tags:
        - Bugete
      operationId: summariseBudgets
      summary: Sintetizează bugetele
      description: |-
        Ce arată ecranul de bugete, pe lună sau pentru întreaga fereastră, pe direcție sau pe categorie. Trimite `period`, sau atât `from`, cât și `to`.

        Bugetele sunt lunare, așa că fereastra se extinde la luni întregi. Fiecare rând pune bugetul alături de ce s-a întâmplat. `budgeted` este bugetul. `actual` sunt tranzacțiile, coloana Real din tabul Execuție. `forecast` este suma rămasă a previziunilor nerealizate datate în interval, coloana Previzionat din tabul Execuție. `realised` le adună pe cele două și este cifra pe care tabul Planificare o compară cu bugetul. Plățile sunt negative.

        `on_budget` este pictograma de bifă sau de avertizare din tabul Planificare. Este `true` când `realised` a atins un buget de încasări sau a rămas în limitele unui buget de plăți, și `null` pentru o lună care nu a început, pentru o celulă fără buget și cu `interval=total`.

        Cifrele acoperă categoriile afișate pe ecranul de bugete. În majoritatea spațiilor de lucru, categoriile ascunse acolo includ încasările și plățile necategorisite și transferurile, așa că totalurile bugetelor diferă de `/transactions/summary` și de `/cash-flow/summary` pentru aceleași luni.

        Bugetele se convertesc în `currency` la cursul din prima zi a lunii lor, iar tranzacțiile și previziunile la cursul din data lor. `totals` este coloana Total din tabul Planificare, pentru fiecare direcție.

        Fără `group_by` există câte un rând pe direcție pe interval, iar `balances` conține rândul de sold final din tabul Planificare: `final_balance` odată ce luna a început și `budgeted_final_balance`, soldul dacă bugetele se respectă, până când luna se încheie. `balances` este gol cu `interval=total`, `group_by`, `category_id` sau `direction`.

        Cu `group_by=category` rândurile sunt imbricate ca pe ecran. Rândul unei categorii părinte este întreaga ei ramură, așa că dacă aduni un părinte cu copiii lui, copiii se numără de două ori. Un rând al cărui `id` este egal cu `parent_id` reprezintă banii înregistrați direct pe părinte, pe care ecranul îi arată ca „Altele din" părinte. O categorie apare într-un interval când are ceva bugetat, mișcat sau așteptat. `category_id` restrânge rândurile și `totals` la acele categorii și la cele imbricate sub ele.

        Rândurile sunt ordonate după interval. În cadrul unui interval încasările vin înaintea plăților, iar categoriile urmează ordinea ecranului, părinții înaintea copiilor.

        **Încasări și plăți față de buget în trimestrul acesta, cu solduri**

        ```http
        GET /budgets/summary?period=this_quarter
        ```

        **Plățile din anul acesta față de buget, pe categorii, în total**

        ```http
        GET /budgets/summary?period=this_year&interval=total&group_by=category&direction=outflow
        ```
      parameters:
        - $ref: '#/components/parameters/period'
        - name: from
          in: query
          description: Prima zi a ferestrei, inclusiv. Obligatoriu împreună cu `to`, dacă nu este trimis `period`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Ultima zi a ferestrei, inclusiv. Obligatoriu împreună cu `from`, dacă nu este trimis `period`.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/planning_interval'
        - name: group_by
          in: query
          description: '`category` pentru câte un rând pe categorie pe interval. Omite-l pentru câte un rând pe direcție pe interval.'
          schema:
            type: string
            enum:
              - category
        - $ref: '#/components/parameters/currency'
        - $ref: '#/components/parameters/planning_category_id'
        - $ref: '#/components/parameters/direction'
      responses:
        '200':
          description: Sinteza.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetsSummary'
              examples:
                By month, with balances:
