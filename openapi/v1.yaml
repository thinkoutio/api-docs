  /transactions/transfers/unpair:
    post:
      tags: [Transactions]
      operationId: unpairTransfers
      summary: Unpair transfers
      description: |
        Unpairs up to 100 transfers. Give one transaction of each transfer: a paired transfer
        loses both sides, a marked transfer loses its mark. A transaction that is not part of a
        transfer is skipped with `not_transfer`.
