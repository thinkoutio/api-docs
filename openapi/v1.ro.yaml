          $ref: '#/components/schemas/Money'
          description: Suma scenariului pentru categorie în interval. Negativă pentru plăți.
        edited:
          type: boolean
          description: '`true` acolo unde scenariul stabilește el însuși suma în interval, `false` acolo unde un scenariu `dynamic` o ia din cash flow.'
