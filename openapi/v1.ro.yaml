    Recurrence:
      type: object
      description: Planul recurent din care a fost generată această previziune.
      required:
        - id
        - name
        - interval
        - every
        - start_date
        - end_date
        - occurrences
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Office rent
        interval:
          $ref: '#/components/schemas/RecurrenceInterval'
        every:
          type: integer
          minimum: 1
          description: 'Numărul de intervale între apariții. `interval: month, every: 1` înseamnă lunar.'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        occurrences:
          type: integer
          description: Numărul total de previziuni generate de plan.
    Forecast:
      type: object
      required:
        - object
        - id
        - date
        - amount
        - remaining_amount
        - currency
        - direction
        - status
        - description
        - comment
        - category
        - counterparty
        - labels
        - recurrence
        - linked_transactions
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: forecast
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: Ziua în care este așteptată mișcarea.
        amount:
          $ref: '#/components/schemas/Money'
        remaining_amount:
          $ref: '#/components/schemas/Money'
          description: Partea din `amount` neacoperită încă de tranzacții. Egală cu `amount` cât timp este `planned` sau `overdue`, `"0"` când este `realised`.
        currency:
          $ref: '#/components/schemas/Currency'
        direction:
          $ref: '#/components/schemas/Direction'
        status:
          $ref: '#/components/schemas/ForecastStatus'
        description:
          type:
            - string
            - 'null'
        comment:
          type:
            - string
            - 'null'
        category:
          $ref: '#/components/schemas/ExpandableCategory'
        counterparty:
          $ref: '#/components/schemas/ExpandableCounterparty'
        labels:
          $ref: '#/components/schemas/ExpandableLabels'
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/Recurrence'
            - type: 'null'
        linked_transactions:
          type: array
          description: Tranzacțiile potrivite cu această previziune, ca identificatori. Numește `linked_transactions` în `expand` ca să primești tranzacțiile în sine, ceea ce răspunde dacă un cost planificat s-a materializat, fără un apel pentru fiecare identificator.
          items:
            oneOf:
              - type: string
                format: uuid
              - $ref: '#/components/schemas/Transaction'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        object: forecast
        id: 7e6d5c4b-3a29-4180-9f8e-7d6c5b4a3928
        date: '2026-09-15'
        amount: '-4200.00'
        remaining_amount: '-4200.00'
        currency: EUR
        direction: outflow
        status: planned
        description: Office rent
        comment: null
        category: 2a3b4c5d-6e7f-4809-8a1b-2c3d4e5f6a7b
        counterparty: 8b9c0d1e-2f3a-4b5c-8d6e-7f8a9b0c1d2e
        labels:
          - 0f1e2d3c-4b5a-4968-8776-655443322110
        recurrence:
          id: 4c5d6e7f-8091-4a2b-9c3d-4e5f6a7b8c9d
          name: Office rent
          interval: month
          every: 1
          start_date: '2026-01-15'
          end_date: '2026-12-15'
          occurrences: 12
        linked_transactions: []
        created_at: '2025-12-20T09:30:00Z'
        updated_at: '2025-12-20T09:30:00Z'
