  /transactions/transfers/pair:
    post:
      tags: [Transactions]
      operationId: pairTransfers
      summary: Pair transfers
      description: |
        Pairs two existing transactions as one transfer between the workspace's own accounts:
        money out of one account and money in to another. Up to 100 pairs per call.

        A pair is skipped when either transaction is already part of a transfer
        (`already_transfer`), excluded, pending or split, when both are money in or both money
        out (`same_direction`), or when both are in one account (`same_account`). The skipped
        `id` is the transaction at fault.

        Pairing also deletes the pending transfer suggestions that involve either transaction.
        Unpairing does not bring them back.
      parameters:
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairs]
              properties:
                pairs:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [source_transaction_id, destination_transaction_id]
                    properties:
                      source_transaction_id:
                        type: string
                        format: uuid
                        description: The money that left one account.
                      destination_transaction_id:
                        type: string
                        format: uuid
                        description: The same money arriving in another account.
      responses:
        "200":
          description: What changed, or with `dry_run`, what would change.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WriteResult"
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: "#/components/schemas/TransferPairChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example:
                          - item_kind: transaction
                            id: 3c90c3cc-0d44-4b50-8888-8dd25736052a
                            month: null
                            reason: same_account
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"

