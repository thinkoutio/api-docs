openapi: 3.1.0
info:
  title: ThinkOut API
  version: "1.0"
  description: |
    Read and change the data of a ThinkOut workspace.

    Reads are `GET`. Lists share one envelope and page with a cursor wherever they can grow.
    Every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset`.

    Writes change existing transactions, forecasts, budget values and categorisation rules.
    They need a key created with read and change access, take at most 100 items per call, and
    apply at once. `dry_run=true` returns the same result without changing anything.

    Version 1 changes additively: new endpoints, optional parameters, response fields and enum
    values can appear at any time. Tolerate unknown fields and never treat an enum as closed.
  contact:
    name: ThinkOut developer support
    url: https://developers.thinkout.io/guides/support
servers:
  - url: https://api.thinkout.io/v1
security:
  - apiKey: []
tags:
  - name: Banks
    description: The workspace's bank connections and the state of each one.
  - name: Accounts
    description: Manual, bank-synced and delegated accounts with computed balances.
  - name: Transactions
    description: Booked and pending movements on the workspace's accounts.
  - name: Categories
    description: The workspace category tree, split by direction and business activity.
  - name: Counterparties
    description: Customers and suppliers that transactions and forecasts are attributed to.
  - name: Labels
    description: Free-form tags grouped by label type.
  - name: Forecasts
    description: Planned inflows and outflows and the transactions that realised them.
  - name: Budgets
    description: Monthly budgets per category beside what has moved and what is still expected, as the budgets screen shows them.
  - name: Scenarios
    description: The what-ifs built on the scenarios screen and the figures the screen shows for them.
  - name: Reports
    description: Totals rather than rows. Summaries over transactions, forecasts and cash flow, and balances per account.
  - name: Transaction rules
    description: Categorisation rules that set a category, counterparty, labels, exclusion or transfer on matching transactions.

paths:
  /banks:
    get:
      tags: [Banks]
      operationId: listBanks
      summary: List bank connections
      description: |
        Bank connections ordered by `name`, then `id`. One connection is one authorisation with
        one bank and can feed several accounts.

        Only this workspace's connections are listed. A `delegated` account's `bank` points at
        another workspace's connection, which is not readable here. Manual accounts have no
        connection.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BankStatus"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of bank connections.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Bank"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /banks/{id}:
    get:
      tags: [Banks]
      operationId: getBank
      summary: Get a bank connection
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The bank connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bank"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts
      description: |
        Returns accounts in the workspace, ordered by `name`, then `id`.

        Balances are as of today in UTC. For another day use `GET /accounts/{id}` with `as_of`,
        or `GET /balances` for every account at once.
      parameters:
        - name: bank_id
          in: query
          description: Only accounts fed by these bank connections. Comma-separated for several.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - $ref: "#/components/parameters/account_expand"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /accounts/{id}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/as_of"
        - $ref: "#/components/parameters/account_expand"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
