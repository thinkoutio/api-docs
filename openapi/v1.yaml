  /budgets/summary:
    get:
      tags: [Budgets]
      operationId: summariseBudgets
      summary: Summarise budgets
      description: |
        What the budgets screen shows, per month or for the whole window, per direction or per
        category. Give `period`, or both `from` and `to`.

        Budgets are monthly, so the window widens to whole months. Each row puts the budget
        beside what happened. `budgeted` is the budget. `actual` is the transactions, the
        tracking tab's Actual column. `forecast` is the remaining amount of the unrealised
        forecasts dated in the period, the tracking tab's Forecasted column. `realised` adds the
        two and is the figure the planning tab compares with the budget. Outflows are negative.

        `on_budget` is the planning tab's check or warning icon. It is `true` when `realised`
        reached an inflow budget or stayed within an outflow budget, and `null` for a month that
        has not started, for a cell without a budget and with `interval=total`.

        The figures cover the categories shown on the budgets screen. In most workspaces the
        categories hidden there include the uncategorised and transfer categories, so budget
        totals differ from `/transactions/summary` and `/cash-flow/summary` for the same months.

        Budgets convert to `currency` at the rate for the first day of their month, transactions
        and forecasts at the rate of their own date. `totals` is the planning tab's Total column
        for each direction.

        Without `group_by` there is one row per direction per period, and `balances` holds the
        planning tab's final balance row: `final_balance` once a month has started and
        `budgeted_final_balance`, the balance if the budgets hold, until it has ended.
        `balances` is empty with `interval=total`, `group_by`, `category_id` or `direction`.

        With `group_by=category` the rows nest as on the screen. A parent category's row is its
        whole branch, so adding a parent and its children counts the children twice. A row
        whose `id` equals its `parent_id` is the money booked on the parent itself, which the
        screen shows as "Others for" the parent. A category appears in a period when something
        is budgeted, has moved or is expected for it. `category_id` narrows the rows and
        `totals` to those categories and the ones nested under them.

        Rows are ordered by period. Within a period inflows come before outflows, and
        categories follow the screen's order, parents before their children.

        **Inflows and outflows against the budget this quarter, with balances**

        ```http
        GET /budgets/summary?period=this_quarter
        ```

        **This year's outflows against the budget by category, in total**

        ```http
        GET /budgets/summary?period=this_year&interval=total&group_by=category&direction=outflow
        ```
      parameters:
        - $ref: "#/components/parameters/period"
        - name: from
          in: query
          description: First day of the window, inclusive. Required with `to` unless `period` is given.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last day of the window, inclusive. Required with `from` unless `period` is given.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/planning_interval"
        - name: group_by
          in: query
          description: "`category` for one row per category per period. Omit it for one row per direction per period."
          schema:
            type: string
            enum: [category]
        - $ref: "#/components/parameters/currency"
        - $ref: "#/components/parameters/planning_category_id"
        - $ref: "#/components/parameters/direction"
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetsSummary"
              examples:
                "By month, with balances":
                  summary: One row per direction per month, the final balance row filled
                  value:
                    object: budgets_summary
                    period:
                      from: "2026-10-01"
                      to: "2026-12-31"
                      macro: this_quarter
                      interval: month
                    conversion:
                      applied: true
                      currency: RON
                      basis: own_date
                    group_by: null
                    has_data: true
                    totals:
                      inflow:
                        currency: RON
                        budgeted: "280000.00"
                        actual: "127700.00"
                        forecast: "100000.00"
                        realised: "227700.00"
                      outflow:
                        currency: RON
                        budgeted: "-190000.00"
                        actual: "-88456.25"
                        forecast: "-59200.00"
                        realised: "-147656.25"
