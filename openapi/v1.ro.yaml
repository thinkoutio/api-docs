      description: |-
        Totaluri peste aceleași tranzacții pe care le listează `/transactions`, cu aceleași filtre, grupate pe o perioadă și pe cel mult o altă dimensiune.

        **Ce numără este fix și nu poate fi schimbat**, ca cifrele să coincidă cu totalurile pe care le arată ThinkOut. Transferurile între conturile proprii ale spațiului de lucru, tranzacțiile excluse de utilizator și duplicatele sunt lăsate deoparte. Tranzacțiile împărțite sunt numărate prin bucățile lor, niciodată prin original, așa că nimic nu este numărat de două ori.

