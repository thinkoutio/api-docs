        period:
          $ref: '#/components/schemas/ResolvedPeriod'
        conversion:
          $ref: '#/components/schemas/Conversion'
        group_by:
          oneOf:
            - $ref: '#/components/schemas/CashFlowGroupDimension'
            - type: 'null'
        bank_ids:
          type: array
          description: Filtrul `bank_id` întors în răspuns, gol când nu a fost trimis.
          items:
            type: string
            format: uuid
        account_ids:
          type: array
          description: Filtrul `account_id` întors în răspuns, gol când nu a fost trimis.
          items:
            type: string
            format: uuid
        forecast_scope:
          type: string
          const: workspace
          description: 'Ce acoperă partea previzionată și totalurile restante. Mereu întregul spațiu de lucru: o previziune nu are cont, așa că `bank_ids` și `account_ids` restrâng doar partea realizată și soldurile.'
        include_overdue:
          type: boolean
          description: Dacă previziunile restante au fost numărate în rânduri, așa cum s-a cerut.
        has_data:
          type: boolean
          description: '`false` când nicio tranzacție și nicio previziune nu s-au potrivit.'
        totals:
          $ref: '#/components/schemas/CashFlowSummaryTotals'
        data:
          type: array
          items:
            $ref: '#/components/schemas/CashFlowSummaryRow'
    PlanningCategory:
