    BankStatus:
      type: string
      description: |-
        Starea conexiunii la ultimul schimb de date dintre ThinkOut și furnizor.

        `connected` înseamnă că funcționează. `loading` este o sincronizare în curs. `requires_action` cere ca o persoană să se autentifice sau să reaprobe conexiunea în ThinkOut, iar până atunci nu mai vin tranzacții noi. `error` este o eroare pe care ThinkOut nu a putut să o rezolve singur și acoperă orice stare a furnizorului pe care ThinkOut nu o poate încadra.

        Doar `connected` înseamnă că datele din spate sunt la zi.
      enum:
        - connected
        - loading
        - requires_action
        - error
    Bank:
      type: object
      description: O autorizare cu o singură bancă. Mai multe conturi pot folosi aceeași conexiune, iar un spațiu de lucru poate avea mai multe conexiuni la aceeași bancă.
      required:
        - object
        - id
        - name
        - country_code
        - status
        - last_sync_at
        - consent_expires_at
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: bank
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Numele băncii, așa cum îl raportează furnizorul.
          example: ING Bank
        country_code:
          type:
            - string
            - 'null'
          description: Țara băncii, cod ISO 3166-1 alpha-2.
          pattern: ^[A-Z]{2}$
          example: RO
        status:
          $ref: '#/components/schemas/BankStatus'
        last_sync_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |-
            Când a întors furnizorul date cu succes ultima oară. `null` dacă nu a făcut-o niciodată.

            Aceasta este vechimea datelor, nu vechimea conexiunii. O conexiune poate sta pe `connected` cu un `last_sync_at` vechi de câteva zile, iar acesta este cazul care merită o alertă.
        consent_expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Când trebuie reînnoit consimțământul bancar, dacă furnizorul îl raportează. După ce trece, conexiunea nu mai întoarce tranzacții noi până când cineva o reaprobă.
        created_at:
          type: string
          format: date-time
          description: Când a fost autorizată prima dată conexiunea.
        updated_at:
          type: string
          format: date-time
