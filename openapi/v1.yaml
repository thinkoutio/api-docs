    post:
      tags: [Transactions]
      operationId: markTransfers
      summary: Mark transactions as transfers
      description: |
        Marks up to 100 existing transactions as transfers between the workspace's own accounts
        without a partner transaction, for example when the other account is not in ThinkOut.
        Transactions already part of a transfer, excluded, pending or split are skipped.
      parameters:
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: true
        content:
