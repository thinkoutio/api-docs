  /forecasts/summary:
    get:
      tags:
        - Rapoarte
      operationId: summariseForecasts
      summary: Sintetizează previziunile
      description: |-
        Totaluri peste previziunile cu dată, pe interval de timp și cel mult încă o dimensiune. Trimite `period`, sau atât `from`, cât și `to`.

        `amount` însumează ce a fost planificat, iar `remaining_amount` partea neacoperită încă de tranzacții. Se numără orice stare dacă `status` nu restrânge, așa că o previziune realizată se adaugă la `amount` și nu adaugă nimic la `remaining_amount`. Sumele se convertesc în `currency` la cursul din data fiecărei previziuni. Intervalele sunt aliniate la calendar și tăiate la fereastra cerută. `totals` acoperă întreaga fereastră.

        Rândurile grupate sunt ordonate după `amount` în valoare absolută, cel mai mare primul. Un interval păstrează cel mult 50 de grupuri; restul se strâng într-un singur rând etichetat `other`. Previziunile fără partener sau fără etichetă ajung într-un rând `none`, iar o previziune cu mai multe etichete se numără o dată pentru fiecare etichetă. Aici `category_id` acoperă și subcategoriile.
      parameters:
        - $ref: '#/components/parameters/period'
        - name: from
          in: query
          description: Prima zi a ferestrei, inclusiv. Obligatoriu împreună cu `to`, dacă nu este trimis `period`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Ultima zi a ferestrei, inclusiv. Obligatoriu împreună cu `from`, dacă nu este trimis `period`.
          schema:
            type: string
            format: date
