  /scenarios/{id}/summary:
    get:
      tags:
        - Scenarii
      operationId: summariseScenario
      summary: Sintetizează un scenariu
      description: |-
        Ce arată tabul unui scenariu pe ecranul de scenarii, pe lună sau pentru întreaga fereastră, pe interval sau pe categorie. Trimite `period`, sau atât `from`, cât și `to`, sau niciunul pentru lunile scenariului.

        Fereastra se extinde la luni întregi și se limitează la lunile scenariului. O fereastră din afara lor este respinsă cu 400. Sumele sunt în moneda spațiului de lucru și nu se convertesc niciodată. Plățile sunt negative.

        Fără `group_by` există câte un rând pe interval cu `inflow`, `outflow` și `net`, plus liniile de sold ale tabului. `final_balance` este `starting_balance` plus `net`, cum îl calculează tabul. `opened_accounts`, `transfers` și `excluded` apar alături de el și nu intră în el. Un scenariu `dynamic` are toate liniile. Un scenariu `snapshot` are `opened_accounts`, `transfers` și `excluded`, mai puțin liniile care sunt zero în fiecare lună. Un scenariu `blank` are doar `final_balance`. Liniile pe care tabul nu le arată sunt `null`.

        `totals` acoperă întreaga fereastră: fluxurile și liniile de sold însumate, `starting_balance` al primului interval și `final_balance` al ultimului.

        Cu `group_by=category` există câte un rând pe categorie pe interval, imbricat ca pe ecran. Rândul unei categorii părinte este întreaga ei ramură, așa că dacă aduni un părinte cu copiii lui, copiii se numără de două ori. `edited` este `true` acolo unde scenariul stabilește el însuși suma, în loc să o ia din cash flow. O categorie apare într-un interval când are o sumă sau când scenariul a modificat-o. `category_id` restrânge rândurile și `totals` la acele categorii și la cele imbricate sub ele, iar câmpurile de sold sunt atunci `null`.

        **Un scenariu lună de lună**

        ```http
        GET /scenarios/2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f/summary
        ```

        **Un scenariu pe categorii, pe toată fereastra lui**

        ```http
        GET /scenarios/2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f/summary?interval=total&group_by=category
        ```
