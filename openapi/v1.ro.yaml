          $ref: '#/components/schemas/Money'
          description: '`inflow` plus `outflow`.'
        starting_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul scenariului la începutul intervalului. `null` pe un scenariu `blank` și cu `category_id`.
        opened_accounts:
          oneOf:
