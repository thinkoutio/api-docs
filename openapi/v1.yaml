          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
