  /transactions/summary:
    get:
      tags:
        - Rapoarte
      operationId: summariseTransactions
      summary: Sintetizează tranzacțiile
      description: |-
        Totaluri peste tranzacțiile pe care le listează `/transactions`, cu aceleași filtre, pe interval de timp și cel mult încă o dimensiune.

        Regulile de numărare sunt fixe, ca cifrele să coincidă cu ThinkOut: transferurile între conturile proprii ale spațiului de lucru și tranzacțiile excluse de utilizator sunt lăsate deoparte, iar tranzacțiile împărțite se numără prin bucățile lor. `/transactions` listează fiecare mișcare, așa că însumarea ei dă o cifră diferită.

        Sumele se convertesc în `currency` la cursul din data fiecărei tranzacții. Intervalele sunt aliniate la calendar și tăiate la fereastra cerută. `totals` acoperă întreaga fereastră.

        Rândurile grupate doar pe interval poartă și soldul de început, transferurile, mișcările excluse și soldul de final ale intervalului. Cele patru sunt `null` când este trimis `group_by` sau `direction`.

        Rândurile grupate sunt ordonate după `net` în valoare absolută, cel mai mare primul. Un interval păstrează cel mult 50 de grupuri; restul se strâng într-un singur rând etichetat `other`. Tranzacțiile fără partener sau fără etichetă ajung într-un rând `none`, iar o tranzacție cu mai multe etichete se numără o dată pentru fiecare etichetă. Aici `category_id` acoperă și subcategoriile.

        Filtrele se combină cu AND; un filtru care acceptă o listă își combină valorile cu OR.

        **Încasări și plăți pe luni, cu solduri**

        ```http
        GET /transactions/summary?from=2026-03-01&to=2026-04-30&interval=month
        ```

        **Plăți pe partener, pe luni**

        ```http
        GET /transactions/summary?from=2026-07-01&to=2026-08-31&interval=month&group_by=counterparty&direction=outflow
        ```

        **Cash flow pe luni pentru conturile unei bănci**

        ```http
        GET /transactions/summary?from=2026-03-01&to=2026-08-31&interval=month&bank_id=5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f
        ```
      parameters:
        - name: from
          in: query
          required: true
          description: Prima zi a ferestrei, inclusiv.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Ultima zi a ferestrei, inclusiv.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/interval'
        - name: group_by
          in: query
          description: O a doua dimensiune de grupare, pe lângă intervalul de timp. Omite-o pentru un singur rând per interval.
          schema:
            $ref: '#/components/schemas/GroupDimension'
        - $ref: '#/components/parameters/currency'
        - $ref: '#/components/parameters/bank_id'
        - $ref: '#/components/parameters/account_id'
        - $ref: '#/components/parameters/category_id'
        - $ref: '#/components/parameters/label_id'
        - $ref: '#/components/parameters/counterparty_id'
        - $ref: '#/components/parameters/direction'
        - $ref: '#/components/parameters/activity'
