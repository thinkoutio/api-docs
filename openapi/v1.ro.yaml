    CashFlowSummaryRow:
      type: object
      required:
        - period_start
        - period_end
        - group
        - currency
        - actual_inflow
        - actual_outflow
        - actual_count
        - forecast_inflow
        - forecast_outflow
        - forecast_count
        - inflow
        - outflow
        - net
        - starting_balance
        - opened_accounts
        - transfers
        - excluded
        - final_balance
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        group:
          oneOf:
            - $ref: '#/components/schemas/ReportGroup'
            - type: 'null'
        currency:
          $ref: '#/components/schemas/Currency'
        actual_inflow:
          $ref: '#/components/schemas/Money'
          description: Încasările din tranzacții în interval, după excluderile raportului.
        actual_outflow:
          $ref: '#/components/schemas/Money'
          description: Plățile din tranzacții în interval, după excluderile raportului. Negativ.
        actual_count:
          type: integer
          description: Tranzacțiile din spatele acestui rând, după excluderile raportului.
        forecast_inflow:
          $ref: '#/components/schemas/Money'
          description: Suma rămasă a previziunilor de încasare nerealizate, datate în interval.
        forecast_outflow:
          $ref: '#/components/schemas/Money'
          description: Suma rămasă a previziunilor de plată nerealizate, datate în interval. Negativ.
        forecast_count:
          type: integer
          description: Previziunile din spatele acestui rând.
        inflow:
          $ref: '#/components/schemas/Money'
          description: '`actual_inflow` plus `forecast_inflow`. Ce arată ecranul de cash flow.'
        outflow:
          $ref: '#/components/schemas/Money'
          description: '`actual_outflow` plus `forecast_outflow`. Ce arată ecranul de cash flow.'
        net:
          $ref: '#/components/schemas/Money'
          description: '`inflow` plus `outflow`. Ce arată ecranul de cash flow.'
        starting_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul conturilor spațiului de lucru la începutul intervalului, proiectat când intervalul începe după azi. `null` când este trimis `group_by` sau `direction`.
        opened_accounts:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldurile inițiale ale conturilor deschise în interval. Nu fac parte din fluxuri. `null` când este trimis `group_by` sau `direction`.
        transfers:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul transferurilor între conturile proprii ale spațiului de lucru în interval. Nu face parte din fluxuri. `null` când este trimis `group_by` sau `direction`.
        excluded:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul mișcărilor excluse de utilizator din cash flow în interval. Nu face parte din fluxuri. `null` când este trimis `group_by` sau `direction`.
        final_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul la sfârșitul intervalului, proiectat când intervalul se termină după azi. Soldul de început plus `net`, `opened_accounts`, `transfers` și `excluded`. `null` când este trimis `group_by` sau `direction`.
    CashFlowSummaryTotals:
      type: object
      description: Întreaga fereastră însumată, peste aceleași tranzacții și previziuni ca rândurile.
      required:
        - currency
        - actual_inflow
        - actual_outflow
        - actual_count
        - forecast_inflow
        - forecast_outflow
        - forecast_count
        - inflow
        - outflow
        - net
        - overdue_inflow
        - overdue_outflow
        - starting_balance
        - opened_accounts
        - transfers
        - excluded
        - final_balance
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        actual_inflow:
          $ref: '#/components/schemas/Money'
        actual_outflow:
          $ref: '#/components/schemas/Money'
        actual_count:
          type: integer
        forecast_inflow:
          $ref: '#/components/schemas/Money'
        forecast_outflow:
          $ref: '#/components/schemas/Money'
        forecast_count:
          type: integer
        inflow:
          $ref: '#/components/schemas/Money'
        outflow:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        overdue_inflow:
          $ref: '#/components/schemas/Money'
          description: Suma rămasă a previziunilor de încasări restante și nerealizate care se potrivesc filtrelor și pe care niciun rând nu le-a numărat. Toate, când `include_overdue` este dezactivat; cele datate în afara ferestrei, când este activat.
        overdue_outflow:
          $ref: '#/components/schemas/Money'
          description: La fel pentru previziunile de plăți, negativă.
        starting_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: '`starting_balance` al primului interval. `null` când este trimis `group_by` sau `direction`.'
        opened_accounts:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Cifrele intervalelor însumate pe toată fereastra. `null` când este trimis `group_by` sau `direction`.
        transfers:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Cifrele intervalelor însumate pe toată fereastra. `null` când este trimis `group_by` sau `direction`.
        excluded:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Cifrele intervalelor însumate pe toată fereastra. `null` când este trimis `group_by` sau `direction`.
        final_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: '`final_balance` al ultimului interval. `null` când este trimis `group_by` sau `direction`.'
    CashFlowSummary:
      type: object
      required:
        - object
        - period
        - conversion
        - group_by
        - bank_ids
        - account_ids
        - forecast_scope
        - include_overdue
        - has_data
        - totals
        - data
      properties:
        object:
          type: string
