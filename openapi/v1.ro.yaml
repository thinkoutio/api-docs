      tags:
        - Previziuni
      operationId: linkForecasts
      summary: Asociază tranzacții cu previziuni
      description: |-
        Asociază tranzacții existente cu previziuni existente, până la 100 de asocieri pe apel. Nu creează nicio tranzacție și nu modifică nicio previziune: din asociere rezultă doar starea închisă a previziunii și `remaining_amount`.

        Cu `partial` false, valoarea implicită, asocierea închide previziunea, așa că ea nu mai contează în cash flow. Cu `partial` true previziunea rămâne deschisă, iar suma ei rămasă scade cu suma tranzacției. O asociere completă ulterioară o închide.

        O asociere este omisă când previziunea este deja închisă (`already_realised`), când tranzacția este deja asociată cu ea (`already_linked`), când tranzacția este exclusă, în așteptare, împărțită sau face parte dintr-un transfer, sau când direcția ei diferă de a previziunii (`direction_mismatch`).

        Asocierea șterge și sugestiile de asociere în așteptare care implică previziunea sau tranzacția. Dezasocierea nu le aduce înapoi.
      parameters:
        - $ref: '#/components/parameters/dry_run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - links
              properties:
                links:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - forecast_id
                      - transaction_id
                    properties:
                      forecast_id:
                        type: string
                        format: uuid
                      transaction_id:
                        type: string
                        format: uuid
                      partial:
                        type: boolean
                        default: false
                        description: '`true` lasă previziunea deschisă, cu restul sumei încă așteptat. `false` o închide.'
