  /transactions/transfers/pair:
    post:
      tags:
        - Tranzacții
      operationId: pairTransfers
      summary: Împerechează transferurile
      description: |-
        Împerechează două tranzacții existente ca un singur transfer între conturile proprii ale spațiului de lucru: banii ies dintr-un cont și intră în altul. Până la 100 de perechi pe apel.

        O pereche este omisă când una dintre tranzacții face deja parte dintr-un transfer (`already_transfer`), este exclusă, în așteptare sau împărțită, când ambele sunt încasări sau ambele plăți (`same_direction`), sau când ambele sunt în același cont (`same_account`). `id` din elementul omis este tranzacția care a cauzat problema.

        Împerecherea șterge și sugestiile de transfer în așteptare care implică oricare dintre cele două tranzacții. Desfacerea perechii nu le aduce înapoi.
      parameters:
        - $ref: '#/components/parameters/dry_run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pairs
              properties:
                pairs:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - source_transaction_id
                      - destination_transaction_id
                    properties:
                      source_transaction_id:
                        type: string
                        format: uuid
                        description: Banii care au ieșit dintr-un cont.
                      destination_transaction_id:
                        type: string
                        format: uuid
                        description: Aceiași bani, intrați în alt cont.
      responses:
