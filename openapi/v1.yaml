                        type: array
                        items:
                          $ref: "#/components/schemas/ForecastLabelChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example:
                          - item_kind: forecast
                            id: 7e8f9a0b-1c2d-4e3f-9a4b-5c6d7e8f9a0b
                            month: null
                            reason: unchanged
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /forecasts/links:
    post:
      tags: [Forecasts]
      operationId: linkForecasts
      summary: Match transactions to forecasts
      description: |
        Matches existing transactions to existing forecasts, up to 100 links per call. It never
        creates a transaction and never edits a forecast: only the forecast's closed state and
        `remaining_amount` follow from the match.

        With `partial` false, the default, the match closes the forecast, so it no longer counts
        in cash flow. With `partial` true the forecast stays open and its remaining amount drops
        by the transaction's amount. A later full match closes it.

        A link is skipped when the forecast is already closed (`already_realised`), the
        transaction is already matched to it (`already_linked`), the transaction is excluded,
        pending, split or part of a transfer, or its direction differs from the forecast's
        (`direction_mismatch`).

        Matching also deletes the pending match suggestions that involve the forecast or the
        transaction. Unmatching does not bring them back.
      parameters:
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [links]
              properties:
                links:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [forecast_id, transaction_id]
                    properties:
                      forecast_id:
                        type: string
                        format: uuid
                      transaction_id:
                        type: string
                        format: uuid
                      partial:
                        type: boolean
                        default: false
                        description: "`true` leaves the forecast open with the rest still expected. `false` closes it."
      responses:
        "200":
          description: What changed, or with `dry_run`, what would change.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WriteResult"
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: "#/components/schemas/ForecastLinkChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example:
                          - item_kind: transaction
                            id: 3c90c3cc-0d44-4b50-8888-8dd25736052a
                            month: null
                            reason: already_linked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /forecasts/links/remove:
    post:
      tags: [Forecasts]
      operationId: unlinkForecasts
      summary: Unmatch transactions from forecasts
      description: |
        Removes up to 100 matches between transactions and forecasts. The forecast always
        reopens, as it does in the app, even when other transactions stay matched to it. A
        transaction not matched to the forecast is skipped with `not_linked`.
      parameters:
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [links]
              properties:
                links:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [forecast_id, transaction_id]
                    properties:
                      forecast_id:
                        type: string
                        format: uuid
                      transaction_id:
                        type: string
                        format: uuid
      responses:
        "200":
          description: What changed, or with `dry_run`, what would change.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WriteResult"
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: "#/components/schemas/ForecastUnlinkChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example:
                          - item_kind: transaction
                            id: 3c90c3cc-0d44-4b50-8888-8dd25736052a
                            month: null
                            reason: not_linked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /forecasts/realise:
    post:
      tags: [Forecasts]
      operationId: realiseForecasts
      summary: Close forecasts
      description: |
        Closes up to 100 forecasts that no transaction will settle, such as one paid another way
        or one that will not happen, so they no longer count in cash flow. When a transaction
        exists for the forecast, match it instead. A forecast already closed is skipped with
        `already_realised`.
      parameters:
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeForecastsInput"
      responses:
        "200":
          description: What changed, or with `dry_run`, what would change.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WriteResult"
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: "#/components/schemas/ForecastRealisationChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example:
                          - item_kind: forecast
                            id: 7e8f9a0b-1c2d-4e3f-9a4b-5c6d7e8f9a0b
                            month: null
                            reason: already_realised
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /forecasts/reopen:
    post:
      tags: [Forecasts]
      operationId: reopenForecasts
      summary: Reopen forecasts
      description: |
        Reopens up to 100 closed forecasts, so they count in cash flow again. A forecast that
        still has transactions matched is skipped with `has_links`: unmatch them instead. A
        forecast that is open is skipped with `not_realised`.
      parameters:
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeForecastsInput"
      responses:
        "200":
          description: What changed, or with `dry_run`, what would change.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WriteResult"
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: "#/components/schemas/ForecastRealisationChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example:
                          - item_kind: forecast
                            id: 7e8f9a0b-1c2d-4e3f-9a4b-5c6d7e8f9a0b
                            month: null
                            reason: has_links
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /forecasts/suggestions/accept:
    post:
      tags: [Forecasts]
      operationId: acceptForecastSuggestions
      summary: Accept forecast match suggestions
      description: |
        Makes the full match each pending match suggestion proposes, with the same checks as
        matching. Up to 100 suggestions per call. A suggestion already accepted or dismissed is
        skipped with `suggestion_closed`.

        Accepting also deletes the other pending match suggestions that involve the forecast or
        the transaction. The API does not list suggestions; the MCP tool `list_suggestions` does.
      parameters:
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptSuggestionsInput"
      responses:
        "200":
          description: What changed, or with `dry_run`, what would change.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WriteResult"
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: "#/components/schemas/ForecastLinkChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example:
                          - item_kind: link_suggestion
                            id: 4d5e6f70-8192-4a3b-8c4d-5e6f708192a3
                            month: null
                            reason: suggestion_closed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /budgets/values:
    post:
      tags: [Budgets]
      operationId: setBudgetValues
      summary: Set budget values
      description: |
        Sets the budget of a category for a month, or for every month from `month` through
        `repeat_until`, as typing the value on the budgets screen does. Amounts are in the
        workspace currency.

        It overwrites a value set by hand. ThinkOut keeps no other copy of the old value, so
        each change returns it as `before`.

        A category with sub-categories takes a budget for its whole branch (`kind` is
        `hierarchy`). Only categories shown on budgets take a value; others are skipped with
        `not_on_budgets`. A month that already holds the amount is skipped with `unchanged`.

        Up to 100 months per call, counting every month a repeat covers. Months must be within
        ten years of the current month. It never chooses which categories show on budgets,
        deletes a range of values or copies a scenario into budgets.
      parameters:
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [category_id, month, amount]
                    properties:
                      category_id:
                        type: string
                        format: uuid
                      month:
                        type: string
                        pattern: "^[0-9]{4}-[0-9]{2}$"
                        description: The month to set, such as `2026-03`.
                      amount:
                        type: number
                        description: Signed as `GET /budgets/summary` shows it. Positive for an inflow category, negative for an outflow category.
                      repeat_until:
                        type: [string, "null"]
                        pattern: "^[0-9]{4}-[0-9]{2}$"
                        description: The last month to set the same amount for, such as `2026-12`. Not before `month`.
            example:
              values:
                - category_id: 2a3b4c5d-6e7f-4809-8a1b-2c3d4e5f6a7b
                  month: "2026-01"
                  amount: -4000
                  repeat_until: "2026-12"
      responses:
        "200":
          description: What changed, or with `dry_run`, what would change.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WriteResult"
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: "#/components/schemas/BudgetValueChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example:
                          - item_kind: budget
                            id: 2a3b4c5d-6e7f-4809-8a1b-2c3d4e5f6a7b
                            month: "2026-02"
                            reason: unchanged
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /budgets/values/clear:
    post:
      tags: [Budgets]
      operationId: clearBudgetValues
      summary: Clear budget values
      description: |
        Clears the budget set by hand for a category and month, as removing the value on the
        budgets screen does. The screen then shows the sum of the sub-categories' budgets, or
        zero. Each change returns the cleared value as `before`.

        Up to 100 category-months per call, within ten years of the current month. A month with
        no value set by hand is skipped with `unchanged`.
      parameters:
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [category_id, month]
                    properties:
                      category_id:
                        type: string
                        format: uuid
                      month:
                        type: string
                        pattern: "^[0-9]{4}-[0-9]{2}$"
                        description: The month to clear, such as `2026-03`.
      responses:
        "200":
          description: What changed, or with `dry_run`, what would change.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WriteResult"
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: "#/components/schemas/BudgetValueChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example:
                          - item_kind: budget
                            id: 2a3b4c5d-6e7f-4809-8a1b-2c3d4e5f6a7b
                            month: "2026-03"
                            reason: unchanged
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /transaction-rules:
    post:
      tags: [Transaction rules]
      operationId: createTransactionRule
      summary: Create a rule
      description: |
        Creates a categorisation rule: a condition on transactions and what to set on the ones
        that match. ThinkOut applies it to every new transaction it imports. Creating a rule does
        not touch past transactions; `POST /transaction-rules/{id}/apply` does.

        A rule sets only what the other write endpoints set, from items that exist in the
        workspace. The change's `recent_matches` shows which transactions of the last 90 days
        the condition matches, so run it with `dry_run` first to check the condition.

        The API does not list rules; the MCP tool `list_transaction_rules` does, in the same
        shape this endpoint takes.
      parameters:
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
            example:
              condition:
                operation: and
                conditions:
                  - property: description
                    criteria: contains
                    value: ORANGE ROMANIA
                  - property: direction
                    criteria: equals
                    value: outflow
              effect:
                category_id: 2a3b4c5d-6e7f-4809-8a1b-2c3d4e5f6a7b
                counterparty_id: 8b9c0d1e-2f3a-4b5c-8d6e-7f8a9b0c1d2e
                label_ids: []
                exclude: false
                mark_transfer: false
              comment: Phone and internet.
      responses:
        "200":
          description: The new rule, or with `dry_run`, the rule as it would be created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WriteResult"
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: "#/components/schemas/RuleChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /transaction-rules/{id}:
    put:
      tags: [Transaction rules]
      operationId: editTransactionRule
      summary: Edit a rule
      description: |
        Replaces the condition, effect and comment of an existing rule. Send the whole
        definition: anything left out is removed. A rule ThinkOut derived itself becomes a rule
        the user wrote. A definition identical to the current one is skipped with `unchanged`.
        Editing does not touch past transactions.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: The rule before and after, or with `dry_run`, as it would be.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WriteResult"
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: "#/components/schemas/RuleChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example:
                          - item_kind: rule
                            id: 8f9a0b1c-2d3e-4f40-8a5b-6c7d8e9f0a1b
                            month: null
                            reason: unchanged
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Transaction rules]
      operationId: deleteTransactionRule
      summary: Delete a rule
      description: |
        Deletes a rule, so ThinkOut stops applying it to new transactions. What it already did
        to past transactions stays. The record of which transactions it touched is deleted with
        it.

        The change returns the whole rule as `before`.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/dry_run"
      responses:
        "200":
          description: The deleted rule, or with `dry_run`, the rule that would be deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WriteResult"
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: "#/components/schemas/RuleChange"
                      skipped:
                        type: array
                        items:
                          $ref: "#/components/schemas/SkippedItem"
                        example: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"

  /transaction-rules/{id}/apply:
    post:
      tags: [Transaction rules]
      operationId: applyTransactionRule
      summary: Apply a rule to past transactions
      description: |
        Applies an existing rule to the past transactions in a date range that its condition
        matches. At most 100 transactions change per call, newest first. `not_applied` counts the
        ones left for the next call, so call again until it is `0`.

        Without `overwrite` it only fills in what is missing: an uncategorised transaction gets
        the category, one with no counterparty gets the counterparty, and labels are added. A
        category or counterparty already set is kept and named in `kept`. With `overwrite` it
        also replaces those, including values set by hand.

        Excluded transactions, transfers and transactions split into parts are skipped.

        As when a user applies the rule in ThinkOut, each changed transaction lists the rule
        among its applied rules, and the rule's use count rises by one per transaction. The use
        count decides which rule wins when several match on a bank sync.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/dry_run"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                  description: First day to look at. Defaults to twelve months ago, the earliest allowed.
                to:
                  type: string
                  format: date
                  description: Last day to look at, inclusive. Defaults to today.
                overwrite:
                  type: boolean
                  default: false
                  description: "`true` also replaces a category or counterparty that is already set, including one set by hand."
      responses:
        "200":
          description: What changed, or with `dry_run`, what would change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleApplyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/WriteInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"


components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A workspace API key created in ThinkOut settings. One key reaches one workspace. A key created with read and change access can also call the write endpoints.

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    from:
      name: from
      in: query
      description: Earliest `date` to include, inclusive.
      schema:
        type: string
        format: date
    to:
      name: to
      in: query
      description: Latest `date` to include, inclusive.
      schema:
        type: string
        format: date
    direction:
      name: direction
      in: query
      schema:
        $ref: "#/components/schemas/Direction"
    activity:
      name: activity
      in: query
      description: Only rows whose category sits in these cash flow statement sections. Comma-separated for several.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/Activity"
    bank_id:
      name: bank_id
      in: query
      description: Only rows on the accounts fed by these bank connections. Comma-separated for several.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    account_id:
      name: account_id
      in: query
      description: Only rows on these accounts. Comma-separated for several.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    category_id:
      name: category_id
      in: query
      description: |
        Only rows in these categories. Comma-separated for several. On `/transactions` this
        also matches a split transaction whose pieces are in one of them. Subcategories are
        included only on the summaries.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    label_id:
      name: label_id
      in: query
      description: Only rows carrying at least one of these labels. Comma-separated for several.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    counterparty_id:
      name: counterparty_id
      in: query
      description: Only rows attributed to these counterparties. Comma-separated for several.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    transaction_expand:
      name: expand
      in: query
      description: Relations to return as objects instead of ids. Comma-separated. Expansion goes one level deep; an unknown name is rejected with `invalid_expand`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum: [account, category, counterparty, labels]
      example: category,counterparty
    account_expand:
      name: expand
      in: query
      description: Relations to return as objects instead of ids. Comma-separated. Expansion goes one level deep; an unknown name is rejected with `invalid_expand`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum: [bank]
      example: bank
    forecast_expand:
      name: expand
      in: query
      description: Relations to return as objects instead of ids. Comma-separated. Expansion goes one level deep; an unknown name is rejected with `invalid_expand`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum: [category, counterparty, labels, recurrence, linked_transactions]
      example: category,linked_transactions
    as_of:
      name: as_of
      in: query
      description: |
        Compute balances at the end of this day. Defaults to today: the UTC day on
        `/accounts/{id}`, the workspace's local day on `/balances`. A future date is rejected
        with `as_of_in_future`.
      schema:
        type: string
        format: date
    period:
      name: period
      in: query
      description: A named window, resolved against the workspace's local day and echoed in the response. Takes precedence over `from` and `to`.
      schema:
        $ref: "#/components/schemas/PeriodMacro"
    interval:
      name: interval
      in: query
      description: The period bucket rows are grouped into.
      schema:
        $ref: "#/components/schemas/Interval"
    planning_interval:
      name: interval
      in: query
      description: The period rows are grouped into. `month` for each calendar month, `total` for the whole window as one period.
      schema:
        $ref: "#/components/schemas/PlanningInterval"
    window_from:
      name: from
      in: query
      description: First day of the window, inclusive. Give it with `to`. Leave out `period`, `from` and `to` for the default window.
      schema:
        type: string
        format: date
    window_to:
      name: to
      in: query
      description: Last day of the window, inclusive. Give it with `from`. Leave out `period`, `from` and `to` for the default window.
      schema:
        type: string
        format: date
    planning_category_id:
      name: category_id
      in: query
      description: Only these categories and the categories nested under them. Comma-separated for several.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    currency:
      name: currency
      in: query
      description: Currency to report in. Defaults to the workspace currency. An unknown code is rejected.
      schema:
        $ref: "#/components/schemas/Currency"
    limit:
      name: limit
      in: query
      description: Page size. Outside the range it is rejected with `limit_out_of_range`.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    cursor:
      name: cursor
      in: query
      description: Opaque token from the previous page's `next_cursor`. Keep the other parameters unchanged between pages.
      schema:
        type: string

    dry_run:
      name: dry_run
      in: query
      description: |
        `true` returns the same result the write would return and changes nothing: `applied` is
        `false`.
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: A parameter is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: invalid_request
              code: invalid_parameter
              message: "direction must be 'inflow' or 'outflow'"
              param: direction
              request_id: "0HNF8K3QJL2VM:00000001"
    Unauthorized:
      description: The API key is missing, malformed, unknown or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: authentication
              code: unauthorized
              message: "Missing, malformed, unknown or revoked API key"
              param: null
              request_id: "0HNF8K3QJL2VM:00000001"
    Forbidden:
      description: The key is valid but the company's ThinkOut plan does not include the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: authentication
              code: forbidden
              message: "The API is not included in this company's ThinkOut plan. Contact support@thinkout.io to enable it."
              param: null
              request_id: "0HNF8K3QJL2VM:00000001"
    NotFound:
      description: No object with this id exists in the key's workspace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: not_found
              code: resource_not_found
              message: "Transaction not found"
              param: null
              request_id: "0HNF8K3QJL2VM:00000001"
    RequestTooLarge:
      description: |
        The report would exceed 1000 rows. `period_too_long` is raised from the window and
        interval alone, `too_many_groups` after grouping. Narrow the window, coarsen the
        interval or add filters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: invalid_request
              code: too_many_groups
              message: "Grouping by counterparty over this period produces 1240 groups. The maximum is 1000. Narrow the period or the filters."
              param: group_by
              request_id: "0HNF8K3QJL2VM:00000001"
    RateLimited:
      description: More than 120 requests in the current minute for this key. Wait for the seconds in `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the minute window resets.
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Requests allowed per minute.
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Requests left in the current minute.
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Seconds until the minute window resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: rate_limit
              code: rate_limited
              message: "Too many requests"
              param: null
              request_id: "0HNF8K3QJL2VM:00000001"

    WriteForbidden:
      description: |
        The key can only read (`key_read_only`), or the company's ThinkOut plan does not include
        the API (`forbidden`). A key's access is chosen when it is created; to write, revoke the
        key and create one with read and change access.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            key_read_only:
              summary: Read-only key
              value:
                error:
                  type: permission
                  code: key_read_only
                  message: "This API key can only read. A Manager can create a key with read and change access in ThinkOut."
                  param: null
                  request_id: "0HNF8K3QJL2VM:00000001"
            forbidden:
              summary: API not in the plan
              value:
                error:
                  type: authentication
                  code: forbidden
                  message: "The API is not included in this company's ThinkOut plan. Contact support@thinkout.io to enable it."
                  param: null
                  request_id: "0HNF8K3QJL2VM:00000001"
    WriteInvalid:
      description: |
        The request cannot be carried out as given: no items or more than 100, a value in the
        wrong format, or a rule that does not pass its checks. `message` says which.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: invalid_request
              code: invalid_parameter
              message: "140 items were given; at most 100 can be changed in one call."
              param: null
              request_id: "0HNF8K3QJL2VM:00000001"

  schemas:
    Money:
      type: string
      description: Decimal amount as a string with two decimals. Negative means an outflow on transactions, forecasts and report figures.
      pattern: "^-?[0-9]+\\.[0-9]{2}$"
      example: "-1250.00"

    Currency:
      type: string
      description: ISO 4217 alphabetic currency code.
      pattern: "^[A-Z]{3}$"
      example: RON

    Direction:
      type: string
      description: Whether money comes in or goes out. On a transaction or forecast it follows the sign of `amount`.
      enum: [inflow, outflow]

    Activity:
      type: string
      description: Cash flow statement section the category belongs to.
      enum: [operating, investing, financing]

    TransactionStatus:
      type: string
      description: "`pending` transactions come from a bank and are not yet booked. Their amount can change when they book, so upsert by `id`."
      enum: [booked, pending]

    TransactionSource:
      type: string
      description: How the transaction entered ThinkOut.
      enum: [manual, import, bank]

    AccountSource:
      type: string
      description: "`delegated` accounts are bank accounts another workspace has delegated to this one."
      enum: [manual, bank, delegated]

    ForecastStatus:
      type: string
      description: "`realised` is complete. `partial` has matched transactions. `overdue` is dated before today with none. `planned` is dated today or later with none."
      enum: [planned, overdue, partial, realised]

    RecurrenceInterval:
      type: string
      enum: [day, week, month, year]

    Interval:
      type: string
      description: A period bucket for report rows.
      enum: [day, week, month]
      default: month

    PlanningInterval:
      type: string
      description: A period bucket for budget and scenario rows, which are monthly. `total` reports the whole window as one period, as the budgets screen's Total column does.
      enum: [month, total]
      default: month

    ScenarioType:
      type: string
      description: "`dynamic` is the cash flow, actual and still expected, with the scenario's edits on top, and moves with the data. `snapshot` is a copy of the cash flow taken when the scenario was created, then edited. `blank` holds only the amounts typed into it, starting from its initial balance."
      enum: [dynamic, snapshot, blank]

    PeriodMacro:
      type: string
      description: A named window resolved on the server. `last_30_days` and `last_90_days` end today and include it; `last_12_months` starts the day after today minus twelve months. `next_month`, `next_quarter` and `next_year` cover the whole next calendar month, quarter or year.
      enum:
        - this_month
        - last_month
        - this_quarter
        - last_quarter
        - this_year
        - last_year
        - month_to_date
        - quarter_to_date
        - year_to_date
        - last_30_days
        - last_90_days
        - last_12_months
        - next_month
        - next_quarter
        - next_year

    GroupDimension:
      type: string
      description: A dimension to group report rows by, alongside the period bucket.
      enum: [category, counterparty, label, account, activity, direction]

    ForecastGroupDimension:
      type: string
      description: As `GroupDimension`, plus forecast status. Forecasts have no account.
      enum: [category, counterparty, label, activity, direction, status]

    CashFlowGroupDimension:
      type: string
      description: A dimension to group cash flow rows by, alongside the period bucket. There is no `account`, because forecasts have none.
      enum: [category, counterparty, label, activity, direction]

    List:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items: {}
        has_more:
          type: boolean
          description: Whether another page exists.
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to fetch the next page. `null` on the last page.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, param, request_id]
          properties:
            type:
              type: string
              enum: [invalid_request, authentication, permission, not_found, rate_limit, server]
            code:
              type: string
              description: |
                Stable machine-readable reason. Branch on this, not on `message`. One of
                `invalid_parameter`, `invalid_cursor`, `limit_out_of_range`, `invalid_expand`,
                `as_of_in_future`, `unauthorized`, `forbidden`, `key_read_only`,
                `resource_not_found`, `too_many_groups`, `period_too_long`, `rate_limited`,
                `internal_error`.
            message:
              type: string
              description: Human-readable explanation. Wording may change.
            param:
              type: [string, "null"]
              description: The query or path parameter at fault, when there is one.
            request_id:
              type: string
              description: Quote this when contacting support.

    ResolvedPeriod:
      type: object
      description: The window actually computed.
      required: [from, to, macro, interval]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        macro:
          oneOf:
            - $ref: "#/components/schemas/PeriodMacro"
            - type: "null"
          description: The macro that produced these dates, or `null` when they were given directly.
        interval:
          $ref: "#/components/schemas/Interval"

    ResolvedPlanningPeriod:
      type: object
      description: The window actually computed, widened to whole months.
      required: [from, to, macro, interval]
      properties:
        from:
          type: string
          format: date
          description: First day of the first month.
        to:
          type: string
          format: date
          description: Last day of the last month.
        macro:
          oneOf:
            - $ref: "#/components/schemas/PeriodMacro"
            - type: "null"
          description: The macro that produced the window, or `null` when the dates were given directly or the endpoint's default window applied.
        interval:
          $ref: "#/components/schemas/PlanningInterval"

    Conversion:
      type: object
      description: What was done to make amounts comparable.
      required: [applied, currency, basis]
      properties:
        applied:
          type: boolean
          description: "`false` when every amount was already in `currency`."
        currency:
          $ref: "#/components/schemas/Currency"
        basis:
          type: string
          description: "`transaction_date` converts each movement at the rate for its own date. `balance_date` converts a whole balance at one rate. `own_date` converts each budget at the rate for the first day of its month, and each transaction and forecast at the rate for its own date. `none` when nothing was converted."
          enum: [transaction_date, balance_date, own_date, none]

    ReportGroup:
      type: object
      description: What a report row is grouped by. `null` on rows grouped by period alone.
      required: [dimension, id, label]
      properties:
        dimension:
          type: string
          example: category
        id:
          type: [string, "null"]
          format: uuid
          description: The grouped object's id, the activity's for `activity`. `null` for `direction` and `status`, and for the `none` and `other` rows.
        label:
          type: string
          description: "Name of the group. Non-object groups are lowercase codes on every summary: `inflow` or `outflow`, an activity code such as `operating`, a forecast status such as `planned`, and `none` or `other`."
          example: Telecom

    SummaryTotals:
      type: object
      description: The whole window added up, after the same exclusions as the rows.
      required: [currency, inflow, outflow, net, count]
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        inflow:
          $ref: "#/components/schemas/Money"
        outflow:
          $ref: "#/components/schemas/Money"
        net:
          $ref: "#/components/schemas/Money"
        count:
          type: integer

    SummaryRow:
      type: object
      required:
        - period_start
        - period_end
        - group
        - currency
        - inflow
        - outflow
        - net
        - count
        - starting_balance
        - transfers
        - excluded
        - final_balance
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        group:
          oneOf:
            - $ref: "#/components/schemas/ReportGroup"
            - type: "null"
        currency:
          $ref: "#/components/schemas/Currency"
        inflow:
          $ref: "#/components/schemas/Money"
        outflow:
          $ref: "#/components/schemas/Money"
        net:
          $ref: "#/components/schemas/Money"
        count:
          type: integer
          description: Transactions behind this row, after the report's exclusions.
        starting_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Balance of the accounts in scope at the start of the period. `null` when `group_by` or `direction` is given.
        transfers:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Net of transfers between the workspace's own accounts in the period. Not part of the flows. `null` when `group_by` or `direction` is given.
        excluded:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Net of movements the user excluded from cash flow in the period. Not part of the flows. `null` when `group_by` or `direction` is given.
        final_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Balance at the end of the period. Starting balance plus `net`, `transfers`, `excluded` and the opening balances of accounts opened in the period. `null` when `group_by` or `direction` is given.

    Summary:
      type: object
      required: [object, period, conversion, group_by, has_data, totals, data]
      properties:
        object:
          type: string
          const: summary
        period:
          $ref: "#/components/schemas/ResolvedPeriod"
        conversion:
          $ref: "#/components/schemas/Conversion"
        group_by:
          oneOf:
            - $ref: "#/components/schemas/GroupDimension"
            - type: "null"
        has_data:
          type: boolean
          description: "`false` when no transaction matched, as opposed to totals that came to zero."
        totals:
          $ref: "#/components/schemas/SummaryTotals"
        data:
          type: array
          items:
            $ref: "#/components/schemas/SummaryRow"

    ForecastSummaryRow:
      type: object
      required: [period_start, period_end, group, currency, amount, remaining_amount, count]
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        group:
          oneOf:
            - $ref: "#/components/schemas/ReportGroup"
            - type: "null"
        currency:
          $ref: "#/components/schemas/Currency"
        amount:
          $ref: "#/components/schemas/Money"
          description: Total planned.
        remaining_amount:
          $ref: "#/components/schemas/Money"
          description: Total not yet matched by transactions.
        count:
          type: integer

    ForecastSummaryTotals:
      type: object
      description: The whole window added up, over the same forecasts as the rows.
      required: [currency, amount, remaining_amount, count]
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        amount:
          $ref: "#/components/schemas/Money"
          description: Total planned.
        remaining_amount:
          $ref: "#/components/schemas/Money"
          description: Total not yet matched by transactions.
        count:
          type: integer

    ForecastSummary:
      type: object
      required: [object, period, conversion, group_by, has_data, totals, data]
      properties:
        object:
          type: string
          const: forecast_summary
        period:
          $ref: "#/components/schemas/ResolvedPeriod"
        conversion:
          $ref: "#/components/schemas/Conversion"
        group_by:
          oneOf:
            - $ref: "#/components/schemas/ForecastGroupDimension"
            - type: "null"
        has_data:
          type: boolean
          description: "`false` when no forecast matched."
        totals:
          $ref: "#/components/schemas/ForecastSummaryTotals"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ForecastSummaryRow"

    CashFlowSummaryRow:
      type: object
      required:
        - period_start
        - period_end
        - group
        - currency
        - actual_inflow
        - actual_outflow
        - actual_count
        - forecast_inflow
        - forecast_outflow
        - forecast_count
        - inflow
        - outflow
        - net
        - starting_balance
        - opened_accounts
        - transfers
        - excluded
        - final_balance
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        group:
          oneOf:
            - $ref: "#/components/schemas/ReportGroup"
            - type: "null"
        currency:
          $ref: "#/components/schemas/Currency"
        actual_inflow:
          $ref: "#/components/schemas/Money"
          description: Transactions coming in during the period, after the report's exclusions.
        actual_outflow:
          $ref: "#/components/schemas/Money"
          description: Transactions going out during the period, after the report's exclusions. Negative.
        actual_count:
          type: integer
          description: Transactions behind this row, after the report's exclusions.
        forecast_inflow:
          $ref: "#/components/schemas/Money"
          description: Remaining amount of the unrealised inflow forecasts dated in the period.
        forecast_outflow:
          $ref: "#/components/schemas/Money"
          description: Remaining amount of the unrealised outflow forecasts dated in the period. Negative.
        forecast_count:
          type: integer
          description: Forecasts behind this row.
        inflow:
          $ref: "#/components/schemas/Money"
          description: "`actual_inflow` plus `forecast_inflow`. What the cash flow screen shows."
        outflow:
          $ref: "#/components/schemas/Money"
          description: "`actual_outflow` plus `forecast_outflow`. What the cash flow screen shows."
        net:
          $ref: "#/components/schemas/Money"
          description: "`inflow` plus `outflow`. What the cash flow screen shows."
        starting_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Balance of the workspace's accounts at the start of the period, projected when the period starts after today. `null` when `group_by` or `direction` is given.
        opened_accounts:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The opening balances of accounts opened in the period. Not part of the flows. `null` when `group_by` or `direction` is given.
        transfers:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Net of transfers between the workspace's own accounts in the period. Not part of the flows. `null` when `group_by` or `direction` is given.
        excluded:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Net of movements the user excluded from cash flow in the period. Not part of the flows. `null` when `group_by` or `direction` is given.
        final_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Balance at the end of the period, projected when the period ends after today. Starting balance plus `net`, `opened_accounts`, `transfers` and `excluded`. `null` when `group_by` or `direction` is given.

    CashFlowSummaryTotals:
      type: object
      description: The whole window added up, over the same transactions and forecasts as the rows.
      required:
        - currency
        - actual_inflow
        - actual_outflow
        - actual_count
        - forecast_inflow
        - forecast_outflow
        - forecast_count
        - inflow
        - outflow
        - net
        - overdue_inflow
        - overdue_outflow
        - starting_balance
        - opened_accounts
        - transfers
        - excluded
        - final_balance
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        actual_inflow:
          $ref: "#/components/schemas/Money"
        actual_outflow:
          $ref: "#/components/schemas/Money"
        actual_count:
          type: integer
        forecast_inflow:
          $ref: "#/components/schemas/Money"
        forecast_outflow:
          $ref: "#/components/schemas/Money"
        forecast_count:
          type: integer
        inflow:
          $ref: "#/components/schemas/Money"
        outflow:
          $ref: "#/components/schemas/Money"
        net:
          $ref: "#/components/schemas/Money"
        overdue_inflow:
          $ref: "#/components/schemas/Money"
          description: Remaining amount of the overdue unrealised inflow forecasts matching the filters that no row counted. Every one of them when `include_overdue` is off, those dated outside the window when it is on.
        overdue_outflow:
          $ref: "#/components/schemas/Money"
          description: The same for outflow forecasts, negative.
        starting_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The first period's `starting_balance`. `null` when `group_by` or `direction` is given.
        opened_accounts:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The periods' figures added up over the window. `null` when `group_by` or `direction` is given.
        transfers:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The periods' figures added up over the window. `null` when `group_by` or `direction` is given.
        excluded:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The periods' figures added up over the window. `null` when `group_by` or `direction` is given.
        final_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The last period's `final_balance`. `null` when `group_by` or `direction` is given.

    CashFlowSummary:
      type: object
      required:
        - object
        - period
        - conversion
        - group_by
        - bank_ids
        - account_ids
        - forecast_scope
        - include_overdue
        - has_data
        - totals
        - data
      properties:
        object:
          type: string
          const: cash_flow_summary
        period:
          $ref: "#/components/schemas/ResolvedPeriod"
        conversion:
          $ref: "#/components/schemas/Conversion"
        group_by:
          oneOf:
            - $ref: "#/components/schemas/CashFlowGroupDimension"
            - type: "null"
        bank_ids:
          type: array
          description: The `bank_id` filter echoed, empty when none was given.
          items:
            type: string
            format: uuid
        account_ids:
          type: array
          description: The `account_id` filter echoed, empty when none was given.
          items:
            type: string
            format: uuid
        forecast_scope:
          type: string
          const: workspace
          description: "What the forecast half and the overdue totals cover. Always the whole workspace: a forecast has no account, so `bank_ids` and `account_ids` narrow only the actual half and the balances."
        include_overdue:
          type: boolean
          description: Whether overdue forecasts counted in the rows, as requested.
        has_data:
          type: boolean
          description: "`false` when no transaction and no forecast matched."
        totals:
          $ref: "#/components/schemas/CashFlowSummaryTotals"
        data:
          type: array
          items:
            $ref: "#/components/schemas/CashFlowSummaryRow"

    PlanningCategory:
      type: object
      description: The category a budget or scenario row stands for. Rows nest as on the screen, so a parent category's row covers its whole branch. A row whose `id` equals its `parent_id` is the money booked on the parent category itself, which the budgets screen shows as "Others for" the parent.
      required: [dimension, id, label, parent_id]
      properties:
        dimension:
          type: string
          const: category
        id:
          type: string
          format: uuid
        label:
          type: string
          example: Marketing
        parent_id:
          type: [string, "null"]
          format: uuid
          description: The id of the category this row is nested under. `null` for a top-level category.

    BudgetFigures:
      type: object
      description: The planning tab's Total column for one direction. Outflows are negative.
      required: [currency, budgeted, actual, forecast, realised]
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        budgeted:
          $ref: "#/components/schemas/Money"
          description: The budget.
        actual:
          $ref: "#/components/schemas/Money"
          description: Transactions. The tracking tab's Actual column.
        forecast:
          $ref: "#/components/schemas/Money"
          description: Remaining amount of the unrealised forecasts. The tracking tab's Forecasted column.
        realised:
          $ref: "#/components/schemas/Money"
          description: "`actual` plus `forecast`. The figure the planning tab compares with the budget."

    BudgetsSummaryRow:
      type: object
      description: One direction of one period, or one category of one period with `group_by=category`. Outflows are negative.
      required: [period_start, period_end, direction, group, currency, budgeted, actual, forecast, realised, on_budget, note]
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        direction:
          $ref: "#/components/schemas/Direction"
        group:
          oneOf:
            - $ref: "#/components/schemas/PlanningCategory"
            - type: "null"
          description: The category with `group_by=category`. `null` on a row that stands for a whole direction.
        currency:
          $ref: "#/components/schemas/Currency"
        budgeted:
          $ref: "#/components/schemas/Money"
          description: The budget.
        actual:
          $ref: "#/components/schemas/Money"
          description: Transactions dated in the period. The tracking tab's Actual column.
        forecast:
          $ref: "#/components/schemas/Money"
          description: Remaining amount of the unrealised forecasts dated in the period. The tracking tab's Forecasted column.
        realised:
          $ref: "#/components/schemas/Money"
          description: "`actual` plus `forecast`. The figure the planning tab compares with the budget."
        on_budget:
          type: [boolean, "null"]
          description: The planning tab's check or warning icon. `true` when `realised` reached an inflow budget or stayed within an outflow budget. `null` for a month that has not started, for a cell without a budget and with `interval=total`.
        note:
          type: [string, "null"]
          description: The note written on the budget. Set only on category rows with `interval=month`.

    BudgetsBalance:
      type: object
      description: One month of the planning tab's final balance row.
      required: [period_start, period_end, currency, final_balance, budgeted_final_balance]
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        currency:
          $ref: "#/components/schemas/Currency"
        final_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The cash flow's balance at the end of the month, projected for the month still running. `null` for a month that has not started.
        budgeted_final_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The balance at the end of the month if the budgets hold, carried forward from the current month with the budgeted net results. `null` for a month that has ended.

    BudgetsSummaryTotals:
      type: object
      description: The planning tab's Total column for each direction, over the whole window and the same categories as the rows.
      required: [inflow, outflow]
      properties:
        inflow:
          oneOf:
            - $ref: "#/components/schemas/BudgetFigures"
            - type: "null"
          description: "`null` when `direction` or `category_id` leaves inflows out."
        outflow:
          oneOf:
            - $ref: "#/components/schemas/BudgetFigures"
            - type: "null"
          description: "`null` when `direction` or `category_id` leaves outflows out."

    BudgetsSummary:
      type: object
      required: [object, period, conversion, group_by, has_data, totals, data, balances]
      properties:
        object:
          type: string
          const: budgets_summary
        period:
          $ref: "#/components/schemas/ResolvedPlanningPeriod"
        conversion:
          $ref: "#/components/schemas/Conversion"
        group_by:
          type: [string, "null"]
          enum: [category, null]
        has_data:
          type: boolean
          description: "`false` when nothing is budgeted, has moved or is expected in the window, as opposed to figures that came to zero."
        totals:
          $ref: "#/components/schemas/BudgetsSummaryTotals"
        data:
          type: array
          items:
            $ref: "#/components/schemas/BudgetsSummaryRow"
        balances:
          type: array
          description: The planning tab's final balance row, one entry per month. Empty with `interval=total`, `group_by`, `category_id` or `direction`.
          items:
            $ref: "#/components/schemas/BudgetsBalance"

    Scenario:
      type: object
      required: [object, id, name, type, from, to, initial_balance, currency, created_at, updated_at]
      properties:
        object:
          type: string
          const: scenario
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Pessimistic
        type:
          $ref: "#/components/schemas/ScenarioType"
        from:
          type: string
          format: date
          description: First day of the scenario's first month.
        to:
          type: string
          format: date
          description: Last day of the scenario's last month.
        initial_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The balance a snapshot or blank scenario starts from. `null` for a dynamic scenario, which starts from the cash flow's balance.
        currency:
          $ref: "#/components/schemas/Currency"
          description: The workspace currency. Every scenario amount is in it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Equal to `created_at` until the scenario is first changed.
      example:
        object: scenario
        id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
        name: Pessimistic
        type: dynamic
        from: "2026-11-01"
        to: "2027-10-31"
        initial_balance: null
        currency: RON
        created_at: "2026-10-02T08:15:00Z"
        updated_at: "2026-11-10T14:40:00Z"

    ScenarioReference:
      type: object
      description: The scenario reported.
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Pessimistic
        type:
          $ref: "#/components/schemas/ScenarioType"

    ScenarioPeriod:
      type: object
      description: One period of a scenario's tab, or its whole window in `totals`. Outflows are negative.
      required:
        - period_start
        - period_end
        - currency
        - inflow
        - outflow
        - net
        - starting_balance
        - opened_accounts
        - transfers
        - excluded
        - final_balance
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        currency:
          $ref: "#/components/schemas/Currency"
        inflow:
          $ref: "#/components/schemas/Money"
        outflow:
          $ref: "#/components/schemas/Money"
        net:
          $ref: "#/components/schemas/Money"
          description: "`inflow` plus `outflow`."
        starting_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The scenario's balance at the start of the period. `null` on a blank scenario and with `category_id`.
        opened_accounts:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The opening balances of accounts opened in the period. Shown beside the final balance and not part of it. `null` where the tab has no such line and with `category_id`.
        transfers:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Net of transfers between the workspace's own accounts in the period. Shown beside the final balance and not part of it. `null` where the tab has no such line and with `category_id`.
        excluded:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Net of movements excluded from cash flow in the period. Shown beside the final balance and not part of it. `null` where the tab has no such line and with `category_id`.
        final_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The scenario's balance at the end of the period as its tab shows it, which is the balance at the start of the period plus `net`. `null` with `category_id`.

    ScenarioCategoryRow:
      type: object
      description: One category of one period of a scenario's tab.
      required: [period_start, period_end, direction, group, currency, amount, edited, note]
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        direction:
          $ref: "#/components/schemas/Direction"
        group:
          $ref: "#/components/schemas/PlanningCategory"
        currency:
          $ref: "#/components/schemas/Currency"
        amount:
          $ref: "#/components/schemas/Money"
          description: The scenario's amount for the category in the period. Negative for outflows.
        edited:
          type: boolean
          description: "`true` where the scenario sets the amount itself in the period, `false` where a dynamic scenario takes it from the cash flow."
        note:
          type: [string, "null"]
          description: The note written on the cell. Set only with `interval=month`.

    ScenarioSummary:
      type: object
      required: [object, scenario, period, currency, group_by, has_data, totals, data]
      properties:
        object:
          type: string
          const: scenario_summary
        scenario:
          $ref: "#/components/schemas/ScenarioReference"
        period:
          $ref: "#/components/schemas/ResolvedPlanningPeriod"
        currency:
          $ref: "#/components/schemas/Currency"
          description: The workspace currency. Scenario amounts are never converted.
        group_by:
          type: [string, "null"]
          enum: [category, null]
        has_data:
          type: boolean
          description: "`false` when `totals.inflow`, `totals.outflow` and `totals.final_balance` are all zero or absent."
        totals:
          $ref: "#/components/schemas/ScenarioPeriod"
        data:
          type: array
          description: One `ScenarioPeriod` per period without `group_by`. One `ScenarioCategoryRow` per category per period with `group_by=category`.
          items:
            oneOf:
              - $ref: "#/components/schemas/ScenarioPeriod"
              - $ref: "#/components/schemas/ScenarioCategoryRow"

    ScenarioFinalBalance:
      type: object
      required: [id, name, final_balance]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Pessimistic
        final_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The scenario's balance at the end of the period, as its tab shows it. `null` in a period outside the scenario's months.

    ScenariosSummaryRow:
      type: object
      description: One period of the Summary tab.
      required: [period_start, period_end, currency, cash_flow_final_balance, scenarios]
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        currency:
          $ref: "#/components/schemas/Currency"
        cash_flow_final_balance:
          $ref: "#/components/schemas/Money"
          description: The cash flow's balance at the end of the period, projected when the period ends after today.
        scenarios:
          type: array
          description: Every scenario in the workspace with its balance at the end of the period.
          items:
            $ref: "#/components/schemas/ScenarioFinalBalance"

    ScenariosSummary:
      type: object
      required: [object, period, currency, data]
      properties:
        object:
          type: string
          const: scenarios_summary
        period:
          $ref: "#/components/schemas/ResolvedPlanningPeriod"
        currency:
          $ref: "#/components/schemas/Currency"
          description: The workspace currency. Scenario amounts are never converted.
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScenariosSummaryRow"

    AccountBalance:
      type: object
      required: [account_id, name, native_currency, native_balance, balance]
      properties:
        account_id:
          type: string
          format: uuid
        name:
          type: string
          example: ING Curent
        native_currency:
          $ref: "#/components/schemas/Currency"
        native_balance:
          $ref: "#/components/schemas/Money"
          description: The balance in the account's own currency, unconverted.
        balance:
          $ref: "#/components/schemas/Money"
          description: The same balance in the requested currency.

    Balances:
      type: object
      required: [object, as_of, conversion, total, accounts]
      properties:
        object:
          type: string
          const: balances
        as_of:
          type: string
          format: date
          description: The day whose end-of-day position is reported.
        conversion:
          $ref: "#/components/schemas/Conversion"
        total:
          $ref: "#/components/schemas/Money"
          description: Every account added together, in the requested currency.
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountBalance"

    BankDetails:
      type: object
      description: Raw fields received from the bank.
      required: [payer, payer_details, payee, payee_details, reference, additional]
      properties:
        payer:
          type: [string, "null"]
        payer_details:
          type: [string, "null"]
          description: Payer account identifiers as provided by the bank.
        payee:
          type: [string, "null"]
        payee_details:
          type: [string, "null"]
        reference:
          type: [string, "null"]
          description: Payment reference or information line.
        additional:
          type: [string, "null"]

    ExpandableCategory:
      description: A category id, or the full category when named in `expand`.
      oneOf:
        - type: string
          format: uuid
        - $ref: "#/components/schemas/Category"

    ExpandableCounterparty:
      description: A counterparty id, the full counterparty when named in `expand`, or `null` when unattributed.
      oneOf:
        - type: string
          format: uuid
        - $ref: "#/components/schemas/Counterparty"
        - type: "null"

    ExpandableRecurrence:
      description: The id of the recurring plan the forecast was generated from, the full plan when named in `expand`, or `null` for a one-off forecast.
      oneOf:
        - type: string
          format: uuid
        - $ref: "#/components/schemas/Recurrence"
        - type: "null"

    ExpandableAccount:
      description: An account id, or the full account when named in `expand`.
      oneOf:
        - type: string
          format: uuid
        - $ref: "#/components/schemas/Account"

    ExpandableLabels:
      description: Label ids, or the full labels when `labels` is named in `expand`.
      type: array
      items:
        oneOf:
          - type: string
            format: uuid
          - $ref: "#/components/schemas/Label"

    Transaction:
      type: object
      required:
        - object
        - id
        - date
        - amount
        - currency
        - direction
        - status
        - source
        - description
        - comment
        - account
        - category
        - counterparty
        - labels
        - bank_details
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: transaction
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: Booking date. There is no time component.
          example: "2026-09-03"
        amount:
          $ref: "#/components/schemas/Money"
        currency:
          $ref: "#/components/schemas/Currency"
        direction:
          $ref: "#/components/schemas/Direction"
        status:
          $ref: "#/components/schemas/TransactionStatus"
        source:
          $ref: "#/components/schemas/TransactionSource"
        description:
          type: [string, "null"]
          example: ORANGE ROMANIA SA
        comment:
          type: [string, "null"]
          description: Free text added by users in ThinkOut.
        account:
          $ref: "#/components/schemas/ExpandableAccount"
        category:
          oneOf:
            - $ref: "#/components/schemas/ExpandableCategory"
            - type: "null"
          description: "`null` for a split transaction, whose categorisation lives on its pieces."
        counterparty:
          $ref: "#/components/schemas/ExpandableCounterparty"
        labels:
          $ref: "#/components/schemas/ExpandableLabels"
        bank_details:
          oneOf:
            - $ref: "#/components/schemas/BankDetails"
            - type: "null"
          description: "`null` unless `source` is `bank`."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        object: transaction
        id: 8f1c0a4e-2b1d-4c8e-9f3a-7d6e5c4b3a21
        date: "2026-09-03"
        amount: "-1250.00"
        currency: RON
        direction: outflow
        status: booked
        source: bank
        description: ORANGE ROMANIA SA
        comment: null
        account: c2d7e8f9-1a2b-4c3d-8e9f-0a1b2c3d4e5f
        category: 3b4c5d6e-7f80-4a1b-9c2d-3e4f5a6b7c8d
        counterparty: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        labels:
          - 1f2e3d4c-5b6a-4978-8877-665544332211
        bank_details:
          payer: THINKOUT SRL
          payer_details: RO49INGB0000999900000001
          payee: ORANGE ROMANIA SA
          payee_details: RO12BTRL0000000000000002
          reference: Factura 2026-08 nr 1234567
          additional: null
        created_at: "2026-09-03T08:12:44Z"
        updated_at: "2026-09-03T08:12:44Z"

    BankStatus:
      type: string
      description: |
        `connected` is working. `loading` is a sync in progress. `requires_action` needs a
        person to sign in or re-approve the connection in ThinkOut. `error` is any other
        failure. Only `connected` means the data behind it is current.
      enum: [connected, loading, requires_action, error]

    Bank:
      type: object
      description: One authorisation with one bank. Several accounts can share a connection, and a workspace can hold several connections to the same bank.
      required:
        - object
        - id
        - name
        - country_code
        - status
        - last_sync_at
        - consent_expires_at
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: bank
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The bank's name as the provider reports it.
          example: ING Bank
        country_code:
          type: [string, "null"]
          description: ISO 3166-1 alpha-2 country of the bank.
          pattern: "^[A-Z]{2}$"
          example: RO
        status:
          $ref: "#/components/schemas/BankStatus"
        last_sync_at:
          type: [string, "null"]
          format: date-time
          description: When the provider last returned data successfully, or `null`. A `connected` connection with an old `last_sync_at` is the case worth alerting on.
        consent_expires_at:
          type: [string, "null"]
          format: date-time
          description: When the bank consent needs renewal, if the provider reports it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        object: bank
        id: 5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f
        name: ING Bank
        country_code: RO
        status: connected
        last_sync_at: "2026-09-03T06:00:00Z"
        consent_expires_at: "2026-11-30T00:00:00Z"
        created_at: "2024-01-01T10:00:00Z"
        updated_at: "2026-09-03T06:00:00Z"

    ExpandableBank:
      description: A bank connection id, the full connection when named in `expand`, or `null` for a manual account. On a `delegated` account the connection belongs to another workspace, so the id is returned but is neither expanded nor readable.
      oneOf:
        - type: string
          format: uuid
        - $ref: "#/components/schemas/Bank"
        - type: "null"

    Account:
      type: object
      required:
        - object
        - id
        - name
        - currency
        - group
        - source
        - balance
        - balance_as_of
        - opening_balance
        - opening_date
        - bank
        - external_account_id
        - original_name
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: account
        id:
          type: string
          format: uuid
        name:
          type: string
          example: ING Curent
        currency:
          $ref: "#/components/schemas/Currency"
        group:
          type: [string, "null"]
          description: Free-text grouping assigned in ThinkOut.
          example: Operational
        source:
          $ref: "#/components/schemas/AccountSource"
        balance:
          $ref: "#/components/schemas/Money"
        balance_as_of:
          type: string
          format: date
          description: The day whose end-of-day balance is reported.
        opening_balance:
          $ref: "#/components/schemas/Money"
        opening_date:
          type: string
          format: date
          description: The date the opening balance applies to.
        bank:
          $ref: "#/components/schemas/ExpandableBank"
        external_account_id:
          type: [string, "null"]
          description: The account identifier at the provider. `null` for manual accounts.
        original_name:
          type: [string, "null"]
          description: The account name as the bank reports it, before any rename in ThinkOut. `null` for manual accounts.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        object: account
        id: c2d7e8f9-1a2b-4c3d-8e9f-0a1b2c3d4e5f
        name: ING Curent
        currency: RON
        group: Operational
        source: bank
        balance: "15230.45"
        balance_as_of: "2026-09-03"
        opening_balance: "1000.00"
        opening_date: "2024-01-01"
        bank: 5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f
        external_account_id: "ACC-00012345"
        original_name: Cont curent RON
        created_at: "2024-01-01T10:00:00Z"
        updated_at: "2026-08-30T06:00:00Z"

    Category:
      type: object
      required: [object, id, name, code, direction, activity, parent_id, position, color, created_at, updated_at]
      properties:
        object:
          type: string
          const: category
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Telecom
        code:
          type: [string, "null"]
          description: The category's identifier in the template the workspace was created from, or `null` for a category someone created. Only `uncategorized_inflows` and `uncategorized_outflows` exist in every workspace and are worth branching on.
          example: uncategorized_outflows
        direction:
          $ref: "#/components/schemas/Direction"
        activity:
          $ref: "#/components/schemas/Activity"
        parent_id:
          type: [string, "null"]
          format: uuid
          description: "`null` for top-level categories."
        position:
          type: integer
          description: Order among siblings, as shown in ThinkOut.
        color:
          type: [string, "null"]
          description: Lowercase hex color as shown in ThinkOut.
          pattern: "^#[0-9a-f]{6}$"
          example: "#1b7fe4"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        object: category
        id: 3b4c5d6e-7f80-4a1b-9c2d-3e4f5a6b7c8d
        name: Telecom
        code: null
        direction: outflow
        activity: operating
        parent_id: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
        position: 2
        color: "#1b7fe4"
        created_at: "2024-01-01T10:00:00Z"
        updated_at: "2024-01-01T10:00:00Z"

    Counterparty:
