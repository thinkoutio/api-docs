    SkipReason:
      type: string
      description: |-
        De ce un element a rămas cum era.

        `not_found`: nu există un astfel de element în spațiul de lucru. `unchanged`: are deja valoarea. `direction_mismatch`: s-a trimis o categorie sau o previziune de încasare pentru o plată, sau invers. `split`: tranzacția este împărțită în bucăți, care se modifică în ThinkOut. `already_transfer`: tranzacția face deja parte dintr-un transfer. `not_transfer`: nu face parte dintr-un transfer. `same_direction`: ambele părți ale unei perechi sunt încasări, sau ambele plăți. `same_account`: ambele părți ale unei perechi sunt în același cont. `excluded`: tranzacția este exclusă din cash flow; include-o mai întâi. `pending`: tranzacția este încă în așteptare la bancă. `suggestion_closed`: sugestia a fost deja acceptată sau respinsă. `already_linked`: tranzacția este deja asociată cu acea previziune. `not_linked`: nu este asociată cu acea previziune. `already_realised`: previziunea este deja închisă. `not_realised`: previziunea este deschisă. `has_links`: încă există tranzacții asociate cu previziunea; dezasociază-le în loc să o redeschizi. `not_on_budgets`: categoria nu este afișată pe bugete. `already_set`: o regulă ar înlocui o categorie sau un partener deja setat.
      enum:
        - not_found
        - unchanged
        - direction_mismatch
        - split
        - already_transfer
        - not_transfer
        - same_direction
        - same_account
        - excluded
        - pending
        - suggestion_closed
        - already_linked
        - not_linked
        - already_realised
        - not_realised
        - has_links
        - not_on_budgets
        - already_set
