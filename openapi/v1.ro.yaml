info:
  title: ThinkOut API
  version: '1.0'
  description: |-
    Citește și modifică datele unui spațiu de lucru ThinkOut.

    Citirile sunt `GET`. Listele folosesc același înveliș și se paginează cu un cursor oriunde pot crește. Fiecare răspuns poartă `X-RateLimit-Limit`, `X-RateLimit-Remaining` și `X-RateLimit-Reset`.

    Scrierile modifică tranzacții, previziuni, valori de buget și reguli de categorisire existente. Au nevoie de o cheie creată cu acces de citire și modificare, primesc cel mult 100 de elemente pe apel și se aplică imediat. `dry_run=true` face o simulare: întoarce același rezultat fără să modifice nimic.

    Versiunea 1 se schimbă doar prin adăugare: pot apărea oricând endpointuri noi, parametri opționali, câmpuri de răspuns și valori de enumerare. Tolerează câmpurile necunoscute și nu trata niciodată o enumerare ca închisă.
