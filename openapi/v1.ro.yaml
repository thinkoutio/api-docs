        - type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Pessimistic
        type:
          $ref: '#/components/schemas/ScenarioType'
    ScenarioPeriod:
      type: object
      description: Un interval din tabul unui scenariu, sau întreaga lui fereastră în `totals`. Plățile sunt negative.
      required:
