        after: "-4000.00"

    RuleCondition:
      type: object
      description: |
        Either one test or a group of tests. A test sets `property`, `criteria` and `value`. A
        group sets `operation` and `conditions`, which hold tests or, one level down, groups of
        tests. At most 20 tests in all.

        Properties and their criteria:

        - `description`: `contains`, `starts_with`, `ends_with`, `does_not_contain`. The value is
          text of at most 200 characters, matched ignoring case.
        - `amount`: `equals`, `not_equals`, `greater_than`, `greater_than_or_equal`,
          `less_than`, `less_than_or_equal`. The value is a positive number such as `250.50`;
          direction is a separate test.
        - `currency`: `equals`, `not_equals`. The value is a currency id.
        - `account`: `equals`, `not_equals`. The value is an account id.
        - `date`: `equals`, `before`, `after`. The value is a date such as `2026-03-15`.
        - `direction`: `equals`, `not_equals`. The value is `inflow` or `outflow`.
      properties:
        operation:
          type: [string, "null"]
          enum: [and, or, null]
          description: For a group. `and` needs every condition to match, `or` any one of them.
        conditions:
          type: [array, "null"]
          description: For a group. The tests or groups it joins.
          items:
            $ref: "#/components/schemas/RuleCondition"
        property:
          type: [string, "null"]
          enum: [description, amount, currency, account, date, direction, null]
          description: For a test.
        criteria:
          type: [string, "null"]
          description: For a test. How the property is compared to the value; the choices depend on the property.
        value:
          type: [string, "null"]
          description: For a test. What to compare with, always as a string.

    RuleEffect:
      type: object
      description: |
        What the rule sets. Only items that exist in the workspace, chosen by id. Set at least
        one. A rule cannot both exclude and mark as a transfer.
      properties:
        category_id:
          type: [string, "null"]
          format: uuid
          description: The category to set. It must fit the direction the condition requires, when it requires one.
        counterparty_id:
          type: [string, "null"]
          format: uuid
        label_ids:
          type: array
          maxItems: 20
          description: Labels to add. The labels a transaction already has stay.
          items:
            type: string
            format: uuid
        exclude:
          type: boolean
          default: false
          description: Exclude matching transactions from cash flow.
        mark_transfer:
          type: boolean
          default: false
          description: Mark matching transactions as transfers between the workspace's own accounts, with no partner transaction.

    RuleDefinition:
      type: object
      required: [condition, effect]
      properties:
        condition:
          $ref: "#/components/schemas/RuleCondition"
        effect:
          $ref: "#/components/schemas/RuleEffect"
        comment:
          type: [string, "null"]
          maxLength: 1000
          description: An optional note on the rule.

    RuleInput:
      allOf:
        - $ref: "#/components/schemas/RuleDefinition"
        - type: object
          properties:

    RuleView:
      type: object
      required: [definition, condition, effect]
      properties:
        definition:
          $ref: "#/components/schemas/RuleDefinition"
        condition:
          type: string
          description: 'The condition in words, such as `description contains "rent"`, `amount is over 100` or `date is on 2026-03-15`.'
        effect:
          type: string
          description: The effect in words, such as `set category Rent; counterparty Landlord; labels A, B and exclude from cash flow`, `mark as a transfer` or `do nothing`.

    RuleMatchedTransaction:
      type: object
      required: [transaction_id, date, amount, currency, description, category, counterparty]
      properties:
        transaction_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        currency:
          $ref: "#/components/schemas/Currency"
        description:
          type: [string, "null"]
        category:
          type: [string, "null"]
          description: The name of the category it has now.
        counterparty:
          type: [string, "null"]
          description: The name of the counterparty it has now.

    RuleMatches:
      type: object
      required: [days, total, latest]
      properties:
        days:
          type: integer
          description: How many days back the check looked. Currently 90.
        total:
          type: integer
          description: How many transactions in that time the condition matches.
        latest:
          type: array
          maxItems: 20
          description: The newest matches.
          items:
            $ref: "#/components/schemas/RuleMatchedTransaction"

    RuleChange:
      type: object
      required: [rule_id, before, after, was_automatic, recent_matches]
      properties:
        rule_id:
          type: string
          format: uuid
          description: The rule's id. For a dry run of a new rule, the id it would get.
        before:
          oneOf:
            - $ref: "#/components/schemas/RuleView"
            - type: "null"
          description: The rule before the change. `null` for a new rule. For a deletion, the whole rule.
        after:
          oneOf:
            - $ref: "#/components/schemas/RuleView"
            - type: "null"
          description: The rule after the change. `null` for a deleted rule.
        was_automatic:
          type: boolean
          description: ThinkOut derived the rule itself. Editing makes it a rule the user wrote.
        recent_matches:
          oneOf:
            - $ref: "#/components/schemas/RuleMatches"
            - type: "null"
          description: Which recent transactions the new condition matches. `null` for a deletion.

    RuleFieldChange:
      type: object
      required: [from_id, to_id, overwrites]
      properties:
        from_id:
          type: [string, "null"]
          format: uuid
          description: What the transaction had before. `null` when it had nothing.
        to_id:
          type: string
          format: uuid
        overwrites:
          type: boolean
          description: The transaction had a value, which the rule replaces.

    RuleApplyChange:
      type: object
      required: [transaction_id, category, counterparty, labels_added, excluded, marked_transfer, kept]
      properties:
        transaction_id:
          type: string
          format: uuid
        category:
          oneOf:
            - $ref: "#/components/schemas/RuleFieldChange"
            - type: "null"
        counterparty:
          oneOf:
            - $ref: "#/components/schemas/RuleFieldChange"
            - type: "null"
        labels_added:
          type: array
          description: The names of the labels the transaction gains.
          items:
            type: string
        excluded:
          type: boolean
          description: The rule excludes the transaction from cash flow.
        marked_transfer:
          type: boolean
          description: The rule marks the transaction as a transfer.
        kept:
          type: array
          description: Fields the rule would set but leaves because `overwrite` is off.
          items:
            type: string
            enum: [category, counterparty]

    RuleApplyResult:
      allOf:
        - $ref: "#/components/schemas/WriteResult"
        - type: object
          required: [from, to, matched, changeable, not_applied, skipped_total]
          properties:
            changes:
              type: array
              items:
                $ref: "#/components/schemas/RuleApplyChange"
            skipped:
              type: array
              items:
                $ref: "#/components/schemas/SkippedItem"
              example:
                - item_kind: transaction
                  id: 3c90c3cc-0d44-4b50-8888-8dd25736052a
                  month: null
                  reason: already_set
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            matched:
              type: integer
              description: Transactions in the range that the condition matches, whether or not they change.
            changeable:
              type: integer
              description: Matching transactions the rule would change.
            not_applied:
              type: integer
              description: Changeable transactions beyond the 100 a call changes. Apply again to change the next ones.
            skipped_total:
              type: integer
              description: Matching transactions left alone. `skipped` lists at most 100 of them.
