    RuleCondition:
      type: object
      description: |-
        Fie un singur test, fie un grup de teste. Un test setează `property`, `criteria` și `value`. Un grup setează `operation` și `conditions`, care conțin teste sau, cu un nivel mai jos, grupuri de teste. Cel mult 20 de teste în total.

        Proprietățile și criteriile lor:

        - `description`: `contains`, `starts_with`, `ends_with`, `does_not_contain`. Valoarea este un text de cel mult 200 de caractere, comparat fără a ține cont de majuscule.
        - `amount`: `equals`, `not_equals`, `greater_than`, `greater_than_or_equal`, `less_than`, `less_than_or_equal`. Valoarea este un număr pozitiv, de exemplu `250.50`; direcția este un test separat.
        - `currency`: `equals`, `not_equals`. Valoarea este un id de monedă.
        - `account`: `equals`, `not_equals`. Valoarea este un id de cont.
        - `date`: `equals`, `before`, `after`. Valoarea este o dată, de exemplu `2026-03-15`.
        - `direction`: `equals`, `not_equals`. Valoarea este `inflow` sau `outflow`.
      properties:
        operation:
          type:
            - string
            - 'null'
          enum:
            - and
            - or
            - null
          description: Pentru un grup. `and` cere ca fiecare condiție să se potrivească, `or` cere ca oricare dintre ele să se potrivească.
        conditions:
          type:
            - array
            - 'null'
          description: Pentru un grup. Testele sau grupurile pe care le leagă.
          items:
            $ref: '#/components/schemas/RuleCondition'
        property:
          type:
            - string
            - 'null'
          enum:
            - description
            - amount
            - currency
            - account
            - date
            - direction
            - null
          description: Pentru un test.
        criteria:
          type:
            - string
            - 'null'
          description: Pentru un test. Cum se compară proprietatea cu valoarea; opțiunile depind de proprietate.
        value:
          type:
            - string
            - 'null'
          description: Pentru un test. Valoarea cu care se compară, întotdeauna ca șir de caractere.
    RuleEffect:
      type: object
      description: Ce setează regula. Doar elemente care există în spațiul de lucru, alese după id. Setează cel puțin unul. O regulă nu poate să excludă și să marcheze ca transfer în același timp.
      properties:
        category_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Categoria de setat. Trebuie să corespundă direcției cerute de condiție, când condiția cere una.
        counterparty_id:
          type:
            - string
            - 'null'
          format: uuid
        label_ids:
          type: array
          maxItems: 20
          description: Etichetele de adăugat. Etichetele pe care tranzacția le are deja rămân.
          items:
            type: string
            format: uuid
        exclude:
          type: boolean
          default: false
          description: Exclude din cash flow tranzacțiile care se potrivesc.
        mark_transfer:
          type: boolean
          default: false
          description: Marchează tranzacțiile care se potrivesc ca transferuri între conturile proprii ale spațiului de lucru, fără tranzacție pereche.
    RuleDefinition:
      type: object
      required:
        - condition
        - effect
      properties:
        condition:
          $ref: '#/components/schemas/RuleCondition'
        effect:
          $ref: '#/components/schemas/RuleEffect'
        comment:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: O notă opțională despre regulă.
    RuleInput:
      allOf:
        - $ref: '#/components/schemas/RuleDefinition'
        - type: object
          properties: null
    RuleView:
      type: object
      required:
        - definition
        - condition
        - effect
      properties:
        definition:
          $ref: '#/components/schemas/RuleDefinition'
        condition:
          type: string
          description: Condiția, în cuvinte, de exemplu `description contains "rent"`, `amount is over 100` sau `date is on 2026-03-15`.
        effect:
          type: string
          description: Efectul, în cuvinte, de exemplu `set category Rent; counterparty Landlord; labels A, B and exclude from cash flow`, `mark as a transfer` sau `do nothing`.
    RuleMatchedTransaction:
      type: object
      required:
        - transaction_id
        - date
        - amount
        - currency
        - description
        - category
        - counterparty
      properties:
        transaction_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type:
            - string
            - 'null'
        category:
          type:
            - string
            - 'null'
          description: Numele categoriei pe care o are acum.
        counterparty:
          type:
            - string
            - 'null'
          description: Numele partenerului pe care îl are acum.
    RuleMatches:
      type: object
      required:
        - days
        - total
        - latest
      properties:
        days:
          type: integer
          description: Câte zile în urmă a verificat. În prezent 90.
        total:
          type: integer
          description: Câte tranzacții din această perioadă se potrivesc condiției.
        latest:
          type: array
          maxItems: 20
          description: Cele mai noi potriviri.
          items:
            $ref: '#/components/schemas/RuleMatchedTransaction'
    RuleChange:
      type: object
      required:
        - rule_id
        - before
        - after
        - was_automatic
        - recent_matches
      properties:
        rule_id:
          type: string
          format: uuid
          description: Id-ul regulii. La o simulare pentru o regulă nouă, id-ul pe care l-ar primi.
        before:
          oneOf:
            - $ref: '#/components/schemas/RuleView'
            - type: 'null'
          description: Regula înainte de modificare. `null` pentru o regulă nouă. La o ștergere, regula întreagă.
        after:
          oneOf:
            - $ref: '#/components/schemas/RuleView'
            - type: 'null'
          description: Regula după modificare. `null` pentru o regulă ștearsă.
        was_automatic:
          type: boolean
          description: Regula a fost creată automat de ThinkOut. Modificarea o transformă într-o regulă scrisă de utilizator.
        recent_matches:
          oneOf:
            - $ref: '#/components/schemas/RuleMatches'
            - type: 'null'
          description: Ce tranzacții recente se potrivesc noii condiții. `null` la o ștergere.
    RuleFieldChange:
      type: object
      required:
        - from_id
        - to_id
        - overwrites
      properties:
        from_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Ce avea tranzacția înainte. `null` când nu avea nimic.
        to_id:
          type: string
          format: uuid
        overwrites:
          type: boolean
          description: Tranzacția avea o valoare, pe care regula o înlocuiește.
    RuleApplyChange:
      type: object
      required:
        - transaction_id
        - category
        - counterparty
        - labels_added
        - excluded
        - marked_transfer
        - kept
      properties:
        transaction_id:
          type: string
          format: uuid
        category:
          oneOf:
            - $ref: '#/components/schemas/RuleFieldChange'
            - type: 'null'
        counterparty:
          oneOf:
            - $ref: '#/components/schemas/RuleFieldChange'
            - type: 'null'
        labels_added:
          type: array
          description: Numele etichetelor pe care le primește tranzacția.
          items:
            type: string
        excluded:
          type: boolean
          description: Regula exclude tranzacția din cash flow.
        marked_transfer:
          type: boolean
          description: Regula marchează tranzacția ca transfer.
        kept:
          type: array
          description: Câmpurile pe care regula le-ar seta, dar le lasă neatinse pentru că `overwrite` este dezactivat.
          items:
            type: string
            enum:
              - category
              - counterparty
    RuleApplyResult:
      allOf:
        - $ref: '#/components/schemas/WriteResult'
        - type: object
          required:
            - from
            - to
            - matched
            - changeable
            - not_applied
            - skipped_total
          properties:
            changes:
              type: array
              items:
                $ref: '#/components/schemas/RuleApplyChange'
            skipped:
              type: array
              items:
                $ref: '#/components/schemas/SkippedItem'
              example:
                - item_kind: transaction
                  id: 3c90c3cc-0d44-4b50-8888-8dd25736052a
                  month: null
                  reason: already_set
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            matched:
              type: integer
              description: Tranzacțiile din interval care se potrivesc condiției, fie că se modifică, fie că nu.
            changeable:
              type: integer
              description: Tranzacțiile potrivite pe care regula le-ar modifica.
            not_applied:
              type: integer
              description: Tranzacțiile care pot fi modificate, peste cele 100 pe care le modifică un apel. Aplică din nou regula ca să le modifici pe următoarele.
            skipped_total:
              type: integer
              description: Tranzacțiile potrivite lăsate neatinse. `skipped` listează cel mult 100 dintre ele.
