  /scenarios/{id}/summary:
    get:
      tags: [Scenarios]
      operationId: summariseScenario
      summary: Summarise a scenario
      description: |
        What a scenario's tab on the scenarios screen shows, per month or for the whole window,
        per period or per category. Give `period`, or both `from` and `to`, or neither for the
        scenario's own months.

        The window widens to whole months and is clipped to the scenario's months. A window
        outside them is rejected with 400. Amounts are in the workspace currency and are never
        converted. Outflows are negative.

        Without `group_by` there is one row per period with `inflow`, `outflow` and `net`, and
        the balance lines of the tab. `final_balance` is `starting_balance` plus `net`, as the
        tab computes it. `opened_accounts`, `transfers` and `excluded` appear beside it and do
        not enter it. A dynamic scenario has every line. A snapshot has `opened_accounts`,
        `transfers` and `excluded` unless the line is zero in every month. A blank scenario has
        only `final_balance`. Lines the tab does not show are `null`.

        `totals` covers the whole window: the flows and the balance lines added up, the first
        period's `starting_balance` and the last period's `final_balance`.

        With `group_by=category` there is one row per category per period, nested as on the
        screen. A parent category's row is its whole branch, so adding a parent and its
        children counts the children twice. `edited` is `true` where the scenario sets the
        amount itself rather than taking it from the cash flow. A category appears in a period
        when it has an amount or the scenario edited it. `category_id` narrows the rows and
        `totals` to those categories and the ones nested under them, and the balance fields
        are then `null`.

