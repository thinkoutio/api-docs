        "429":
          $ref: "#/components/responses/RateLimited"

  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories
      description: |
        The category tree flattened in ThinkOut's display order: inflows, then outflows; within
        each, every category followed by its subcategories, siblings by `position`. `direction`
        narrows to one side.

        Rebuild the hierarchy with `parent_id`.
      parameters:
        - $ref: "#/components/parameters/direction"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of categories.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /categories/{id}:
