  /forecasts/summary:
    get:
      tags:
        - Rapoarte
      operationId: summariseForecasts
      summary: Sintetizează previziunile
      description: |-
        Totaluri peste previziunile cu dată, pe interval de timp și cel mult încă o dimensiune. Trimite `period`, sau atât `from`, cât și `to`.

        `amount` însumează ce a fost planificat, iar `remaining_amount` partea neacoperită încă de tranzacții. Se numără orice stare dacă `status` nu restrânge, așa că o previziune realizată se adaugă la `amount` și nu adaugă nimic la `remaining_amount`. Sumele se convertesc în `currency` la cursul din data fiecărei previziuni. Intervalele sunt aliniate la calendar și tăiate la fereastra cerută. `totals` acoperă întreaga fereastră.

        Rândurile grupate sunt ordonate după `amount` în valoare absolută, cel mai mare primul. Un interval păstrează cel mult 50 de grupuri; restul se strâng într-un singur rând etichetat `other`. Previziunile fără partener sau fără etichetă ajung într-un rând `none`, iar o previziune cu mai multe etichete se numără o dată pentru fiecare etichetă. Aici `category_id` acoperă și subcategoriile.
      parameters:
        - $ref: '#/components/parameters/period'
        - name: from
          in: query
          description: Prima zi a ferestrei, inclusiv. Obligatoriu împreună cu `to`, dacă nu este trimis `period`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Ultima zi a ferestrei, inclusiv. Obligatoriu împreună cu `from`, dacă nu este trimis `period`.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/interval'
        - name: group_by
          in: query
          description: O a doua dimensiune de grupare, pe lângă intervalul de timp. Omite-o pentru un singur rând per interval.
          schema:
            $ref: '#/components/schemas/ForecastGroupDimension'
        - $ref: '#/components/parameters/currency'
        - $ref: '#/components/parameters/category_id'
        - $ref: '#/components/parameters/label_id'
        - $ref: '#/components/parameters/counterparty_id'
        - $ref: '#/components/parameters/direction'
        - $ref: '#/components/parameters/activity'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ForecastStatus'
      responses:
        '200':
          description: Sinteza.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/rapoarte/sintetizeaza-previziunile
  /cash-flow/summary:
    get:
      tags:
        - Rapoarte
      operationId: summariseCashFlow
      summary: Sintetizează cash flow-ul
      description: |-
        Ce arată ecranul de cash flow, descompus, pe interval de timp și cel mult încă o dimensiune. Trimite `period`, sau atât `from`, cât și `to`.

        Fiecare interval are o parte realizată și o parte previzionată. Partea realizată o formează tranzacțiile datate în interval, numărate cum le numără `/transactions/summary`: transferurile între conturile proprii ale spațiului de lucru și mișcările excluse sunt lăsate deoparte, iar tranzacțiile împărțite se numără prin bucățile lor. Partea previzionată este suma rămasă a previziunilor nerealizate datate în interval. O previziune acoperită parțial se numără doar cu ce mai este așteptat, iar tranzacțiile asociate ei se numără ca realizate. `inflow`, `outflow` și `net` adună cele două părți și coincid cu ecranul.

        Previziunile datate înainte de azi și încă nerealizate sunt restante. Ele sunt lăsate în afara rândurilor, dacă nu este trimis `include_overdue=true`. `totals.overdue_inflow` și `totals.overdue_outflow` raportează mereu suma rămasă a previziunilor restante pe care rândurile nu le-au numărat.

        Sumele se convertesc în `currency` la cursul din data fiecărei mișcări. Intervalele sunt aliniate la calendar și tăiate la fereastra cerută. `totals` acoperă întreaga fereastră.

        Rândurile grupate doar pe interval poartă și soldul de început, conturile deschise, transferurile, mișcările excluse și soldul de final ale intervalului. Soldul de final al unui interval viitor este soldul proiectat. Cele cinci sunt `null` când este trimis `group_by` sau `direction`.

        Un filtru `bank_id` sau `account_id` restrânge partea realizată și soldurile, niciodată previziunile, care nu au cont și acoperă mereu întregul spațiu de lucru. Un `bank_id` care nu se potrivește cu niciun cont întoarce rezultatul gol: niciun rând și totaluri zero. `group_by=account` este respins cu 400 din același motiv.

        Rândurile grupate sunt ordonate după `net` în valoare absolută, cel mai mare primul. Un interval păstrează cel mult 50 de grupuri; restul se strâng într-un singur rând etichetat `other`. Tranzacțiile și previziunile fără partener sau fără etichetă ajung într-un rând `none`, iar una cu mai multe etichete se numără o dată pentru fiecare etichetă. Aici `category_id` acoperă și subcategoriile.

        Filtrele se combină cu AND; un filtru care acceptă o listă își combină valorile cu OR.

        **Cash flow pe luni pentru trimestrul următor**

        ```http
        GET /cash-flow/summary?period=next_quarter&interval=month
        ```

        **Încasări așteptate pe partener luna viitoare**

        ```http
        GET /cash-flow/summary?period=next_month&group_by=counterparty&direction=inflow
        ```
      parameters:
        - $ref: '#/components/parameters/period'
        - name: from
          in: query
          description: Prima zi a ferestrei, inclusiv. Obligatoriu împreună cu `to`, dacă nu este trimis `period`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Ultima zi a ferestrei, inclusiv. Obligatoriu împreună cu `from`, dacă nu este trimis `period`.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/interval'
        - name: group_by
          in: query
          description: O a doua dimensiune de grupare, pe lângă intervalul de timp. Omite-o pentru un singur rând per interval.
          schema:
            $ref: '#/components/schemas/CashFlowGroupDimension'
        - $ref: '#/components/parameters/currency'
        - $ref: '#/components/parameters/bank_id'
        - $ref: '#/components/parameters/account_id'
        - $ref: '#/components/parameters/category_id'
        - $ref: '#/components/parameters/label_id'
        - $ref: '#/components/parameters/counterparty_id'
        - $ref: '#/components/parameters/direction'
        - $ref: '#/components/parameters/activity'
        - name: include_overdue
          in: query
          description: Dacă previziunile restante, cele datate înainte de azi și încă nerealizate, se numără în rândurile intervalelor în care cad. Dezactivat, ele apar doar în `totals.overdue_inflow` și `totals.overdue_outflow`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Sinteza.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/rapoarte/sintetizeaza-cash-flow-ul
  /balances:
    get:
      tags:
        - Rapoarte
      operationId: getBalances
      summary: Citește soldurile
      description: |-
        Soldul fiecărui cont și totalul lor la sfârșitul zilei `as_of`, conturile ordonate după `name`.

        Un sold este soldul inițial plus tranzacțiile contului până în ziua aceea, așa că `as_of` nu poate fi în viitor. Fiecare sold se convertește integral la cursul din `as_of`, spre deosebire de o sinteză, care convertește fiecare mișcare la data ei.
      parameters:
        - $ref: '#/components/parameters/as_of'
        - $ref: '#/components/parameters/currency'
      responses:
        '200':
          description: Soldurile pe fiecare cont și totalul.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balances'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/rapoarte/citeste-soldurile
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: O cheie API creată în setările ThinkOut. O cheie citește un singur spațiu de lucru.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    from:
      name: from
      in: query
      description: Cea mai veche `date` inclusă, inclusiv.
      schema:
        type: string
        format: date
    to:
      name: to
      in: query
      description: Cea mai recentă `date` inclusă, inclusiv.
      schema:
        type: string
        format: date
    direction:
      name: direction
      in: query
      schema:
        $ref: '#/components/schemas/Direction'
    activity:
      name: activity
      in: query
      description: Doar rândurile a căror categorie se află în aceste secțiuni ale situației fluxurilor de numerar. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Activity'
    bank_id:
      name: bank_id
      in: query
      description: Doar rândurile de pe conturile alimentate de aceste conexiuni bancare. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    account_id:
      name: account_id
      in: query
      description: Doar rândurile de pe aceste conturi. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    category_id:
      name: category_id
      in: query
      description: Doar rândurile din aceste categorii. Separate prin virgulă pentru mai multe. Pe `/transactions` se potrivește și cu o tranzacție împărțită ale cărei bucăți sunt în una dintre ele. Subcategoriile sunt incluse doar pe sinteze.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    label_id:
      name: label_id
      in: query
      description: Doar rândurile care poartă cel puțin una dintre aceste etichete. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    counterparty_id:
      name: counterparty_id
      in: query
      description: Doar rândurile atribuite acestor parteneri. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    transaction_expand:
      name: expand
      in: query
      description: Relații de întors ca obiecte în loc de identificatori. Separate prin virgulă. Extinderea merge un singur nivel; un nume necunoscut este respins cu `invalid_expand`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - account
            - category
            - counterparty
            - labels
      example: category,counterparty
    account_expand:
      name: expand
      in: query
      description: Relații de întors ca obiecte în loc de identificatori. Separate prin virgulă. Extinderea merge un singur nivel; un nume necunoscut este respins cu `invalid_expand`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - bank
      example: bank
    forecast_expand:
      name: expand
      in: query
      description: Relații de întors ca obiecte în loc de identificatori. Separate prin virgulă. Extinderea merge un singur nivel; un nume necunoscut este respins cu `invalid_expand`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - category
            - counterparty
            - labels
            - recurrence
            - linked_transactions
      example: category,linked_transactions
    as_of:
      name: as_of
      in: query
      description: 'Calculează soldurile la sfârșitul acestei zile. Implicit azi: ziua UTC pe `/accounts/{id}`, ziua locală a spațiului de lucru pe `/balances`. O dată din viitor este respinsă cu `as_of_in_future`.'
      schema:
        type: string
        format: date
    period:
      name: period
      in: query
      description: O fereastră cu nume, rezolvată față de ziua locală a spațiului de lucru și întoarsă în răspuns. Are prioritate față de `from` și `to`.
      schema:
        $ref: '#/components/schemas/PeriodMacro'
    interval:
      name: interval
      in: query
      description: Intervalul de timp în care sunt grupate rândurile.
      schema:
        $ref: '#/components/schemas/Interval'
    planning_interval:
      name: interval
      in: query
      description: Intervalul în care sunt grupate rândurile. `month` pentru fiecare lună calendaristică, `total` pentru întreaga fereastră ca un singur interval.
      schema:
        $ref: '#/components/schemas/PlanningInterval'
    window_from:
      name: from
      in: query
      description: Prima zi a ferestrei, inclusiv. Trimite-o împreună cu `to`. Omite `period`, `from` și `to` pentru fereastra implicită.
      schema:
        type: string
        format: date
    window_to:
      name: to
      in: query
      description: Ultima zi a ferestrei, inclusiv. Trimite-o împreună cu `from`. Omite `period`, `from` și `to` pentru fereastra implicită.
      schema:
        type: string
        format: date
    planning_category_id:
      name: category_id
      in: query
      description: Doar aceste categorii și categoriile imbricate sub ele. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    currency:
      name: currency
      in: query
      description: Moneda în care se raportează. Implicit moneda spațiului de lucru. Un cod necunoscut este respins.
      schema:
        $ref: '#/components/schemas/Currency'
    limit:
      name: limit
      in: query
      description: Dimensiunea paginii. În afara intervalului este respinsă cu `limit_out_of_range`.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    cursor:
      name: cursor
      in: query
      description: Token opac din `next_cursor` al paginii anterioare. Păstrează ceilalți parametri neschimbați între pagini.
      schema:
        type: string
  responses:
    BadRequest:
      description: Un parametru este invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request
              code: invalid_parameter
              message: direction must be 'inflow' or 'outflow'
              param: direction
              request_id: 0HNF8K3QJL2VM:00000001
    Unauthorized:
      description: Cheia API lipsește, este malformată, necunoscută sau revocată.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: authentication
              code: unauthorized
              message: Missing, malformed, unknown or revoked API key
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
    Forbidden:
      description: Cheia este validă, dar planul ThinkOut al companiei nu include API-ul.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: authentication
              code: forbidden
              message: The API is not included in this company's ThinkOut plan. Contact support@thinkout.io to enable it.
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
    NotFound:
      description: Nu există niciun obiect cu acest id în spațiul de lucru al cheii.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: not_found
              code: resource_not_found
              message: Transaction not found
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
    RequestTooLarge:
      description: Raportul ar depăși 1000 de rânduri. `period_too_long` apare doar din fereastră și interval, `too_many_groups` după grupare. Restrânge fereastra, folosește un interval mai mare sau adaugă filtre.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request
              code: too_many_groups
              message: Grouping by counterparty over this period produces 1240 groups. The maximum is 1000. Narrow the period or the filters.
              param: group_by
              request_id: 0HNF8K3QJL2VM:00000001
    RateLimited:
      description: Peste 120 de cereri în minutul curent pentru această cheie. Așteaptă secundele din `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Secunde până se resetează fereastra de un minut.
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Cereri permise pe minut.
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Cereri rămase în minutul curent.
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Secunde până se resetează fereastra de un minut.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: rate_limit
              code: rate_limited
              message: Too many requests
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
  schemas:
    Money:
      type: string
      description: Sumă zecimală ca șir de caractere, cu două decimale. Negativ înseamnă ieșire la tranzacții, previziuni și cifre din rapoarte.
      pattern: ^-?[0-9]+\.[0-9]{2}$
      example: '-1250.00'
    Currency:
      type: string
      description: Cod de monedă alfabetic ISO 4217.
      pattern: ^[A-Z]{3}$
      example: RON
    Direction:
      type: string
      description: Dacă banii intră sau ies. Pe o tranzacție sau o previziune urmează semnul lui `amount`.
      enum:
        - inflow
        - outflow
    Activity:
      type: string
      description: Secțiunea din situația fluxurilor de numerar căreia îi aparține categoria.
      enum:
        - operating
        - investing
        - financing
    TransactionStatus:
      type: string
      description: Tranzacțiile `pending` vin de la bancă și nu sunt încă înregistrate. Suma lor se poate schimba la înregistrare, deci actualizează după `id`.
      enum:
        - booked
        - pending
    TransactionSource:
      type: string
      description: Cum a intrat tranzacția în ThinkOut.
      enum:
        - manual
        - import
        - bank
    AccountSource:
      type: string
      description: Conturile `delegated` sunt conturi bancare pe care alt spațiu de lucru le-a delegat către acesta.
      enum:
        - manual
        - bank
        - delegated
    ForecastStatus:
      type: string
      description: '`realised` este completă. `partial` are tranzacții asociate. `overdue` are data înainte de azi și niciuna. `planned` are data azi sau mai târziu și niciuna.'
      enum:
        - planned
        - overdue
        - partial
        - realised
    RecurrenceInterval:
      type: string
      enum:
        - day
        - week
        - month
        - year
    Interval:
      type: string
      description: Intervalul de timp pentru rândurile unui raport.
      enum:
        - day
        - week
        - month
      default: month
    PlanningInterval:
      type: string
      description: Intervalul de timp pentru rândurile de buget și de scenariu, care sunt lunare. `total` raportează întreaga fereastră ca un singur interval, ca coloana Total de pe ecranul de bugete.
      enum:
        - month
        - total
      default: month
    ScenarioType:
      type: string
      description: '`dynamic` este cash flow-ul, realizat și încă așteptat, cu modificările scenariului peste el, și se mișcă odată cu datele. `snapshot` este o copie a cash flow-ului făcută la crearea scenariului, apoi modificată. `blank` conține doar sumele introduse în el, pornind de la soldul lui inițial.'
      enum:
        - dynamic
        - snapshot
        - blank
    PeriodMacro:
      type: string
      description: O fereastră cu nume, rezolvată pe server. `last_30_days` și `last_90_days` se termină azi și includ ziua de azi; `last_12_months` începe în ziua de după azi minus douăsprezece luni. `next_month`, `next_quarter` și `next_year` acoperă întreaga lună, întregul trimestru sau întregul an calendaristic următor.
      enum:
        - this_month
        - last_month
        - this_quarter
        - last_quarter
        - this_year
        - last_year
        - month_to_date
        - quarter_to_date
        - year_to_date
        - last_30_days
        - last_90_days
        - last_12_months
        - next_month
        - next_quarter
        - next_year
    GroupDimension:
      type: string
      description: O dimensiune după care se grupează rândurile raportului, pe lângă intervalul de timp.
      enum:
        - category
        - counterparty
        - label
        - account
        - activity
        - direction
    ForecastGroupDimension:
      type: string
      description: La fel ca `GroupDimension`, plus statusul previziunii. Previziunile nu au cont.
      enum:
        - category
        - counterparty
        - label
        - activity
        - direction
        - status
    CashFlowGroupDimension:
      type: string
      description: O dimensiune după care se grupează rândurile de cash flow, pe lângă intervalul de timp. Nu există `account`, pentru că previziunile nu au cont.
      enum:
        - category
        - counterparty
        - label
        - activity
        - direction
    List:
      type: object
      required:
        - object
        - data
        - has_more
        - next_cursor
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items: {}
        has_more:
          type: boolean
          description: Dacă mai există o pagină.
        next_cursor:
          type:
            - string
            - 'null'
          description: Trimite-l ca `cursor` pentru pagina următoare. `null` pe ultima pagină.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - code
            - message
            - param
            - request_id
          properties:
            type:
              type: string
              enum:
                - invalid_request
                - authentication
                - not_found
                - rate_limit
                - server
            code:
              type: string
              description: Motiv stabil, citibil de o mașină. Ramifică pe acesta, nu pe `message`. Unul dintre `invalid_parameter`, `invalid_cursor`, `limit_out_of_range`, `invalid_expand`, `as_of_in_future`, `unauthorized`, `forbidden`, `resource_not_found`, `too_many_groups`, `period_too_long`, `rate_limited`, `internal_error`.
            message:
              type: string
              description: Explicație pentru oameni, în engleză. Formularea se poate schimba.
            param:
              type:
                - string
                - 'null'
              description: Parametrul de query vinovat, când există unul.
            request_id:
              type: string
              description: Menționează-l când contactezi suportul.
    ResolvedPeriod:
      type: object
      description: Fereastra efectiv calculată.
      required:
        - from
        - to
        - macro
        - interval
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        macro:
          oneOf:
            - $ref: '#/components/schemas/PeriodMacro'
            - type: 'null'
          description: Macrocomanda care a produs aceste date, sau `null` când au fost trimise direct.
        interval:
          $ref: '#/components/schemas/Interval'
    ResolvedPlanningPeriod:
      type: object
      description: Fereastra efectiv calculată, extinsă la luni întregi.
      required:
        - from
        - to
        - macro
        - interval
      properties:
        from:
          type: string
          format: date
          description: Prima zi a primei luni.
        to:
          type: string
          format: date
          description: Ultima zi a ultimei luni.
        macro:
          oneOf:
            - $ref: '#/components/schemas/PeriodMacro'
            - type: 'null'
          description: Macrocomanda care a produs fereastra, sau `null` când datele au fost trimise direct sau s-a aplicat fereastra implicită a endpoint-ului.
        interval:
          $ref: '#/components/schemas/PlanningInterval'
    Conversion:
      type: object
      description: Ce s-a făcut pentru ca sumele să fie comparabile.
      required:
        - applied
        - currency
        - basis
      properties:
        applied:
          type: boolean
          description: '`false` când toate sumele erau deja în `currency`.'
        currency:
          $ref: '#/components/schemas/Currency'
        basis:
          type: string
          description: '`transaction_date` convertește fiecare mișcare la cursul din data ei. `balance_date` convertește un sold întreg la un singur curs. `own_date` convertește fiecare buget la cursul din prima zi a lunii lui, iar fiecare tranzacție și previziune la cursul din data ei. `none` când nu s-a convertit nimic.'
          enum:
            - transaction_date
            - balance_date
            - own_date
            - none
    ReportGroup:
      type: object
      description: După ce este grupat un rând de raport. `null` la rândurile grupate doar pe interval.
      required:
        - dimension
        - id
        - label
      properties:
        dimension:
          type: string
          example: category
        id:
          type:
            - string
            - 'null'
          format: uuid
          description: Identificatorul obiectului grupat, al activității pentru `activity`. `null` pentru `direction` și `status`, și pentru rândurile `none` și `other`.
        label:
          type: string
          description: 'Numele grupului. Grupurile care nu sunt obiecte sunt coduri cu litere mici pe fiecare sinteză: `inflow` sau `outflow`, un cod de activitate precum `operating`, o stare de previziune precum `planned`, și `none` sau `other`.'
          example: Telecom
    SummaryTotals:
      type: object
      description: Întreaga fereastră însumată, după aceleași excluderi ca rândurile.
      required:
        - currency
        - inflow
        - outflow
        - net
        - count
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        inflow:
          $ref: '#/components/schemas/Money'
        outflow:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        count:
          type: integer
    SummaryRow:
      type: object
      required:
        - period_start
        - period_end
        - group
        - currency
        - inflow
        - outflow
        - net
        - count
        - starting_balance
        - transfers
        - excluded
        - final_balance
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        group:
          oneOf:
            - $ref: '#/components/schemas/ReportGroup'
            - type: 'null'
        currency:
          $ref: '#/components/schemas/Currency'
        inflow:
          $ref: '#/components/schemas/Money'
        outflow:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        count:
          type: integer
          description: Tranzacțiile din spatele acestui rând, după excluderile raportului.
        starting_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul conturilor din perimetru la începutul intervalului. `null` când este trimis `group_by` sau `direction`.
        transfers:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul transferurilor între conturile proprii ale spațiului de lucru în interval. Nu face parte din fluxuri. `null` când este trimis `group_by` sau `direction`.
        excluded:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul mișcărilor excluse de utilizator din cash flow în interval. Nu face parte din fluxuri. `null` când este trimis `group_by` sau `direction`.
        final_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul la sfârșitul intervalului. Soldul de început plus `net`, `transfers`, `excluded` și soldurile inițiale ale conturilor deschise în interval. `null` când este trimis `group_by` sau `direction`.
    Summary:
      type: object
      required:
        - object
        - period
        - conversion
        - group_by
        - has_data
        - totals
        - data
      properties:
        object:
          type: string
