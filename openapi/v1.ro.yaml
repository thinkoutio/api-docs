        transfers:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul transferurilor între conturile proprii ale spațiului de lucru în interval. Afișat alături de soldul final, fără să facă parte din el. `null` acolo unde tabul nu are această linie și cu `category_id`.
        excluded:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul mișcărilor excluse din cash flow în interval. Afișat alături de soldul final, fără să facă parte din el. `null` acolo unde tabul nu are această linie și cu `category_id`.
        final_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul scenariului la sfârșitul intervalului, cum îl arată tabul lui, adică soldul de la începutul intervalului plus `net`. `null` cu `category_id`.
    ScenarioCategoryRow:
