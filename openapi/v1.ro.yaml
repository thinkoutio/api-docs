      operationId: unpairTransfers
      summary: Desface transferurile
      description: 'Desface până la 100 de transferuri. Trimite câte o tranzacție din fiecare transfer: un transfer împerecheat își pierde ambele părți, un transfer marcat își pierde marcajul. O tranzacție care nu face parte dintr-un transfer este omisă cu motivul `not_transfer`.'
