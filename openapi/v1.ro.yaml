      summary: Sintetizează scenariile
      description: |-
        Tabul Toate de pe ecranul de scenarii: pe lună, soldul final al cash flow-ului alături de cel al fiecărui scenariu. Trimite `period`, sau atât `from`, cât și `to`, sau niciunul pentru fereastra tabului, luna aceasta și cele douăsprezece de după ea.

        Fereastra se extinde la luni întregi. `cash_flow_final_balance` este soldul final al cash flow-ului, cum îl arată ecranul de cash flow, proiectat pentru lunile care se termină după azi. `final_balance` al unui scenariu este soldul lui de început plus rezultatul net, cum îl arată tabul scenariului, și este `null` în lunile din afara scenariului. Soldul final al cash flow-ului include și conturile deschise, transferurile și mișcările excluse, așa că soldul final al unui scenariu poate diferi de el chiar și în lunile pe care scenariul nu le schimbă.

        Cu `interval=total` există un singur rând, cu soldurile de la sfârșitul ferestrei. Sumele sunt în moneda spațiului de lucru și nu se convertesc niciodată.

        **Cash flow-ul și fiecare scenariu, lună de lună, pentru anul următor**

