        href: /ro/api-reference/rapoarte/sintetizeaza-previziunile
  /cash-flow/summary:
    get:
      tags:
        - Rapoarte
      operationId: summariseCashFlow
      summary: Sintetizează cash flow-ul
      description: |-
        Ce arată ecranul de cash flow, descompus, pe interval de timp și cel mult încă o dimensiune. Trimite `period`, sau atât `from`, cât și `to`.

        Fiecare interval are o parte realizată și o parte previzionată. Partea realizată o formează tranzacțiile datate în interval, numărate cum le numără `/transactions/summary`: transferurile între conturile proprii ale spațiului de lucru și mișcările excluse sunt lăsate deoparte, iar tranzacțiile împărțite se numără prin bucățile lor. Partea previzionată este suma rămasă a previziunilor nerealizate datate în interval. O previziune acoperită parțial se numără doar cu ce mai este așteptat, iar tranzacțiile asociate ei se numără ca realizate. `inflow`, `outflow` și `net` adună cele două părți și coincid cu ecranul.

        Previziunile datate înainte de azi și încă nerealizate sunt restante. Ele sunt lăsate în afara rândurilor, dacă nu este trimis `include_overdue=true`. `totals.overdue_inflow` și `totals.overdue_outflow` raportează mereu suma rămasă a previziunilor restante pe care rândurile nu le-au numărat.

        Sumele se convertesc în `currency` la cursul din data fiecărei mișcări. Intervalele sunt aliniate la calendar și tăiate la fereastra cerută. `totals` acoperă întreaga fereastră.

        Rândurile grupate doar pe interval poartă și soldul de început, conturile deschise, transferurile, mișcările excluse și soldul de final ale intervalului. Soldul de final al unui interval viitor este soldul proiectat. Cele cinci sunt `null` când este trimis `group_by` sau `direction`.

        Un filtru `bank_id` sau `account_id` restrânge partea realizată și soldurile, niciodată previziunile, care nu au cont și acoperă mereu întregul spațiu de lucru. Un `bank_id` care nu se potrivește cu niciun cont întoarce rezultatul gol: niciun rând și totaluri zero. `group_by=account` este respins cu 400 din același motiv.

        Rândurile grupate sunt ordonate după `net` în valoare absolută, cel mai mare primul. Un interval păstrează cel mult 50 de grupuri; restul se strâng într-un singur rând etichetat `other`. Tranzacțiile și previziunile fără partener sau fără etichetă ajung într-un rând `none`, iar una cu mai multe etichete se numără o dată pentru fiecare etichetă. Aici `category_id` acoperă și subcategoriile.

        Filtrele se combină cu AND; un filtru care acceptă o listă își combină valorile cu OR.

        **Cash flow pe luni pentru trimestrul următor**

        ```http
        GET /cash-flow/summary?period=next_quarter&interval=month
        ```

        **Încasări așteptate pe partener luna viitoare**

        ```http
        GET /cash-flow/summary?period=next_month&group_by=counterparty&direction=inflow
        ```
      parameters:
        - $ref: '#/components/parameters/period'
        - name: from
          in: query
          description: Prima zi a ferestrei, inclusiv. Obligatoriu împreună cu `to`, dacă nu este trimis `period`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Ultima zi a ferestrei, inclusiv. Obligatoriu împreună cu `from`, dacă nu este trimis `period`.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/interval'
        - name: group_by
          in: query
          description: O a doua dimensiune de grupare, pe lângă intervalul de timp. Omite-o pentru un singur rând per interval.
          schema:
            $ref: '#/components/schemas/CashFlowGroupDimension'
        - $ref: '#/components/parameters/currency'
        - $ref: '#/components/parameters/bank_id'
        - $ref: '#/components/parameters/account_id'
        - $ref: '#/components/parameters/category_id'
        - $ref: '#/components/parameters/label_id'
        - $ref: '#/components/parameters/counterparty_id'
        - $ref: '#/components/parameters/direction'
        - $ref: '#/components/parameters/activity'
        - name: include_overdue
          in: query
          description: Dacă previziunile restante, cele datate înainte de azi și încă nerealizate, se numără în rândurile intervalelor în care cad. Dezactivat, ele apar doar în `totals.overdue_inflow` și `totals.overdue_outflow`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Sinteza.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/rapoarte/sintetizeaza-cash-flow-ul
