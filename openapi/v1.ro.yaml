  /balances:
    get:
      tags:
        - Rapoarte
      operationId: getBalances
      summary: Citește soldurile
      description: |-
        Soldul fiecărui cont și totalul spațiului de lucru, într-un singur apel.

        Soldurile sunt doar istorice. Un sold este soldul inițial al contului plus sumele cu semn ale tranzacțiilor sale până la sfârșitul zilei `as_of`, așa că o dată `as_of` din viitor este respinsă, în loc să primești cifra de azi purtând o dată viitoare. Pentru o poziție în viitor, calculează un raport de cash flow de tip `balances`, care proiectează mișcările planificate și le raportează separat de cele reale.

        Conversia diferă aici față de sinteze, în mod deliberat. Un cont ține o singură monedă, deci soldul lui se convertește integral la un singur curs pentru `as_of`, răspunzând la întrebarea cât valorează poziția atunci. O sinteză de tranzacții convertește fiecare mișcare la data ei, răspunzând la întrebarea cât a costat fiecare la momentul respectiv.
      parameters:
        - $ref: '#/components/parameters/as_of'
        - $ref: '#/components/parameters/currency'
      responses:
        '200':
          description: Soldurile pe fiecare cont și totalul.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balances'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
