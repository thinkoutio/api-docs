                        count: 2
                        starting_balance: null
                        transfers: null
                        excluded: null
                        final_balance: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/rapoarte/sintetizeaza-tranzactiile
  /forecasts/summary:
    get:
      tags:
        - Rapoarte
      operationId: summariseForecasts
      summary: Sintetizează previziunile
      description: |-
        Totaluri peste previziunile cu dată, pe interval de timp și cel mult încă o dimensiune. Trimite `period`, sau atât `from`, cât și `to`.

        `amount` însumează ce a fost planificat, iar `remaining_amount` partea neacoperită încă de tranzacții. Sumele se convertesc în `currency` la cursul din data fiecărei previziuni. Intervalele sunt aliniate la calendar și tăiate la fereastra cerută.

        Rândurile grupate sunt ordonate după `amount` în valoare absolută, cel mai mare primul, fără plafon per interval. Previziunile fără partener sau fără etichetă ajung într-un rând `None`, iar o previziune cu mai multe etichete se numără o dată pentru fiecare etichetă.
      parameters:
        - $ref: '#/components/parameters/period'
        - name: from
          in: query
          description: Prima zi a ferestrei, inclusiv. Obligatoriu împreună cu `to`, dacă nu este trimis `period`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Ultima zi a ferestrei, inclusiv. Obligatoriu împreună cu `from`, dacă nu este trimis `period`.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/interval'
        - name: group_by
          in: query
          description: O a doua dimensiune de grupare, pe lângă intervalul de timp. Omite-o pentru un singur rând per interval.
          schema:
            $ref: '#/components/schemas/ForecastGroupDimension'
        - $ref: '#/components/parameters/currency'
        - $ref: '#/components/parameters/category_id'
        - $ref: '#/components/parameters/label_id'
        - $ref: '#/components/parameters/counterparty_id'
        - $ref: '#/components/parameters/direction'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ForecastStatus'
      responses:
        '200':
          description: Sinteza.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/rapoarte/sintetizeaza-previziunile
  /balances:
    get:
      tags:
        - Rapoarte
      operationId: getBalances
      summary: Citește soldurile
      description: |-
        Soldul fiecărui cont și totalul lor la sfârșitul zilei `as_of`, conturile ordonate după `name`.

        Un sold este soldul inițial plus tranzacțiile contului până în ziua aceea, așa că `as_of` nu poate fi în viitor. Fiecare sold se convertește integral la cursul din `as_of`, spre deosebire de o sinteză, care convertește fiecare mișcare la data ei.
      parameters:
        - $ref: '#/components/parameters/as_of'
        - $ref: '#/components/parameters/currency'
      responses:
        '200':
          description: Soldurile pe fiecare cont și totalul.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balances'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /ro/api-reference/rapoarte/citeste-soldurile
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: O cheie API creată în setările ThinkOut. O cheie citește un singur spațiu de lucru.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    from:
      name: from
      in: query
      description: Cea mai veche `date` inclusă, inclusiv.
      schema:
        type: string
        format: date
    to:
      name: to
      in: query
      description: Cea mai recentă `date` inclusă, inclusiv.
      schema:
        type: string
        format: date
    direction:
      name: direction
      in: query
      schema:
        $ref: '#/components/schemas/Direction'
    activity:
      name: activity
      in: query
      description: Doar rândurile a căror categorie se află în aceste secțiuni ale situației fluxurilor de numerar. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Activity'
    bank_id:
      name: bank_id
      in: query
      description: Doar rândurile de pe conturile alimentate de aceste conexiuni bancare. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    account_id:
      name: account_id
      in: query
      description: Doar rândurile de pe aceste conturi. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    category_id:
      name: category_id
      in: query
      description: Doar rândurile din aceste categorii. Separate prin virgulă pentru mai multe. Pe `/transactions` se potrivește și cu o tranzacție împărțită ale cărei bucăți sunt în una dintre ele. Subcategoriile sunt incluse doar pe `/transactions/summary`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    label_id:
      name: label_id
      in: query
      description: Doar rândurile care poartă cel puțin una dintre aceste etichete. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    counterparty_id:
      name: counterparty_id
      in: query
      description: Doar rândurile atribuite acestor parteneri. Separate prin virgulă pentru mai multe.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    transaction_expand:
      name: expand
      in: query
      description: Relații de întors ca obiecte în loc de identificatori. Separate prin virgulă. Extinderea merge un singur nivel; un nume necunoscut este respins cu `invalid_expand`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - account
            - category
            - counterparty
            - labels
      example: category,counterparty
    account_expand:
      name: expand
      in: query
      description: Relații de întors ca obiecte în loc de identificatori. Separate prin virgulă. Extinderea merge un singur nivel; un nume necunoscut este respins cu `invalid_expand`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - bank
      example: bank
    forecast_expand:
      name: expand
      in: query
      description: Relații de întors ca obiecte în loc de identificatori. Separate prin virgulă. Extinderea merge un singur nivel; un nume necunoscut este respins cu `invalid_expand`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - category
            - counterparty
            - labels
            - linked_transactions
      example: category,linked_transactions
    as_of:
      name: as_of
      in: query
      description: 'Calculează soldurile la sfârșitul acestei zile. Implicit azi: ziua UTC pe `/accounts/{id}`, ziua locală a spațiului de lucru pe `/balances`. O dată din viitor este respinsă cu `as_of_in_future`.'
      schema:
        type: string
        format: date
    period:
      name: period
      in: query
      description: O fereastră cu nume, rezolvată față de ziua locală a spațiului de lucru și întoarsă în răspuns. Are prioritate față de `from` și `to`.
      schema:
        $ref: '#/components/schemas/PeriodMacro'
    interval:
      name: interval
      in: query
      description: Intervalul de timp în care sunt grupate rândurile.
      schema:
        $ref: '#/components/schemas/Interval'
    currency:
      name: currency
      in: query
      description: Moneda în care se raportează. Implicit moneda spațiului de lucru. Un cod necunoscut este respins.
      schema:
        $ref: '#/components/schemas/Currency'
    limit:
      name: limit
      in: query
      description: Dimensiunea paginii. În afara intervalului este respinsă cu `limit_out_of_range`.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    cursor:
      name: cursor
      in: query
      description: Token opac din `next_cursor` al paginii anterioare. Păstrează ceilalți parametri neschimbați între pagini.
      schema:
        type: string
  responses:
    BadRequest:
      description: Un parametru este invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request
              code: invalid_parameter
              message: direction must be 'inflow' or 'outflow'
              param: direction
              request_id: 0HNF8K3QJL2VM:00000001
    Unauthorized:
      description: Cheia API lipsește, este malformată, necunoscută sau revocată.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: authentication
              code: unauthorized
              message: Missing, malformed, unknown or revoked API key
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
    Forbidden:
      description: Cheia este validă, dar planul ThinkOut al companiei nu include API-ul.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: authentication
              code: forbidden
              message: The API is not included in this company's ThinkOut plan. Contact support@thinkout.io to enable it.
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
    NotFound:
      description: Nu există niciun obiect cu acest id în spațiul de lucru al cheii.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: not_found
              code: resource_not_found
              message: Transaction not found
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
    RequestTooLarge:
      description: Raportul ar depăși 1000 de rânduri. `period_too_long` apare doar din fereastră și interval, `too_many_groups` după grupare. Restrânge fereastra, folosește un interval mai mare sau adaugă filtre.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request
              code: too_many_groups
              message: Grouping by counterparty over this period produces 1240 groups. The maximum is 1000. Narrow the period or the filters.
              param: group_by
              request_id: 0HNF8K3QJL2VM:00000001
    RateLimited:
      description: Peste 120 de cereri în minutul curent pentru această cheie. Așteaptă secundele din `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Secunde până se resetează fereastra de un minut.
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Cereri permise pe minut.
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Cereri rămase în minutul curent.
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Secunde până se resetează fereastra de un minut.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: rate_limit
              code: rate_limited
              message: Too many requests
              param: null
              request_id: 0HNF8K3QJL2VM:00000001
  schemas:
    Money:
      type: string
      description: Sumă zecimală ca șir de caractere, cu două decimale. Negativ înseamnă ieșire la tranzacții, previziuni și cifre din rapoarte.
      pattern: ^-?[0-9]+\.[0-9]{2}$
      example: '-1250.00'
    Currency:
      type: string
      description: Cod de monedă alfabetic ISO 4217.
      pattern: ^[A-Z]{3}$
      example: RON
    Direction:
      type: string
      description: Dacă banii intră sau ies. Pe o tranzacție sau o previziune urmează semnul lui `amount`.
      enum:
        - inflow
        - outflow
    Activity:
      type: string
      description: Secțiunea din situația fluxurilor de numerar căreia îi aparține categoria.
      enum:
        - operating
        - investing
        - financing
    TransactionStatus:
      type: string
      description: Tranzacțiile `pending` vin de la bancă și nu sunt încă înregistrate. Suma lor se poate schimba la înregistrare, deci actualizează după `id`.
      enum:
        - booked
        - pending
    TransactionSource:
      type: string
      description: Cum a intrat tranzacția în ThinkOut.
      enum:
        - manual
        - import
        - bank
    AccountSource:
      type: string
      description: Conturile `delegated` sunt conturi bancare pe care alt spațiu de lucru le-a delegat către acesta.
      enum:
        - manual
        - bank
        - delegated
    ForecastStatus:
      type: string
      description: '`realised` este completă. `partial` are tranzacții asociate. `overdue` are data înainte de azi și niciuna. `planned` are data azi sau mai târziu și niciuna.'
      enum:
        - planned
        - overdue
        - partial
        - realised
    RecurrenceInterval:
      type: string
      enum:
        - day
        - week
        - month
        - year
    Interval:
      type: string
      description: Intervalul de timp pentru rândurile unui raport.
      enum:
        - day
        - week
        - month
      default: month
    PeriodMacro:
      type: string
      description: O fereastră cu nume, rezolvată pe server. `last_30_days` și `last_90_days` se termină azi și includ ziua de azi; `last_12_months` începe în ziua de după azi minus douăsprezece luni.
      enum:
        - this_month
        - last_month
        - this_quarter
        - last_quarter
        - this_year
        - last_year
        - month_to_date
        - quarter_to_date
        - year_to_date
        - last_30_days
        - last_90_days
        - last_12_months
    GroupDimension:
      type: string
      description: O dimensiune după care se grupează rândurile raportului, pe lângă intervalul de timp.
      enum:
        - category
        - counterparty
        - label
        - account
        - activity
        - direction
    ForecastGroupDimension:
      type: string
      description: La fel ca `GroupDimension`, plus statusul previziunii. Previziunile nu au cont.
      enum:
        - category
        - counterparty
        - label
        - activity
        - direction
        - status
    List:
      type: object
      required:
        - object
        - data
        - has_more
        - next_cursor
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items: {}
        has_more:
          type: boolean
          description: Dacă mai există o pagină.
        next_cursor:
          type:
            - string
            - 'null'
          description: Trimite-l ca `cursor` pentru pagina următoare. `null` pe ultima pagină.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - code
            - message
            - param
            - request_id
          properties:
            type:
              type: string
              enum:
                - invalid_request
                - authentication
                - not_found
                - rate_limit
                - server
            code:
              type: string
              description: Motiv stabil, citibil de o mașină. Ramifică pe acesta, nu pe `message`. Unul dintre `invalid_parameter`, `invalid_cursor`, `limit_out_of_range`, `invalid_expand`, `as_of_in_future`, `unauthorized`, `forbidden`, `resource_not_found`, `too_many_groups`, `period_too_long`, `rate_limited`, `internal_error`.
            message:
              type: string
              description: Explicație pentru oameni, în engleză. Formularea se poate schimba.
            param:
              type:
                - string
                - 'null'
              description: Parametrul de query vinovat, când există unul.
            request_id:
              type: string
              description: Menționează-l când contactezi suportul.
    ResolvedPeriod:
      type: object
      description: Fereastra efectiv calculată.
      required:
        - from
        - to
        - macro
        - interval
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        macro:
          oneOf:
            - $ref: '#/components/schemas/PeriodMacro'
            - type: 'null'
          description: Macrocomanda care a produs aceste date, sau `null` când au fost trimise direct.
        interval:
          $ref: '#/components/schemas/Interval'
    Conversion:
      type: object
      description: Ce s-a făcut pentru ca sumele să fie comparabile.
      required:
        - applied
        - currency
        - basis
      properties:
        applied:
          type: boolean
          description: '`false` când toate sumele erau deja în `currency`.'
        currency:
          $ref: '#/components/schemas/Currency'
        basis:
          type: string
          description: '`transaction_date` convertește fiecare mișcare la cursul din data ei. `balance_date` convertește un sold întreg la un singur curs. `none` când nu s-a convertit nimic.'
          enum:
            - transaction_date
            - balance_date
            - none
    ReportGroup:
      type: object
      description: După ce este grupat un rând de raport. `null` la rândurile grupate doar pe interval.
      required:
        - dimension
        - id
        - label
      properties:
        dimension:
          type: string
          example: category
        id:
          type:
            - string
            - 'null'
          format: uuid
          description: Identificatorul obiectului grupat. `null` pentru `activity`, `direction` și `status`, și pentru rândurile `none` și `other`.
        label:
          type: string
          description: Numele grupului. Grupurile care nu sunt obiecte sunt coduri cu litere mici pe `/transactions/summary` (`inflow`, `operating`, `none`, `other`) și nume cu majusculă pe `/forecasts/summary` (`Inflow`, `Planned`, `None`, numele afișat al activității).
          example: Telecom
    SummaryTotals:
      type: object
      description: Întreaga fereastră însumată, după aceleași excluderi ca rândurile.
      required:
        - currency
        - inflow
        - outflow
        - net
        - count
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        inflow:
          $ref: '#/components/schemas/Money'
        outflow:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        count:
          type: integer
    SummaryRow:
      type: object
      required:
        - period_start
        - period_end
        - group
        - currency
        - inflow
        - outflow
        - net
        - count
        - starting_balance
        - transfers
        - excluded
        - final_balance
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        group:
          oneOf:
            - $ref: '#/components/schemas/ReportGroup'
            - type: 'null'
        currency:
          $ref: '#/components/schemas/Currency'
        inflow:
          $ref: '#/components/schemas/Money'
        outflow:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        count:
          type: integer
          description: Tranzacțiile din spatele acestui rând, după excluderile raportului.
        starting_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul conturilor din perimetru la începutul intervalului. `null` când este trimis `group_by` sau `direction`.
        transfers:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul transferurilor între conturile proprii ale spațiului de lucru în interval. Nu face parte din fluxuri. `null` când este trimis `group_by` sau `direction`.
        excluded:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Netul mișcărilor excluse de utilizator din cash flow în interval. Nu face parte din fluxuri. `null` când este trimis `group_by` sau `direction`.
        final_balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Soldul la sfârșitul intervalului. Soldul de început plus `net`, `transfers`, `excluded` și soldurile inițiale ale conturilor deschise în interval. `null` când este trimis `group_by` sau `direction`.
    Summary:
      type: object
      required:
        - object
        - period
        - conversion
        - group_by
        - has_data
        - totals
        - data
      properties:
        object:
          type: string
          const: summary
        period:
          $ref: '#/components/schemas/ResolvedPeriod'
        conversion:
          $ref: '#/components/schemas/Conversion'
        group_by:
          oneOf:
            - $ref: '#/components/schemas/GroupDimension'
            - type: 'null'
        has_data:
          type: boolean
          description: '`false` când nicio tranzacție nu s-a potrivit, spre deosebire de totalurile care au ieșit zero.'
        totals:
          $ref: '#/components/schemas/SummaryTotals'
        data:
          type: array
          items:
            $ref: '#/components/schemas/SummaryRow'
    ForecastSummaryRow:
      type: object
      required:
        - period_start
        - period_end
        - group
        - currency
        - amount
        - remaining_amount
        - count
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        group:
          oneOf:
            - $ref: '#/components/schemas/ReportGroup'
            - type: 'null'
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          $ref: '#/components/schemas/Money'
          description: Total planificat.
        remaining_amount:
          $ref: '#/components/schemas/Money'
          description: Total neacoperit încă de tranzacții.
        count:
          type: integer
    ForecastSummary:
      type: object
      required:
        - object
        - period
        - conversion
        - group_by
        - has_data
        - data
      properties:
        object:
          type: string
          const: forecast_summary
        period:
          $ref: '#/components/schemas/ResolvedPeriod'
        conversion:
          $ref: '#/components/schemas/Conversion'
        group_by:
          oneOf:
            - $ref: '#/components/schemas/ForecastGroupDimension'
            - type: 'null'
        has_data:
          type: boolean
          description: '`false` când nicio previziune nu s-a potrivit.'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ForecastSummaryRow'
    AccountBalance:
      type: object
      required:
        - account_id
        - name
        - native_currency
        - native_balance
        - balance
      properties:
        account_id:
          type: string
          format: uuid
        name:
          type: string
          example: ING Curent
        native_currency:
          $ref: '#/components/schemas/Currency'
        native_balance:
          $ref: '#/components/schemas/Money'
          description: Soldul în moneda proprie a contului, neconvertit.
        balance:
          $ref: '#/components/schemas/Money'
          description: Același sold în moneda cerută.
    Balances:
      type: object
      required:
        - object
        - as_of
        - conversion
        - total
        - accounts
      properties:
        object:
          type: string
          const: balances
        as_of:
          type: string
          format: date
          description: Ziua a cărei poziție la sfârșit de zi este raportată.
        conversion:
          $ref: '#/components/schemas/Conversion'
        total:
          $ref: '#/components/schemas/Money'
          description: Toate conturile adunate, în moneda cerută.
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountBalance'
    BankDetails:
      type: object
      description: Câmpuri brute primite de la bancă.
      required:
        - payer
        - payer_details
        - payee
        - payee_details
        - reference
        - additional
      properties:
        payer:
          type:
            - string
            - 'null'
        payer_details:
          type:
            - string
            - 'null'
          description: Identificatorii contului plătitorului, așa cum sunt furnizați de bancă.
        payee:
          type:
            - string
            - 'null'
        payee_details:
          type:
            - string
            - 'null'
        reference:
          type:
            - string
            - 'null'
          description: Referința plății sau linia de informații.
        additional:
          type:
            - string
            - 'null'
    ExpandableCategory:
      description: Identificatorul unei categorii, sau categoria completă când este numită în `expand`.
      oneOf:
        - type: string
          format: uuid
        - $ref: '#/components/schemas/Category'
    ExpandableCounterparty:
      description: Identificatorul unui partener, partenerul complet când este numit în `expand`, sau `null` când nu există atribuire.
      oneOf:
        - type: string
          format: uuid
        - $ref: '#/components/schemas/Counterparty'
        - type: 'null'
    ExpandableAccount:
      description: Identificatorul unui cont, sau contul complet când este numit în `expand`.
      oneOf:
        - type: string
          format: uuid
        - $ref: '#/components/schemas/Account'
    ExpandableLabels:
      description: Identificatori de etichete, sau etichetele complete când `labels` este numit în `expand`.
      type: array
      items:
        oneOf:
          - type: string
            format: uuid
          - $ref: '#/components/schemas/Label'
    Transaction:
      type: object
      required:
        - object
        - id
        - date
        - amount
        - currency
        - direction
        - status
        - source
        - description
        - comment
        - account
        - category
        - counterparty
        - labels
        - bank_details
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: transaction
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: Data înregistrării. Nu există componentă de timp.
          example: '2026-09-03'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        direction:
          $ref: '#/components/schemas/Direction'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        source:
          $ref: '#/components/schemas/TransactionSource'
        description:
          type:
            - string
            - 'null'
          example: ORANGE ROMANIA SA
        comment:
          type:
            - string
            - 'null'
          description: Text liber adăugat de utilizatori în ThinkOut.
        account:
          $ref: '#/components/schemas/ExpandableAccount'
        category:
          oneOf:
            - $ref: '#/components/schemas/ExpandableCategory'
            - type: 'null'
          description: '`null` pentru o tranzacție împărțită, a cărei categorisire stă pe bucățile ei.'
        counterparty:
          $ref: '#/components/schemas/ExpandableCounterparty'
        labels:
          $ref: '#/components/schemas/ExpandableLabels'
        bank_details:
          oneOf:
            - $ref: '#/components/schemas/BankDetails'
            - type: 'null'
          description: '`null` dacă `source` nu este `bank`.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        object: transaction
        id: 8f1c0a4e-2b1d-4c8e-9f3a-7d6e5c4b3a21
        date: '2026-09-03'
        amount: '-1250.00'
        currency: RON
        direction: outflow
        status: booked
        source: bank
        description: ORANGE ROMANIA SA
        comment: null
        account: c2d7e8f9-1a2b-4c3d-8e9f-0a1b2c3d4e5f
        category: 3b4c5d6e-7f80-4a1b-9c2d-3e4f5a6b7c8d
        counterparty: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        labels:
          - 1f2e3d4c-5b6a-4978-8877-665544332211
        bank_details:
          payer: THINKOUT SRL
          payer_details: RO49INGB0000999900000001
          payee: ORANGE ROMANIA SA
          payee_details: RO12BTRL0000000000000002
          reference: Factura 2026-08 nr 1234567
          additional: null
        created_at: '2026-09-03T08:12:44Z'
        updated_at: '2026-09-03T08:12:44Z'
    BankStatus:
      type: string
      description: '`connected` funcționează. `loading` este o sincronizare în curs. `requires_action` cere ca o persoană să se autentifice sau să reaprobe conexiunea în ThinkOut. `error` este orice altă eroare. Doar `connected` înseamnă că datele din spate sunt la zi.'
      enum:
        - connected
        - loading
        - requires_action
        - error
    Bank:
      type: object
      description: O autorizare cu o singură bancă. Mai multe conturi pot folosi aceeași conexiune, iar un spațiu de lucru poate avea mai multe conexiuni la aceeași bancă.
      required:
        - object
        - id
        - name
        - country_code
        - status
        - last_sync_at
        - consent_expires_at
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: bank
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Numele băncii, așa cum îl raportează furnizorul.
          example: ING Bank
        country_code:
          type:
            - string
            - 'null'
          description: Țara băncii, cod ISO 3166-1 alpha-2.
          pattern: ^[A-Z]{2}$
          example: RO
        status:
          $ref: '#/components/schemas/BankStatus'
        last_sync_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Când a întors furnizorul date cu succes ultima oară, sau `null`. O conexiune `connected` cu un `last_sync_at` vechi este cazul care merită o alertă.
        consent_expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Când trebuie reînnoit consimțământul bancar, dacă furnizorul îl raportează.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        object: bank
        id: 5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f
        name: ING Bank
        country_code: RO
        status: connected
        last_sync_at: '2026-09-03T06:00:00Z'
        consent_expires_at: '2026-11-30T00:00:00Z'
        created_at: '2024-01-01T10:00:00Z'
        updated_at: '2026-09-03T06:00:00Z'
    ExpandableBank:
      description: Identificatorul unei conexiuni bancare, conexiunea completă când este numită în `expand`, sau `null` pentru un cont manual. Pe un cont `delegated` conexiunea aparține altui spațiu de lucru, așa că identificatorul este întors, dar nu este nici extins, nici citibil.
      oneOf:
        - type: string
          format: uuid
        - $ref: '#/components/schemas/Bank'
        - type: 'null'
    Account:
      type: object
      required:
        - object
        - id
        - name
        - currency
        - group
        - source
        - balance
        - balance_as_of
        - opening_balance
        - opening_date
        - bank
        - external_account_id
        - original_name
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: account
        id:
          type: string
          format: uuid
        name:
          type: string
          example: ING Curent
        currency:
          $ref: '#/components/schemas/Currency'
        group:
          type:
            - string
            - 'null'
          description: Grupare cu text liber, atribuită în ThinkOut.
          example: Operational
        source:
          $ref: '#/components/schemas/AccountSource'
        balance:
          $ref: '#/components/schemas/Money'
        balance_as_of:
          type: string
          format: date
          description: Ziua al cărei sold de sfârșit de zi este raportat.
        opening_balance:
          $ref: '#/components/schemas/Money'
        opening_date:
          type: string
          format: date
          description: Data la care se aplică soldul inițial.
        bank:
          $ref: '#/components/schemas/ExpandableBank'
        external_account_id:
          type:
            - string
            - 'null'
          description: Identificatorul contului la furnizor. `null` pentru conturile manuale.
        original_name:
          type:
            - string
            - 'null'
          description: Numele contului așa cum îl raportează banca, înainte de orice redenumire în ThinkOut. `null` pentru conturile manuale.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        object: account
        id: c2d7e8f9-1a2b-4c3d-8e9f-0a1b2c3d4e5f
        name: ING Curent
        currency: RON
        group: Operational
        source: bank
        balance: '15230.45'
        balance_as_of: '2026-09-03'
        opening_balance: '1000.00'
        opening_date: '2024-01-01'
        bank: 5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f
        external_account_id: ACC-00012345
        original_name: Cont curent RON
        created_at: '2024-01-01T10:00:00Z'
        updated_at: '2026-08-30T06:00:00Z'
    Category:
      type: object
